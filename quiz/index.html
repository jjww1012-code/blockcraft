let nBots=3,nQ=10,diff=1,root=null;
const E=K.TG({game:'quiz',max:10,
 setup(ps,o){const qs=K.shuffle(Q.map((q,i)=>i)).slice(0,o.n||nQ);return{pl:ps.map(p=>({id:p.id,name:p.name,sc:0,ans:null,at:0,last:0,streak:0})),qs,qi:-1,phase:'pre',t0:0,log:'',diff:o.diff??diff}},
 actors:G=>G.phase==='q'?G.pl.filter(p=>p.ans==null).map(p=>p.id):[],over:G=>G.phase==='end',
 view(G,pid){const me=G.pl.findIndex(p=>p.id===pid);const q=G.qi>=0?Q[G.qs[G.qi]]:null;return{me,phase:G.phase,qi:G.qi,n:G.qs.length,q:q?{t:q[0],cat:q[5],opts:G.opts}:null,left:Math.max(0,15-(Date.now()-G.t0)/1000),correct:G.phase==='rev'?G.opts.indexOf(q[1]):-1,pl:G.pl.map((p,i)=>({name:p.name,sc:p.sc,done:p.ans!=null,ans:G.phase==='rev'||i===me?p.ans:null,last:p.last,streak:p.streak}))}},
 act(G,pid,a){if(a.k==='go'&&G.phase==='pre'){next(G);return true}const p=G.pl.find(q=>q.id===pid);if(!p||G.phase!=='q'||p.ans!=null)return false;p.ans=a.i;p.at=(Date.now()-G.t0)/1000;if(G.pl.every(q=>q.ans!=null))reveal(G);return true},
 bot(G,pid){const q=Q[G.qs[G.qi]];const acc=[.45,.65,.85][G.diff];const ok=Math.random()<acc;let i=G.opts.indexOf(q[1]);if(!ok)i=K.pick([0,1,2,3].filter(k=>k!==i));return{k:'ans',i}},
 botDelay:G=>700+Math.random()*2600,render});
function next(G){G.qi++;if(G.qi>=G.qs.length){G.phase='end';return}const q=Q[G.qs[G.qi]];G.opts=K.shuffle([q[1],q[2],q[3],q[4]]);G.pl.forEach(p=>{p.ans=null;p.last=0});G.phase='q';G.t0=Date.now();const qi=G.qi;E.later(15000,()=>{if(G.qi===qi&&G.phase==='q')reveal(G)})}
function reveal(G){if(G.phase!=='q')return;G.phase='rev';const q=Q[G.qs[G.qi]],c=G.opts.indexOf(q[1]);for(const p of G.pl){if(p.ans===c){p.streak++;const pts=Math.round(500+500*Math.max(0,1-p.at/15))+(p.streak>=3?200:0);p.sc+=pts;p.last=pts}else{p.streak=0;p.last=0}}E.later(3800,()=>next(G))}

  <div class="msg">${v.phase==='rev'?(me.ans===v.correct?'✅ Richtig! +'+me.last+(me.streak>=3?' 🔥 Serie!':''):'❌ Leider falsch'):me.ans!=null?'Antwort eingeloggt – warte auf die anderen …':''}</div>`;

@media(max-width:560px){.qopts{grid-template-columns:1fr}}`;document.head.appendChild(st);
