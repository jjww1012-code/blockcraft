<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../shared/nozoom.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Dame</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>:root{--a:#ffd23f;--b:#c0392b}</style>
</head>
<body>
<script src="../shared/peerjs.min.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/kit.js"></script>
<script>
'use strict';
/* DAME – Schlagpflicht, Mehrfachsprünge, fliegende Damen. */
let mode='ai',diff=1,root=null,selSq=-1;
const D=[[-1,-1],[-1,1],[1,-1],[1,1]];
const rc=i=>[i>>3,i&7],ix=(r,c)=>r*8+c,inb=(r,c)=>r>=0&&r<8&&c>=0&&c<8;
function initBoard(){const b=new Array(64).fill(0);for(let r=0;r<8;r++)for(let c=0;c<8;c++)if((r+c)%2===1){if(r<3)b[ix(r,c)]=-1;if(r>4)b[ix(r,c)]=1}return b}
const own=(v,side)=>side>0?v>0:v<0;
function capsFrom(b,i){const v=b[i],side=Math.sign(v),out=[];const [r,c]=rc(i);for(const [dr,dc] of D){if(Math.abs(v)===1){const r1=r+dr,c1=c+dc,r2=r+2*dr,c2=c+2*dc;if(inb(r2,c2)&&b[ix(r1,c1)]&&!own(b[ix(r1,c1)],side)&&!b[ix(r2,c2)])out.push({f:i,t:ix(r2,c2),x:ix(r1,c1)})}
 else{let rr=r+dr,cc=c+dc;while(inb(rr,cc)&&!b[ix(rr,cc)]){rr+=dr;cc+=dc}if(inb(rr,cc)&&!own(b[ix(rr,cc)],side)){const x=ix(rr,cc);rr+=dr;cc+=dc;while(inb(rr,cc)&&!b[ix(rr,cc)]){out.push({f:i,t:ix(rr,cc),x});rr+=dr;cc+=dc}}}}return out}
function stepsFrom(b,i){const v=b[i],out=[];const [r,c]=rc(i);for(const [dr,dc] of D){if(Math.abs(v)===1){if(dr!==(v>0?-1:1))continue;if(inb(r+dr,c+dc)&&!b[ix(r+dr,c+dc)])out.push({f:i,t:ix(r+dr,c+dc)})}else{let rr=r+dr,cc=c+dc;while(inb(rr,cc)&&!b[ix(rr,cc)]){out.push({f:i,t:ix(rr,cc)});rr+=dr;cc+=dc}}}return out}
function legal(b,side,chain){if(chain>=0)return capsFrom(b,chain);let caps=[];for(let i=0;i<64;i++)if(own(b[i],side))caps.push(...capsFrom(b,i));if(caps.length)return caps;let st=[];for(let i=0;i<64;i++)if(own(b[i],side))st.push(...stepsFrom(b,i));return st}
function applyMove(b,m){const nb=b.slice();const v=nb[m.f];nb[m.f]=0;nb[m.t]=v;let promo=false;if(m.x!=null)nb[m.x]=0;const [r]=rc(m.t);if(Math.abs(v)===1&&((v>0&&r===0)||(v<0&&r===7))){nb[m.t]=v*2;promo=true}return{b:nb,more:m.x!=null&&!promo&&capsFrom(nb,m.t).length>0}}
/* KI: vollständige Zugfolgen */
function seqs(b,side,chain){const out=[];for(const m of legal(b,side,chain)){const r=applyMove(b,m);if(r.more){for(const s of seqs(r.b,side,m.t))out.push({ms:[m,...s.ms],b:s.b})}else out.push({ms:[m],b:r.b})}return out}
function evalB(b){let s=0;for(let i=0;i<64;i++){const v=b[i];if(!v)continue;const [r]=rc(i);const val=Math.abs(v)===2?3.2:1+(v>0?(7-r):r)*.06;s+=v>0?val:-val}return s}
function mm(b,side,d,a,be){const ss=seqs(b,side,-1);if(!ss.length)return side>0?-99:99;if(d===0)return evalB(b);if(side>0){let v=-1e9;for(const s of ss){v=Math.max(v,mm(s.b,-1,d-1,a,be));a=Math.max(a,v);if(a>=be)break}return v}let v=1e9;for(const s of ss){v=Math.min(v,mm(s.b,1,d-1,a,be));be=Math.min(be,v);if(a>=be)break}return v}
function aiPick(b,side){const ss=K.shuffle(seqs(b,side,-1));const dep=[1,3,5][diff];let best=null,bv=-1e9;for(const s of ss){const v=mm(s.b,-side,dep,-1e9,1e9)*side+Math.random()*(diff===0?.8:.05);if(v>bv){bv=v;best=s}}return best?best.ms:[]}
const E=K.TG({game:'dame',max:2,seats:()=>2,
 setup(ps,o){return{pl:ps.map((p,i)=>({id:p.id,name:p.name,side:i===0?1:-1})),b:initBoard(),turn:0,chain:-1,log:'Weiß beginnt.',winner:null,local:!!o.local,plan:null,lastM:null,noCap:0}},
 actors:G=>G.winner?[]:[G.pl[G.turn].id],over:G=>!!G.winner,
 view(G,pid){let me=G.pl.findIndex(p=>p.id===pid);if(G.local)me=G.turn;const side=G.pl[G.turn].side;return{me,b:G.b,turn:G.turn,side,mySide:G.pl[me].side,moves:(me===G.turn&&!G.winner)?legal(G.b,side,G.chain):[],log:G.log,winner:G.winner,names:G.pl.map(p=>p.name),last:G.lastM,local:G.local,cnt:[G.b.filter(v=>v>0).length,G.b.filter(v=>v<0).length]}},
 act(G,pid,a){const i=G.pl.findIndex(p=>p.id===pid);if(!G.local&&i!==G.turn)return false;if(G.winner)return false;const side=G.pl[G.turn].side;const mv=legal(G.b,side,G.chain).find(m=>m.f===a.f&&m.t===a.t);if(!mv)return false;
  const r=applyMove(G.b,mv);G.b=r.b;G.lastM=mv;if(mv.x!=null)G.noCap=0;else G.noCap++;
  if(r.more){G.chain=mv.t;G.log=G.pl[G.turn].name+' muss weiterspringen!';return true}
  G.chain=-1;G.turn=1-G.turn;const ns=G.pl[G.turn].side;
  if(!legal(G.b,ns,-1).length){G.winner=G.pl[1-G.turn].name;G.log=G.winner+' gewinnt! 🏆'}else if(G.noCap>=50){G.winner='Unentschieden';G.log='Unentschieden (50 Züge ohne Schlagen)'}else G.log=(mv.x!=null?'Geschlagen! ':'')+G.pl[G.turn].name+' ist dran.';return true},
 bot(G,pid){const side=G.pl[G.turn].side;if(!G.plan||!G.plan.length)G.plan=aiPick(G.b,side);const m=G.plan.shift();return m?{f:m.f,t:m.t}:null},
 botDelay:G=>G.chain>=0?450:700,render});
let lastLog='';
function render(v,send){if(!root){root=document.createElement('div');root.className='tg';root.style.background='radial-gradient(900px 600px at 50% 40%,#3a2a1a,#1a120a)';document.body.appendChild(root)}root.style.display='flex';
 if(v.log!==lastLog){lastLog=v.log;K.sfx(/Geschlagen|weiter/.test(v.log)?'hit':'click')}const myTurn=v.me===v.turn&&!v.winner;
 const flip=!v.local&&v.mySide<0;const mvFrom=new Set(v.moves.map(m=>m.f)),targets=v.moves.filter(m=>m.f===selSq).map(m=>m.t);
 if(!mvFrom.has(selSq))selSq=-1;if(myTurn&&mvFrom.size===1)selSq=[...mvFrom][0];
 let cells='';for(let k=0;k<64;k++){const i=flip?63-k:k,[r,c]=rc(i),dark=(r+c)%2===1,p=v.b[i];
  cells+=`<div class="dq ${dark?'dk':'lt'} ${v.last&&(v.last.f===i||v.last.t===i)?'lm':''} ${targets.includes(i)?'tg':''} ${selSq===i?'sl':''}" data-i="${i}">${p?`<div class="dp ${p>0?'w':'b'} ${Math.abs(p)===2?'k':''} ${mvFrom.has(i)&&myTurn?'can':''}"></div>`:''}</div>`}
 root.innerHTML=`<div class="top"><a href="#" id="dB">← Menü</a><b>⛀ DAME</b><span>${E.room?'Raum '+E.room.code:''}</span></div>
 <div class="opps"><div class="opp ${v.turn===0?'turn':''}">⚪ ${K.esc(v.names[0])} · ${v.cnt[0]}</div><div class="opp ${v.turn===1?'turn':''}">⚫ ${K.esc(v.names[1])} · ${v.cnt[1]}</div></div>
 <div class="dboard">${cells}</div><div class="msg">${K.esc(v.log)}</div>
 <div class="msg" style="color:#ffd23f">${v.winner?'':myTurn?(v.moves.some(m=>m.x!=null)?'Schlagpflicht!':'Du bist dran'):'⏳ '+K.esc(v.names[v.turn])+' denkt nach …'}</div>
 ${v.winner&&E.host?'<button class="pri" id="dA">🔁 Neues Spiel</button>':''}`;
 K.$('dB').onclick=e=>{e.preventDefault();E.stop();root.style.display='none';menu()};if(K.$('dA'))K.$('dA').onclick=()=>start(mode);
 root.querySelectorAll('.dq').forEach(el=>el.onclick=()=>{if(!myTurn)return;const i=+el.dataset.i;if(targets.includes(i)){send({f:selSq,t:i});selSq=-1;return}if(mvFrom.has(i)){selSq=i;K.sfx('click');render(v,send)}});
 if(v.winner)K.sfx(v.winner===v.names[v.me]||v.local?'win':'lose')}
const st=document.createElement('style');st.textContent=`.dboard{display:grid;grid-template-columns:repeat(8,1fr);width:min(94vw,66vh,600px);height:min(94vw,66vh,600px);flex:0 0 auto;border:12px solid #5a3418;border-radius:10px;box-shadow:0 14px 30px rgba(0,0,0,.6)}
.dq{position:relative;display:grid;place-items:center}.dq.lt{background:#f0d9b5}.dq.dk{background:#9c6b3c}.dq.lm{box-shadow:inset 0 0 0 100px rgba(255,210,63,.25)}.dq.sl{box-shadow:inset 0 0 0 4px #ffd23f}
.dq.tg:after{content:"";position:absolute;width:30%;height:30%;border-radius:50%;background:rgba(46,213,115,.85);box-shadow:0 0 12px #2ed573}
.dp{width:78%;height:78%;border-radius:50%;box-shadow:0 4px 0 rgba(0,0,0,.45),inset 0 -4px 0 rgba(0,0,0,.2);position:relative}
.dp.w{background:radial-gradient(circle at 35% 30%,#fff,#e8e2d4 60%,#cfc6b0)}.dp.b{background:radial-gradient(circle at 35% 30%,#666,#222 60%,#111)}
.dp:before{content:"";position:absolute;inset:18%;border-radius:50%;border:3px solid rgba(0,0,0,.15)}.dp.b:before{border-color:rgba(255,255,255,.12)}
.dp.k:after{content:"♛";position:absolute;inset:0;display:grid;place-items:center;font-size:min(5vw,3.6vh,30px);color:#d4a017}
.dp.can{animation:dpb .7s infinite alternate}@keyframes dpb{to{box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 16px 4px #2ed573}}`;document.head.appendChild(st);
function start(m){mode=m;if(m==='ai')E.solo(1);else if(m==='local'){E.host=true;E.room=null;E.start([{id:K.uid(),name:'Weiß'},{id:K.uid()+'#2',name:'Schwarz'}],{local:true})}else if(E.room)E.start(E.players)}
function menu(){if(root)root.style.display='none';K.menu({title:'DAME',emoji:'⛀',sub:'Schlagpflicht, Mehrfachsprünge und fliegende Damen – der Strategie-Klassiker.',
 body:`<div class="k-box"><div class="k-set"><span>🤖 KI</span>${K.chips('dD',[[0,'Leicht'],[1,'Mittel'],[2,'Schwer']],diff,v=>diff=v)}</div></div>`,
 solo:[{t:'▶ Gegen KI',f:()=>start('ai')},{t:'👥 Zu zweit an einem Gerät',f:()=>start('local')}],online:{game:'dame',max:2,min:2,onStart:r=>{mode='online';E.hostStart(r,0)},botsNote:'Warte auf einen Gegner.'},
 help:'Steine ziehen schräg nach vorn und schlagen in alle Richtungen. Wer die letzte Reihe erreicht, wird zur Dame und darf weit ziehen. Schlagen ist Pflicht!'})}
menu();

</script>
</body>
</html>
