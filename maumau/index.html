<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../shared/nozoom.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Mau-Mau</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>:root{--a:#ffd23f;--b:#2ed573}</style>
</head>
<body>
<script src="../shared/peerjs.min.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/kit.js"></script>
<script>
'use strict';
/* MAU-MAU – 7 = zwei ziehen, 8 = aussetzen, Bube = Farbe wünschen. */
const SU=['♣','♠','♥','♦'],RK=['7','8','9','10','B','D','K','A'];
let nBots=3,root=null;
const E=K.TG({game:'maumau',max:6,
 setup(ps){const deck=[];for(const s of SU)for(const r of RK)deck.push({s,r});K.shuffle(deck);const G={pl:ps.map(p=>({id:p.id,name:p.name,hand:deck.splice(0,5),mau:false})),deck,pile:[deck.pop()],turn:0,dir:1,draw7:0,skip:false,wish:null,log:'Los geht\'s!',winner:null,drew:false};
  while(G.pile[0].r==='B'){deck.unshift(G.pile.pop());G.pile.push(deck.pop())}return G},
 actors:G=>G.winner?[]:[G.pl[G.turn].id],over:G=>!!G.winner,
 view(G,pid){const me=G.pl.findIndex(p=>p.id===pid);return{me,pl:G.pl.map((p,i)=>({name:p.name,n:p.hand.length,hand:i===me?p.hand:null})),top:G.pile[G.pile.length-1],turn:G.turn,draw7:G.draw7,wish:G.wish,log:G.log,winner:G.winner,deck:G.deck.length,drew:G.drew,playable:me===G.turn?G.pl[me].hand.map(c=>canPlay(G,c)):[]}},
 act(G,pid,a){const i=G.pl.findIndex(p=>p.id===pid);if(i!==G.turn||G.winner)return false;const p=G.pl[i];
  if(a.k==='draw'){if(G.draw7){for(let k=0;k<G.draw7;k++)take(G,p);G.log=p.name+' zieht '+G.draw7+' Karten';G.draw7=0;next(G);return true}if(G.drew){G.log=p.name+' passt';next(G);return true}take(G,p);G.drew=true;G.log=p.name+' zieht eine Karte';if(!p.hand.some(c=>canPlay(G,c))){next(G)}return true}
  if(a.k==='play'){const c=p.hand[a.i];if(!c||!canPlay(G,c))return false;if(c.r==='B'&&!SU.includes(a.w))return false;p.hand.splice(a.i,1);G.pile.push(c);G.drew=false;G.wish=null;
   let msg=p.name+' legt '+c.r+c.s;if(c.r==='7'){G.draw7+=2;msg+=' – nächster zieht '+G.draw7+'!'}if(c.r==='8'){G.skip=true;msg+=' – aussetzen!'}if(c.r==='B'){G.wish=a.w;msg+=' und wünscht sich '+a.w}
   if(p.hand.length===1)msg+=' – MAU!';if(!p.hand.length){G.winner=p.id;G.log=p.name+(c.r==='B'?' gewinnt mit MAU-MAU! 🎉':' gewinnt! 🎉');return true}G.log=msg;next(G);return true}return false},
 bot(G,pid){const p=G.pl.find(q=>q.id===pid);const ok=p.hand.map((c,i)=>[c,i]).filter(([c])=>canPlay(G,c));if(!ok.length)return{k:'draw'};ok.sort((a,b)=>(a[0].r==='B')-(b[0].r==='B')||(b[0].r==='7')-(a[0].r==='7'));const [c,i]=ok[0];let w=null;if(c.r==='B'){const cnt={};for(const q of p.hand)if(q!==c)cnt[q.s]=(cnt[q.s]||0)+1;w=Object.keys(cnt).sort((a,b)=>cnt[b]-cnt[a])[0]||'♥'}return{k:'play',i,w}},
 render});
function canPlay(G,c){const top=G.pile[G.pile.length-1];if(G.draw7)return c.r==='7';if(c.r==='B')return top.r!=='B'||!!G.wish;if(G.wish)return c.s===G.wish;return c.s===top.s||c.r===top.r}
function take(G,p){if(!G.deck.length){const top=G.pile.pop();G.deck=K.shuffle(G.pile);G.pile=[top]}if(G.deck.length)p.hand.push(G.deck.pop())}
function next(G){G.drew=false;const n=G.pl.length;G.turn=(G.turn+G.dir+n)%n;if(G.skip){G.skip=false;G.turn=(G.turn+G.dir+n)%n}}
let lastLog='',wishFor=null;
function render(v,send){if(!root){root=document.createElement('div');root.className='tg';document.body.appendChild(root)}root.style.display='flex';
 if(v.log!==lastLog){lastLog=v.log;K.sfx('card')}const myTurn=v.turn===v.me&&!v.winner;
 root.innerHTML=`<div class="top"><a href="#" id="mmBack">← Menü</a><b>🃏 MAU-MAU</b><span>${E.room?'Raum '+E.room.code:''}</span></div>
 <div class="opps">${v.pl.map((p,i)=>i===v.me?'':`<div class="opp ${v.turn===i?'turn':''}">${K.esc(p.name)}<div style="font-size:22px">🂠 × ${p.n}</div>${p.n===1?'<div style="color:#ffd23f">MAU!</div>':''}</div>`).join('')}</div>
 <div style="display:flex;gap:26px;align-items:center;margin:16px 0">
  <div style="text-align:center">${K.cardHTML(null,'','id="mmDeck"')}<div class="k-mut" style="color:#cfe">${v.deck} Karten</div></div>
  <div style="text-align:center">${K.cardHTML(v.top,'','style="transform:rotate(-4deg) scale(1.15)"')}${v.wish?`<div style="font-size:22px;margin-top:8px">Wunsch: <b class="${v.wish==='♥'||v.wish==='♦'?'red':''}" style="font-size:30px;color:${v.wish==='♥'||v.wish==='♦'?'#ff5a6a':'#fff'}">${v.wish}</b></div>`:''}</div></div>
 <div class="msg">${K.esc(v.log)}</div><div class="msg" style="color:#ffd23f">${v.winner?'':myTurn?(v.draw7?'Leg eine 7 oder zieh '+v.draw7+'!':'Du bist dran!'):'⏳ '+K.esc(v.pl[v.turn].name)+' ist dran …'}</div>
 <div class="bar">${myTurn?`<button class="pri" id="mmDraw">${v.draw7?'🂠 '+v.draw7+' ziehen':v.drew?'⏭ Passen':'🂠 Karte ziehen'}</button>`:''}${v.winner?`<button class="pri" id="mmAgain">🔁 Neue Runde</button>`:''}</div>
 <div class="hand">${(v.pl[v.me].hand||[]).map((c,i)=>K.cardHTML(c,myTurn?(v.playable[i]?'play':'dim'):'',`data-i="${i}"`)).join('')}</div>
 <div id="mmWish" style="display:none" class="k-box"><b>Welche Farbe wünschst du dir?</b><div class="bar">${SU.map(s=>`<button data-w="${s}" style="font-size:30px;min-width:64px;color:${s==='♥'||s==='♦'?'#ff5a6a':'#fff'}">${s}</button>`).join('')}</div></div>`;
 K.$('mmBack').onclick=e=>{e.preventDefault();E.stop();root.style.display='none';menu()};
 if(K.$('mmDraw'))K.$('mmDraw').onclick=()=>send({k:'draw'});
 if(K.$('mmAgain'))K.$('mmAgain').onclick=()=>{if(E.host){if(E.room)E.start(E.players);else E.solo(nBots)}else K.toast('Der Gastgeber startet die nächste Runde')};
 root.querySelectorAll('.hand .kc').forEach(el=>el.onclick=()=>{if(!myTurn)return;const i=+el.dataset.i,c=v.pl[v.me].hand[i];if(!v.playable[i]){K.sfx('bad');return}if(c.r==='B'){wishFor=i;K.$('mmWish').style.display='flex';return}send({k:'play',i})});
 root.querySelectorAll('#mmWish [data-w]').forEach(b=>b.onclick=()=>send({k:'play',i:wishFor,w:b.dataset.w}));
 if(v.winner){const w=v.pl.find((p,i)=>i===v.me)&&v.pl[v.me].n===0;K.sfx(w?"win":"lose")}}
function menu(){if(root)root.style.display='none';K.menu({title:'MAU-MAU',emoji:'🃏',sub:'Der Kartenspiel-Klassiker: Farbe auf Farbe, Zahl auf Zahl. Wer zuerst keine Karten mehr hat, gewinnt!',
 body:`<div class="k-box"><div class="k-set"><span>🤖 Gegner</span>${K.chips('mmB',[[1,'1'],[2,'2'],[3,'3'],[5,'5']],nBots,v=>nBots=v)}</div></div>`,
 solo:[{t:'▶ Gegen Bots spielen',f:()=>E.solo(nBots)}],online:{game:'maumau',max:6,onStart:r=>E.hostStart(r,Math.max(0,Math.min(nBots,6-r.peers.length)))},
 help:'7 → der Nächste zieht 2 (kann mit einer 7 weitergeben). 8 → der Nächste setzt aus. Bube → geht auf alles und du wünschst dir eine Farbe.'})}
menu();

</script>
</body>
</html>
