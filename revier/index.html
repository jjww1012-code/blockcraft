<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../shared/nozoom.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">

</head>
<body>
<script src="../shared/peerjs.min.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/kit.js"></script>
<script>
'use strict';
/* REVIER 2.0 – Gebiet erobern mit freier Lenkung in einer runden Arena. Gastgeber simuliert. */
const N=320,CS=6,WSZ=N*CS,CX=WSZ/2,CY=WSZ/2,ARENA=WSZ/2-CS*3,SPD=150,TURN=5.2,TAU=Math.PI*2;
const COL=['#ff4757','#2e86de','#ffd23f','#2ed573','#ff7ad9','#ff9f1a','#7d5fff','#18dcff','#00b894','#e17055','#fd79a8','#a29bfe'];
const RGB=COL.map(h=>{const n=parseInt(h.slice(1),16);return[n>>16,n>>8&255,n&255]});
const C=K.canvas(1,1,{fill:true}),x=C.x;const stick=K.stick({r:50});
let S=null,room=null,isHost=true,myId=K.uid(),state='menu',best=K.store.get('rv_best2',0),mySkin=K.store.get('rv_skin',0);
const inArena=new Uint8Array(N*N);for(let j=0;j<N;j++)for(let i=0;i<N;i++){const dx=(i+.5)*CS-CX,dy=(j+.5)*CS-CY;inArena[j*N+i]=dx*dx+dy*dy<ARENA*ARENA?1:0}
/* ================= Simulation ================= */
function newWorld(){S={own:new Uint8Array(N*N),trail:new Uint8Array(N*N),pl:[],by:new Map(),chg:[],ev:[],t:0}}
function setOwn(i,v){if(S.own[i]!==v){S.own[i]=v;S.chg.push(i,v);if(view)paintCell(i,v)}}
function addPlayer(id,name,skin,bot){const p={slot:S.pl.length+1,id,name,skin:skin%COL.length,bot,alive:false,kills:0,x:0,y:0,a:0,ta:0,tr:[],sent:0,cell:-1,cnt:0,best:0,born:0,plan:[],think:0,wait:0,ag:bot?.3+Math.random()*.7:0};S.pl.push(p);S.by.set(id,p);spawn(p);return p}
function spawn(p){// nie in fremdem Gebiet/fremder Spur spawnen – bester freier Platz gewinnt
 let cx=CX,cy=CY,bs=1e9;for(let k=0;k<400&&bs>0;k++){const a=Math.random()*TAU,r=Math.sqrt(Math.random())*(ARENA-80),tx=CX+Math.cos(a)*r,ty=CY+Math.sin(a)*r,ci=tx/CS|0,cj=ty/CS|0;let sc=0;
  for(let j=-12;j<=12;j++)for(let i=-12;i<=12;i++){const q=(cj+j)*N+ci+i;if(q<0||q>=N*N||!inArena[q]){sc++;continue}if((S.own[q]&&S.own[q]!==p.slot)||S.trail[q])sc+=(i*i+j*j<=16?1e5:1)}
  if(sc<bs){bs=sc;cx=tx;cy=ty}}
 const ci=cx/CS|0,cj=cy/CS|0;for(let j=-8;j<=8;j++)for(let i=-8;i<=8;i++){if(i*i+j*j>60)continue;const q=(cj+j)*N+ci+i;if(q>=0&&q<N*N&&inArena[q]&&!S.trail[q]&&(!S.own[q]||S.own[q]===p.slot||(i*i+j*j<=2)))setOwn(q,p.slot)}
 p.x=(ci+.5)*CS;p.y=(cj+.5)*CS;p.a=p.ta=Math.atan2(CY-p.y,CX-p.x)+(Math.random()-.5);p.tr=[];p.sent=0;p.cell=cj*N+ci;p.alive=true;p.wait=p.bot?0:1.2;p.plan=[];p.born=S.t;p.best=0;recount()}
function kill(p,by){if(!p.alive)return;p.alive=false;for(const i of p.tr)if(S.trail[i]===p.slot)S.trail[i]=0;p.tr=[];p.sent=0;for(let i=0;i<N*N;i++)if(S.own[i]===p.slot)setOwn(i,0);
 S.ev.push(['die',Math.round(p.x),Math.round(p.y),p.skin,by?by.slot:0]);if(by&&by!==p)by.kills++;
 if(p.bot)setTimeout(()=>{if(S&&S.pl.includes(p))spawn(p)},2500);else{const info={t:'dead',id:p.id,by:by&&by!==p?by.name:'',pct:p.best,kills:p.kills,time:Math.round(S.t-p.born)};if(p.id===myId)died(info);else if(room)room.send(info)}recount()}
const stack=new Int32Array(N*N),seen=new Uint8Array(N*N);
function capture(p){const s=p.slot;for(const i of p.tr){S.trail[i]=0;setOwn(i,s)}p.tr=[];p.sent=0;
 seen.fill(0);let sp=0;for(let i=0;i<N*N;i++)if(!inArena[i]){seen[i]=1;stack[sp++]=i}
 // Flutfüllung von außen über alles, was nicht mir gehört
 while(sp){const i=stack[--sp],cx=i%N;const nb=[cx>0?i-1:-1,cx<N-1?i+1:-1,i-N,i+N];for(const q of nb){if(q<0||q>=N*N||seen[q]||S.own[q]===s)continue;seen[q]=1;stack[sp++]=q}}
 let n=0;const victims=new Set();for(let i=0;i<N*N;i++){if(!seen[i]&&S.own[i]!==s){if(S.trail[i]&&S.trail[i]!==s)victims.add(S.trail[i]);setOwn(i,s);n++}}
 for(const v of victims){const q=S.pl[v-1];if(q)kill(q,p)}
 S.ev.push(['cap',Math.round(p.x),Math.round(p.y),p.skin,n]);recount()}
function enterCell(p,c){const ox=p.cell%N,oy=p.cell/N|0,nx=c%N,ny=c/N|0;
 if(ox!==nx&&oy!==ny){// diagonal: Zwischenfeld, damit die Spur dicht ist
  const mid=oy*N+nx;if(!stepCell(p,mid))return}
 stepCell(p,c)}
function stepCell(p,c){if(!inArena[c])return false;p.cell=c;
 const t=S.trail[c];if(t){const o=S.pl[t-1];if(o===p){if(p.tr.lastIndexOf(c)>=p.tr.length-4){p.cell=c;return true}/* Ruckler am Rand */kill(p,null);return false}if(o&&o.alive)kill(o,p)}
 if(S.own[c]===p.slot){if(p.tr.length)capture(p)}else{S.trail[c]=p.slot;p.tr.push(c)}return true}
function stepPlayer(p,dt){if(!p.alive)return;if(p.wait>0){p.wait-=dt;return}if(p.bot)botThink(p,dt);
 let d=Math.atan2(Math.sin(p.ta-p.a),Math.cos(p.ta-p.a));const mt=TURN*dt;p.a+=K.clamp(d,-mt,mt);
 const sp=SPD;p.x+=Math.cos(p.a)*sp*dt;p.y+=Math.sin(p.a)*sp*dt;
 {const dx=p.x-CX,dy=p.y-CY,d=Math.hypot(dx,dy),R=ARENA-CS*2.5;if(d>R){p.x=CX+dx/d*R;p.y=CY+dy/d*R}}// Rand: entlanggleiten statt sterben
 const ci=K.clamp(p.x/CS|0,0,N-1),cj=K.clamp(p.y/CS|0,0,N-1),c=cj*N+ci;if(c!==p.cell)enterCell(p,c)}
function headOn(){for(let i=0;i<S.pl.length;i++){const a=S.pl[i];if(!a.alive||a.wait>0)continue;for(let j=i+1;j<S.pl.length;j++){const b=S.pl[j];if(!b.alive||b.wait>0)continue;if(Math.hypot(a.x-b.x,a.y-b.y)<CS*2.2){
  const ai=S.own[a.cell]===a.slot,bi=S.own[b.cell]===b.slot;if(ai&&!bi)kill(b,a);else if(bi&&!ai)kill(a,b);else if(!ai&&!bi){if(a.tr.length>b.tr.length)kill(a,b);else kill(b,a)}}}}}
const cnt=new Map();function recount(){cnt.clear();for(let i=0;i<N*N;i++){const v=S.own[i];if(v)cnt.set(v,(cnt.get(v)||0)+1)}for(const p of S.pl){p.cnt=cnt.get(p.slot)||0;p.best=Math.max(p.best,p.cnt/TOTAL*100)}}
let TOTAL=0;for(let i=0;i<N*N;i++)TOTAL+=inArena[i];
/* ---------- Bots ---------- */
function nearestOwn(p,maxR){const ci=p.x/CS|0,cj=p.y/CS|0;for(let r=1;r<maxR;r++){let best=null,bd=1e9;for(let j=-r;j<=r;j++)for(let i=-r;i<=r;i++){if(Math.abs(i)!==r&&Math.abs(j)!==r)continue;const q=(cj+j)*N+ci+i;if(q<0||q>=N*N)continue;if(S.own[q]===p.slot){const d=i*i+j*j;if(d<bd){bd=d;best=[(ci+i+.5)*CS,(cj+j+.5)*CS]}}}if(best)return best}return null}
function dangerAhead(p,a,dist){for(let s=CS;s<dist;s+=CS*.7){const X=p.x+Math.cos(a)*s,Y=p.y+Math.sin(a)*s,ci=X/CS|0,cj=Y/CS|0;if(ci<0||cj<0||ci>=N||cj>=N)continue;const q=cj*N+ci;if(inArena[q]&&S.trail[q]===p.slot)return true}return false}
function botThink(p,dt){p.think-=dt;const home=S.own[p.cell]===p.slot;
 // Gefahr: Gegner nahe meiner Spur?
 let threat=false;if(p.tr.length){for(const q of S.pl){if(q===p||!q.alive)continue;for(let k=0;k<p.tr.length;k+=4){const c=p.tr[k],tx=(c%N+.5)*CS,ty=((c/N|0)+.5)*CS;if(Math.hypot(q.x-tx,q.y-ty)<70+p.tr.length*.3){threat=true;break}}if(threat)break}}
 const goHome=()=>{const h=nearestOwn(p,60);if(h){p.ta=Math.atan2(h[1]-p.y,h[0]-p.x);p.plan=[]}};
 if(!home&&(threat||p.tr.length>40+p.ag*90)){goHome()}
 else if(p.plan.length){const w=p.plan[0];if(Math.hypot(w[0]-p.x,w[1]-p.y)<CS*2)p.plan.shift();else p.ta=Math.atan2(w[1]-p.y,w[0]-p.x);if(!p.plan.length&&!home)goHome()}
 else if(home&&p.think<=0){p.think=.4+Math.random()*.6;// neue Schleife planen
  const a=p.a+(Math.random()-.5)*1.6,L1=40+Math.random()*(60+p.ag*120),L2=30+Math.random()*(50+p.ag*90),turn=Math.random()<.5?1:-1;
  const w1=[p.x+Math.cos(a)*L1,p.y+Math.sin(a)*L1],a2=a+turn*Math.PI/2,w2=[w1[0]+Math.cos(a2)*L2,w1[1]+Math.sin(a2)*L2];const inR=w=>{const dx=w[0]-CX,dy=w[1]-CY,d=Math.hypot(dx,dy),R=ARENA-CS*6;return d>R?[CX+dx/d*R,CY+dy/d*R]:w};p.plan=[inR(w1),inR(w2)]}
 else if(!home&&!p.plan.length)goHome();
 // Hindernisse (eigene Spur, Rand)
 if(dangerAhead(p,p.ta,26)){for(const off of[.6,-.6,1.2,-1.2,1.8,-1.8,2.5,-2.5]){if(!dangerAhead(p,p.ta+off,26)){p.ta+=off;break}}p.plan=[]}
 // Jagd: fremde Spur in der Nähe kreuzen
 if(p.ag>.6&&Math.random()<dt*2){for(const q of S.pl){if(q===p||!q.alive||!q.tr.length)continue;const c=q.tr[q.tr.length>>1],tx=(c%N+.5)*CS,ty=((c/N|0)+.5)*CS;if(Math.hypot(tx-p.x,ty-p.y)<120&&!dangerAhead(p,Math.atan2(ty-p.y,tx-p.x),Math.hypot(tx-p.x,ty-p.y))){p.ta=Math.atan2(ty-p.y,tx-p.x);p.plan=[];break}}}}
function sim(dt){S.t+=dt;for(const p of S.pl)stepPlayer(p,dt);headOn();if((S.t*10|0)%5===0)recount()}
/* ================= Netz ================= */
function rle(a){const o=[];let v=a[0],n=1;for(let i=1;i<a.length;i++){if(a[i]===v)n++;else{o.push(v,n);v=a[i];n=1}}o.push(v,n);return o}
function snap(full){const o={t:'st',pl:S.pl.map(p=>{const tr=p.tr.slice(p.sent);const st=p.sent;p.sent=p.tr.length;return[p.slot,p.id,p.name,p.skin,p.alive?1:0,Math.round(p.x*10)/10,Math.round(p.y*10)/10,+p.a.toFixed(2),p.cnt,p.kills,full?0:st,full?p.tr.slice():tr,p.tr.length]}),ev:S.ev.splice(0)};
 if(full){o.own=rle(S.own);S.chg=[]}else o.ch=S.chg.splice(0);return o}
let shC=null,view=null,cOwn=new Uint8Array(N*N),cTr=new Map(),img=null,imgC=null,dirty=true;
function paintCell(i,v){if(!img)return;const k=i*4;if(v){const c=RGB[(view&&view.skinOf[v])??((v-1)%COL.length)];img.data[k]=c[0];img.data[k+1]=c[1];img.data[k+2]=c[2];img.data[k+3]=255}else img.data[k+3]=0;dirty=true}
function applySnap(m){if(!img){imgC=document.createElement('canvas');imgC.width=imgC.height=N;img=imgC.getContext('2d').createImageData(N,N)}
 const prevPl=view?view.pl:[];view={pl:m.pl.map(q=>({slot:q[0],id:q[1],name:q[2],skin:q[3],alive:q[4],x:q[5],y:q[6],a:q[7],n:q[8],kills:q[9]})),skinOf:{}};for(const p of view.pl)view.skinOf[p.slot]=p.skin;
 for(const q of m.pl){let t=cTr.get(q[0])||[];if(q[10]===0&&q[11].length===q[12])t=q[11].slice();else{if(t.length<q[10])t=t.slice();t=t.slice(0,q[10]).concat(q[11])}t.length=Math.min(t.length,q[12]);cTr.set(q[0],t)}
 for(const p of view.pl){const o=prevPl.find(q=>q.slot===p.slot);p.rx=o&&o.alive&&Math.hypot(o.rx-p.x,o.ry-p.y)<60?o.rx:p.x;p.ry=o&&o.alive&&Math.hypot(o.rx-p.x,o.ry-p.y)<60?o.ry:p.y}
 if(m.own){let i=0;for(let k=0;k<m.own.length;k+=2){for(let n=0;n<m.own[k+1];n++){cOwn[i]=m.own[k];paintCell(i,m.own[k]);i++}}}
 if(m.ch)for(let i=0;i<m.ch.length;i+=2){cOwn[m.ch[i]]=m.ch[i+1];paintCell(m.ch[i],m.ch[i+1])}
 for(const e of m.ev||[]){if(e[0]==='die'){K.burst(e[1],e[2],40,COL[e[3]],360,.9,8);const me=view.pl.find(p=>p.id===myId);if(me&&e[4]===me.slot){K.sfx('coin');K.toast('💀 Erwischt!')}}
  if(e[0]==='cap'){const me=view.pl.find(p=>p.id===myId);if(me&&COL[e[3]]&&Math.hypot(e[1]-cam.x,e[2]-cam.y)<600){if(me.skin===e[3])K.sfx('good');K.burst(e[1],e[2],Math.min(40,8+e[4]/20|0),COL[e[3]],220,.6,6)}}}}
function wire(){room.on('msg',(m,from)=>{if(m.t==='start'){room=K.room;isHost=false;cTr.clear();img=null;go()}else if(m.t==='st'&&!isHost)applySnap(m);else if(m.t==='in'&&isHost){const p=S&&S.by.get(from);if(p&&isFinite(+m.a)){p.ta=+m.a;if(p.wait>.3)p.wait=.3}}else if(m.t==='respawn'&&isHost){const p=S&&S.by.get(from);if(p&&!p.alive)spawn(p)}else if(m.t==='dead'&&m.id===myId&&!isHost)died(m)})}
const _lobby=K.lobby;K.lobby=o=>{if(K.room&&!K.room._w){K.room._w=1;room=K.room;isHost=K.room.isHost;wire()}_lobby(o)};
/* ================= Ablauf ================= */
let maxPct=0;
function died(info){if(state!=='play')return;state='dead';K.sfx('lose');const pct=Math.max(maxPct,info.pct||0);if(pct>best){best=pct;K.store.set('rv_best2',best)}
 setTimeout(()=>K.result('ERWISCHT!',`<p style="font-size:17px">${info.by?'Von <b>'+K.esc(info.by)+'</b> erwischt.':'Unfall! Eigene Spur berührt.'}</p><table class="k-table"><tr><td>Größtes Gebiet</td><td><b>${pct.toFixed(2)} %</b></td></tr><tr><td>Erwischt</td><td>${info.kills||0}</td></tr><tr><td>Überlebt</td><td>${info.time||0} s</td></tr><tr><td>Rekord</td><td>${best.toFixed(2)} %</td></tr></table>`,[{t:'↻ Nochmal',f:respawn},{t:'Menü',f:toMenu}]),700)}
function respawn(){K.hideAll();state='play';maxPct=0;if(isHost)spawn(S.by.get(myId));else room.send({t:'respawn'})}
function startSolo(){room=null;isHost=true;newWorld();cTr.clear();img=null;addPlayer(myId,K.name(),mySkin,false);for(let i=0;i<9;i++)addPlayer('b'+i,K.BOTS[i],mySkin+1+i,true);go()}
function hostStart(r){room=r;isHost=true;newWorld();cTr.clear();img=null;r.peers.forEach((p,i)=>addPlayer(p.id,p.name,p.skin??i,false));for(let i=0;i<Math.max(3,10-r.peers.length);i++)addPlayer('b'+i,K.BOTS[i],i+5,true);r.send({t:'start'});setTimeout(()=>r.send(snap(true)),300);go()}
function go(){state='play';maxPct=0;K.hideAll();if(isHost){img=null;view=null;applySnap(snap(true))}K.toast(K.touch?'Ziehen zum Lenken – verlasse dein Gebiet und kehre zurück!':'Maus oder Pfeiltasten lenken – verlasse dein Gebiet und kehre zurück!',3500)}
function toMenu(){K.leaveRoom();room=null;S=null;view=null;state='menu';menu()}
/* ================= Eingabe ================= */
let mouse={x:0,y:0,use:false},keyA=null,lastSent=0,sendT=0;addEventListener('pointermove',e=>{if(e.pointerType==='mouse'){mouse.x=e.clientX;mouse.y=e.clientY;mouse.use=true}});
function input(dt){if(state!=='play'||!view)return;const me=view.pl.find(p=>p.id===myId);if(!me)return;let a=null;
 if(stick.on&&(stick.x||stick.y))a=Math.atan2(stick.y,stick.x);else{const k=K.dirKeys();if(k.x||k.y){a=Math.atan2(k.y,k.x);mouse.use=false}else if(mouse.use){const sx=(me.rx-cam.x)*cam.z+innerWidth/2,sy=(me.ry-cam.y)*cam.z+innerHeight/2;if(Math.hypot(mouse.x-sx,mouse.y-sy)>8)a=Math.atan2(mouse.y-sy,mouse.x-sx)}}
 if(a==null)return;if(isHost){const p=S.by.get(myId);if(p){p.ta=a;if(p.wait>.3)p.wait=.3}}else{sendT-=dt;if(sendT<=0&&Math.abs(a-lastSent)>.01){sendT=.05;lastSent=a;room.send({t:'in',a:+a.toFixed(3)})}}}
/* ================= Zeichnen ================= */
const cam={x:CX,y:CY,z:1};const shade=(h,a)=>{const n=parseInt(h.slice(1),16);const f=v=>K.clamp(v+a,0,255)|0;return`rgb(${f(n>>16)},${f(n>>8&255)},${f(n&255)})`};
function draw(dt,t){const W=innerWidth,H=innerHeight;x.setTransform(C.D,0,0,C.D,0,0);x.fillStyle='#232a44';x.fillRect(0,0,W,H);if(!view)return;
 const me=view.pl.find(p=>p.id===myId);
 // Spieler-Positionen glätten (Vorhersage in Blickrichtung)
 for(const p of view.pl){if(!p.alive)continue;const k=Math.min(1,dt*14);p.rx+=(p.x-p.rx)*k;p.ry+=(p.y-p.ry)*k}
 if(me&&me.alive){cam.x+=(me.rx-cam.x)*Math.min(1,dt*8);cam.y+=(me.ry-cam.y)*Math.min(1,dt*8);maxPct=Math.max(maxPct,me.n/TOTAL*100)}
 const zt=Math.min(W,H)/540;cam.z+=(zt-cam.z)*.1;
 x.translate(W/2,H/2);x.scale(cam.z,cam.z);x.translate(-cam.x,-cam.y);
 // Arena
 x.fillStyle='#1a2036';x.beginPath();x.arc(CX,CY+8,ARENA+10,0,TAU);x.fill();x.fillStyle='#eef1f8';x.beginPath();x.arc(CX,CY,ARENA,0,TAU);x.fill();
 x.save();x.beginPath();x.arc(CX,CY,ARENA,0,TAU);x.clip();x.strokeStyle='rgba(120,135,180,.12)';x.lineWidth=1.5;x.beginPath();const l=cam.x-W/2/cam.z,r=cam.x+W/2/cam.z,tp=cam.y-H/2/cam.z,b=cam.y+H/2/cam.z;
 for(let g=Math.floor(l/36)*36;g<r;g+=36){x.moveTo(g,tp);x.lineTo(g,b)}for(let g=Math.floor(tp/36)*36;g<b;g+=36){x.moveTo(l,g);x.lineTo(r,g)}x.stroke();x.restore();
 // Gebiet (3D: dunkle Seite + Oberseite)
 if(dirty){imgC.getContext('2d').putImageData(img,0,0);if(!shC){shC=document.createElement('canvas');shC.width=shC.height=N}const q=shC.getContext('2d');q.globalCompositeOperation='source-over';q.clearRect(0,0,N,N);q.drawImage(imgC,0,0);q.globalCompositeOperation='source-atop';q.fillStyle='rgba(0,0,0,.42)';q.fillRect(0,0,N,N);dirty=false}x.imageSmoothingEnabled=false;
 x.drawImage(shC,0,4,WSZ,WSZ);x.drawImage(imgC,0,0,WSZ,WSZ);x.imageSmoothingEnabled=true;
 // Spuren
 x.lineCap='round';x.lineJoin='round';
