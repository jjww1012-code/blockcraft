<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../shared/nozoom.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Revier</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>:root{--a:#2ed573;--b:#ffd23f}</style>
</head>
<body>
<script src="../shared/peerjs.min.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/kit.js"></script>
<script>
'use strict';
/* REVIER – Gebiet einkreisen (Paper-Stil). Gastgeber simuliert das Raster. */
const G=90,CS=20,SPD=6.5,TAU=Math.PI*2;
const COL=['#ff4757','#2e86de','#ffd23f','#2ed573','#ff7ad9','#ff9f1a','#7d5fff','#18dcff','#00b894','#e17055','#fd79a8','#a29bfe'];
const C=K.canvas(1,1,{fill:true}),x=C.x;
let S=null,room=null,isHost=true,myId=K.uid(),view=null,state='menu',best=K.store.get('rv_best',0),mySkin=K.store.get('rv_skin',0);
const DX=[1,0,-1,0],DY=[0,1,0,-1];
function newWorld(){S={own:new Uint8Array(G*G),trail:new Uint8Array(G*G),pl:[],slots:new Map(),chg:[],ev:[]}}
const idx=(cx,cy)=>cy*G+cx;
function addPlayer(id,name,skin,bot){const slot=S.pl.length+1;const p={slot,id,name,skin:skin%COL.length,bot,alive:false,kills:0,best:0,dir:0,want:0,cx:0,cy:0,prog:0,tr:[],think:0,plan:[]};S.pl.push(p);S.slots.set(id,p);spawn(p);return p}
function setOwn(i,v){if(S.own[i]!==v){S.own[i]=v;S.chg.push(i,v)}}
function spawn(p){for(let tries=0;tries<200;tries++){const cx=4+Math.floor(Math.random()*(G-8)),cy=4+Math.floor(Math.random()*(G-8));let ok=true;for(let y=-3;y<=3&&ok;y++)for(let xx=-3;xx<=3;xx++)if(S.own[idx(cx+xx,cy+y)]){ok=false;break}if(!ok&&tries<150)continue;
 for(let y=-2;y<=2;y++)for(let xx=-2;xx<=2;xx++)setOwn(idx(cx+xx,cy+y),p.slot);p.cx=cx;p.cy=cy;p.prog=0;p.dir=p.want=Math.floor(Math.random()*4);p.tr=[];p.alive=true;p.plan=[];p.wait=p.bot?0:4;return}}
function kill(p,by){if(!p.alive)return;p.alive=false;for(const i of p.tr)S.trail[i]=0;p.tr=[];for(let i=0;i<G*G;i++)if(S.own[i]===p.slot)setOwn(i,0);S.ev.push(['die',p.cx,p.cy,p.slot,by?by.slot:0]);if(by)by.kills++;
 if(p.bot)setTimeout(()=>{if(S)spawn(p)},3000);if(p.id===myId)died(by?by.name:null);else if(room&&!p.bot)room.send({t:'dead',id:p.id,by:by?by.name:null})}
function fill(p){// Spur wird Gebiet, eingeschlossene Fläche füllen
 for(const i of p.tr){S.trail[i]=0;setOwn(i,p.slot)}p.tr=[];
 const seen=new Uint8Array(G*G),st=[];for(let i=0;i<G;i++){st.push(i,idx(i,G-1),idx(0,i),idx(G-1,i))}
 while(st.length){const i=st.pop();if(seen[i]||S.own[i]===p.slot)continue;seen[i]=1;const cx=i%G,cy=(i/G)|0;if(cx>0)st.push(i-1);if(cx<G-1)st.push(i+1);if(cy>0)st.push(i-G);if(cy<G-1)st.push(i+G)}
 let n=0;for(let i=0;i<G*G;i++)if(!seen[i]&&S.own[i]!==p.slot){setOwn(i,p.slot);n++}
 for(const q of S.pl)if(q!==p&&q.alive&&!seen[idx(q.cx,q.cy)]&&S.own[idx(q.cx,q.cy)]===p.slot&&q.tr.length===0)kill(q,p);
 S.ev.push(['fill',p.cx,p.cy,p.slot])}
function stepPlayer(p,dt){if(!p.alive)return;if(p.wait>0){p.wait-=dt;return}if(p.bot)botThink(p);p.prog+=SPD*dt;
 while(p.prog>=1){p.prog-=1;if((p.want+2)%4!==p.dir||p.tr.length===0)p.dir=p.want;
  const nx=p.cx+DX[p.dir],ny=p.cy+DY[p.dir];if(nx<0||ny<0||nx>=G||ny>=G){kill(p,null);return}
  p.cx=nx;p.cy=ny;const i=idx(nx,ny);
  if(S.trail[i]){const o=S.pl[S.trail[i]-1];if(o===p){kill(p,null);return}kill(o,p)}
  for(const q of S.pl)if(q!==p&&q.alive&&q.cx===nx&&q.cy===ny){const a=countOwn(p),b=countOwn(q);if(a>=b)kill(q,p);else{kill(p,q);return}}
  if(S.own[i]===p.slot){if(p.tr.length)fill(p)}else{S.trail[i]=p.slot;p.tr.push(i)}}}
function countOwn(p){let n=0;for(let i=0;i<G*G;i++)if(S.own[i]===p.slot)n++;return n}
function botThink(p){if(p.prog<.5||p.wt===p.cx+','+p.cy)return;p.wt=p.cx+','+p.cy;const home=S.own[idx(p.cx,p.cy)]===p.slot;
 const safe=d=>{const nx=p.cx+DX[d],ny=p.cy+DY[d];if(nx<1||ny<1||nx>=G-1||ny>=G-1)return false;if(S.trail[idx(nx,ny)]===p.slot)return false;return(d+2)%4!==p.dir||!p.tr.length};
 // Gefahr: Gegner nah an meiner Spur -> heimwärts
 if(home){if(!p.plan.length&&Math.random()<.25){const d=Math.floor(Math.random()*4),a=4+Math.floor(Math.random()*7),b=3+Math.floor(Math.random()*6),turn=Math.random()<.5?1:3;p.plan=[...Array(a).fill(d),...Array(b).fill((d+turn)%4),...Array(a+2).fill((d+2)%4)]}}
 let d=p.plan.length?p.plan.shift():p.want;
 if(!home&&p.tr.length>28){let bd=1e9,bt=null;for(let k=0;k<4;k++){if(!safe(k))continue;const nx=p.cx+DX[k],ny=p.cy+DY[k];let near=1e9;for(let r=1;r<20&&near===1e9;r++)for(let yy=-r;yy<=r;yy+=r)for(let xx=-r;xx<=r;xx++){const X=nx+xx,Y=ny+yy;if(X>=0&&Y>=0&&X<G&&Y<G&&S.own[idx(X,Y)]===p.slot){near=r;break}}if(near<bd){bd=near;bt=k}}if(bt!=null){d=bt;p.plan=[]}}
 if(!safe(d)){const opts=[0,1,2,3].filter(safe);if(opts.length)d=opts[Math.floor(Math.random()*opts.length)];p.plan=[]}p.want=d}
function sim(dt){for(const p of S.pl)stepPlayer(p,dt);for(const p of S.pl){p.best=Math.max(p.best,countOwnFast(p))}}
const cnt=new Map();function countOwnFast(p){return cnt.get(p.slot)||0}
function recount(){cnt.clear();for(let i=0;i<G*G;i++){const v=S.own[i];if(v)cnt.set(v,(cnt.get(v)||0)+1)}}
/* ---------- Netz ---------- */
function snap(full){recount();const o={t:'st',pl:S.pl.map(p=>[p.slot,p.id,p.name,p.skin,p.alive?1:0,p.cx,p.cy,+p.prog.toFixed(2),p.dir,cnt.get(p.slot)||0,p.kills,p.tr]),ev:S.ev.splice(0)};
 if(full)o.own=Array.from(S.own);else o.ch=S.chg.splice(0);if(full)S.chg=[];return o}
let cOwn=new Uint8Array(G*G);
function applySnap(m){if(m.own)cOwn=Uint8Array.from(m.own);if(m.ch)for(let i=0;i<m.ch.length;i+=2)cOwn[m.ch[i]]=m.ch[i+1];
 const prev=view;view={pl:m.pl.map(q=>({slot:q[0],id:q[1],name:q[2],skin:q[3],alive:q[4],cx:q[5],cy:q[6],prog:q[7],dir:q[8],n:q[9],kills:q[10],tr:q[11]})),t:performance.now()};
 for(const e of m.ev||[]){if(e[0]==='die'){K.burst(e[1]*CS+CS/2,e[2]*CS+CS/2,30,COL[(view.pl.find(p=>p.slot===e[3])||{skin:0}).skin],300);const me=view.pl.find(p=>p.id===myId);if(me&&e[4]===me.slot){K.sfx('coin');K.toast('💀 Erwischt!')}}if(e[0]==='fill'){const me=view.pl.find(p=>p.id===myId);if(me&&e[3]===me.slot)K.sfx('good')}}}
function wire(){room.on('msg',(m,from)=>{if(m.t==='start'){room=K.room;isHost=false;go()}else if(m.t==='st'&&!isHost)applySnap(m);else if(m.t==='in'&&isHost){const p=S.slots.get(from);if(p&&m.d>=0&&m.d<4){p.want=m.d;p.wait=0}}else if(m.t==='respawn'&&isHost){const p=S.slots.get(from);if(p&&!p.alive)spawn(p)}else if(m.t==='dead'&&m.id===myId&&!isHost)died(m.by)})}
const _lobby=K.lobby;K.lobby=o=>{if(K.room&&!K.room._w){K.room._w=1;room=K.room;isHost=K.room.isHost;wire()}_lobby(o)};
/* ---------- Ablauf ---------- */
let maxPct=0;
function died(by){state='dead';K.sfx('lose');const pct=maxPct;if(pct>best){best=pct;K.store.set('rv_best',best)}setTimeout(()=>K.result('ERWISCHT!',`<p style="font-size:18px">${by?'Von <b>'+K.esc(by)+'</b> geschnitten.':'Unfall!'}<br>Größtes Gebiet: <b>${pct.toFixed(1)} %</b><br>Rekord: <b>${best.toFixed(1)} %</b></p>`,[{t:'↻ Nochmal',f:respawn},{t:'Menü',f:toMenu}]),600)}
function respawn(){K.hideAll();state='play';maxPct=0;if(isHost)spawn(S.slots.get(myId));else room.send({t:'respawn'})}
function startSolo(){room=null;isHost=true;newWorld();addPlayer(myId,K.name(),mySkin,false);for(let i=0;i<9;i++)addPlayer('b'+i,K.BOTS[i],mySkin+1+i,true);go()}
function hostStart(r){room=r;isHost=true;newWorld();r.peers.forEach((p,i)=>addPlayer(p.id,p.name,p.skin??i,false));for(let i=0;i<Math.max(3,10-r.peers.length);i++)addPlayer('b'+i,K.BOTS[i],i+5,true);r.send({t:'start'});setTimeout(()=>r.send(snap(true)),300);go()}
function go(){state='play';maxPct=0;K.hideAll();if(isHost)applySnap(snap(true));K.toast('Verlasse dein Gebiet und kehre zurück, um Land einzukreisen!')}
function toMenu(){K.leaveRoom();room=null;S=null;view=null;state='menu';menu()}
/* ---------- Eingabe: Wischen / Tasten ---------- */
let sw=null,lastDir=-1;function setDir(d){if(d===lastDir&&!isHost)return;lastDir=d;if(isHost){const p=S&&S.slots.get(myId);if(p){p.want=d;p.wait=0}}else if(room)room.send({t:'in',d})}
addEventListener('keydown',e=>{if(state!=='play')return;const m={arrowright:0,d:0,arrowdown:1,s:1,arrowleft:2,a:2,arrowup:3,w:3}[e.key.toLowerCase()];if(m!=null){setDir(m);e.preventDefault()}});
addEventListener('pointerdown',e=>{if(K.cur)return;sw={x:e.clientX,y:e.clientY}});
addEventListener('pointermove',e=>{if(!sw||K.cur)return;const dx=e.clientX-sw.x,dy=e.clientY-sw.y;if(Math.hypot(dx,dy)>22){setDir(Math.abs(dx)>Math.abs(dy)?(dx>0?0:2):(dy>0?1:3));sw={x:e.clientX,y:e.clientY}}});
addEventListener('pointerup',()=>sw=null);
/* ---------- Zeichnen ---------- */
const cam={x:G*CS/2,y:G*CS/2};const shade=(h,a)=>{const n=parseInt(h.slice(1),16);let r=(n>>16)+a,g=(n>>8&255)+a,b=(n&255)+a;r=K.clamp(r,0,255);g=K.clamp(g,0,255);b=K.clamp(b,0,255);return`rgb(${r},${g},${b})`};
function draw(dt){const W=innerWidth,H=innerHeight;x.setTransform(C.D,0,0,C.D,0,0);x.fillStyle='#1a1f36';x.fillRect(0,0,W,H);if(!view)return;
 const k=Math.min(1,(performance.now()-view.t)/66),slotCol=s=>{const p=view.pl.find(q=>q.slot===s);return p?COL[p.skin]:'#888'};
 const me=view.pl.find(p=>p.id===myId);const pos=p=>{const pr=K.clamp(p.prog+k*SPD*.066,0,1);return{x:(p.cx+DX[p.dir]*pr*0)*CS+CS/2,y:(p.cy)*CS+CS/2,rx:(p.cx+DX[p.dir]*Math.min(pr,.99))*CS+CS/2,ry:(p.cy+DY[p.dir]*Math.min(pr,.99))*CS+CS/2}};
 if(me&&me.alive){const q=pos(me);cam.x+=(q.rx-cam.x)*.15;cam.y+=(q.ry-cam.y)*.15;const pct=me.n/(G*G)*100;maxPct=Math.max(maxPct,pct)}
 const z=Math.min(W,H)/720*1.05;x.translate(W/2,H/2);x.scale(z,z);x.translate(-cam.x,-cam.y);
 x.fillStyle='#f3f5fb';x.fillRect(0,0,G*CS,G*CS);x.fillStyle='#e6e9f3';for(let cy=0;cy<G;cy++)for(let cx=(cy%2);cx<G;cx+=2)x.fillRect(cx*CS,cy*CS,CS,CS);
 const l=Math.max(0,Math.floor((cam.x-W/2/z)/CS)-1),r=Math.min(G,Math.ceil((cam.x+W/2/z)/CS)+1),t=Math.max(0,Math.floor((cam.y-H/2/z)/CS)-1),b=Math.min(G,Math.ceil((cam.y+H/2/z)/CS)+1);
 for(let cy=t;cy<b;cy++)for(let cx=l;cx<r;cx++){const o=cOwn[cy*G+cx];if(!o)continue;const c=slotCol(o);x.fillStyle=shade(c,-50);x.fillRect(cx*CS,cy*CS+4,CS,CS);x.fillStyle=c;x.fillRect(cx*CS,cy*CS,CS,CS)}
 for(const p of view.pl){if(!p.alive)continue;const c=COL[p.skin];x.fillStyle=c+'88';for(const i of p.tr){x.fillRect((i%G)*CS+3,((i/G)|0)*CS+3,CS-6,CS-6)}}
 for(const p of view.pl){if(!p.alive)continue;const q=pos(p),c=COL[p.skin];x.fillStyle=shade(c,-60);K.rr(x,q.rx-CS*.7,q.ry-CS*.7+5,CS*1.4,CS*1.4,7);x.fill();x.fillStyle=shade(c,25);K.rr(x,q.rx-CS*.7,q.ry-CS*.7,CS*1.4,CS*1.4,7);x.fill();
  x.fillStyle='#fff';x.beginPath();x.arc(q.rx-5+DX[p.dir]*3,q.ry-3+DY[p.dir]*3,4,0,7);x.arc(q.rx+5+DX[p.dir]*3,q.ry-3+DY[p.dir]*3,4,0,7);x.fill();x.fillStyle='#111';x.beginPath();x.arc(q.rx-5+DX[p.dir]*4,q.ry-3+DY[p.dir]*4,2,0,7);x.arc(q.rx+5+DX[p.dir]*4,q.ry-3+DY[p.dir]*4,2,0,7);x.fill();
  x.font='800 13px system-ui';x.textAlign='center';x.lineWidth=4;x.strokeStyle='rgba(0,0,0,.5)';x.strokeText(p.name,q.rx,q.ry-22);x.fillStyle='#fff';x.fillText(p.name,q.rx,q.ry-22)}
 x.strokeStyle='#2a3354';x.lineWidth=6;x.strokeRect(0,0,G*CS,G*CS);
 K.partsStep(dt);K.partsDraw(x);
 x.setTransform(C.D,0,0,C.D,0,0);const lb=[...view.pl].filter(p=>p.alive).sort((a,b)=>b.n-a.n).slice(0,8);
 x.fillStyle='rgba(0,0,0,.45)';K.rr(x,W-196,10,186,32+lb.length*21,12);x.fill();x.font='800 15px system-ui';x.textAlign='left';x.fillStyle='#ffd23f';x.fillText('🏆 Gebiet'+(room?' · '+room.code:''),W-184,32);
 lb.forEach((p,i)=>{const pct=p.n/(G*G)*100;x.fillStyle=COL[p.skin];x.fillRect(W-184,44+i*21,pct*1.5+4,16);x.fillStyle='#fff';x.font='700 12px system-ui';x.fillText((i+1)+'. '+p.name.slice(0,10),W-180,57+i*21);x.textAlign='right';x.fillText(pct.toFixed(1)+'%',W-18,57+i*21);x.textAlign='left'});
 if(me&&me.alive){x.fillStyle='rgba(0,0,0,.55)';K.rr(x,8,H-78,230,70,12);x.fill();x.fillStyle='#fff';x.font='900 24px system-ui';x.fillText((me.n/(G*G)*100).toFixed(2)+' %',16,H-22);x.font='600 13px system-ui';x.fillText('💀 '+me.kills+'   Rekord '+best.toFixed(1)+' %',16,H-50)}}
let snapT=0;K.loop(dt=>{if(isHost&&S&&state!=='menu'){sim(dt);snapT-=dt;if(snapT<=0){snapT=.066;const s=snap(false);if(room)room.send(s);applySnap(s)}}draw(dt)});
function menu(){K.menu({title:'REVIER',emoji:'🟩',sub:'Kreise Land ein, schneide Gegnern die Spur ab und erobere die Karte!',
 body:`<div class="k-box"><h3>Farbe</h3><div class="k-chips" id="skins">${COL.map((c,i)=>`<button data-v="${i}" style="background:${c};min-width:36px;height:36px;border:3px solid ${i==mySkin?'#fff':'transparent'}"></button>`).join('')}</div><div class="k-mut">Rekord: <b>${best.toFixed(1)} %</b></div></div>`,
 solo:[{t:'▶ Spielen (mit Bots)',f:startSolo}],online:{game:'revier',max:10,info:()=>({skin:mySkin}),onStart:hostStart},help:'Steuern: Wischen oder Pfeiltasten/WASD. Wer deine Spur berührt, erwischt dich – und du stirbst, wenn du deine eigene Spur kreuzt.'});
 K.$('skins').onclick=e=>{const b=e.target.closest('button');if(!b)return;mySkin=+b.dataset.v;K.store.set('rv_skin',mySkin);menu()}}
menu();
window.RV={get S(){return S},get view(){return view}};

</script>
</body>
</html>
