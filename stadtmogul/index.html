const GC={br:'#8d5524',hb:'#5fc8f5',pi:'#e84fb0',or:'#ff9f1a',rt:'#e63946',ge:'#f4c20d',gr:'#22a559',db:'#2a4fd6'};

 {t:'jail',n:'Gefängnis'},{t:'st',n:'Skaterpark',g:'pi',p:140,r:10},{t:'ut',n:'Stromwerk',p:150},{t:'st',n:'Pixelplatz',g:'pi',p:140,r:10},{t:'st',n:'Gamerstraße',g:'pi',p:160,r:12},{t:'rr',n:'Westbahnhof',p:200},{t:'st',n:'Pizzaweg',g:'or',p:180,r:14},{t:'cm',n:'Gemeinschaft'},{t:'st',n:'Dönerdamm',g:'or',p:180,r:14},{t:'st',n:'Burgerboulevard',g:'or',p:200,r:16},
 {t:'park',n:'Frei Parken'},{t:'st',n:'Raketenring',g:'rt',p:220,r:18},{t:'ch',n:'Ereignis'},{t:'st',n:'Mondstraße',g:'rt',p:220,r:18},{t:'st',n:'Sternenallee',g:'rt',p:240,r:20},{t:'rr',n:'Nordbahnhof',p:200},{t:'st',n:'Goldgräberweg',g:'ge',p:260,r:22},{t:'st',n:'Diamantgasse',g:'ge',p:260,r:22},{t:'ut',n:'Wasserwerk',p:150},{t:'st',n:'Schatzinsel',g:'ge',p:280,r:24},
 {t:'gojail',n:'Ab ins Gefängnis'},{t:'st',n:'Drachenhöhe',g:'gr',p:300,r:26},{t:'st',n:'Zauberwald',g:'gr',p:300,r:26},{t:'cm',n:'Gemeinschaft'},{t:'st',n:'Einhornwiese',g:'gr',p:320,r:28},{t:'rr',n:'Ostbahnhof',p:200},{t:'ch',n:'Ereignis'},{t:'st',n:'Schlossallee 2.0',g:'db',p:350,r:35},{t:'tax',n:'Luxussteuer',a:100},{t:'st',n:'Königspalast',g:'db',p:400,r:50}];
const HM=[1,5,15,45,62,78];
const hc=f=>f.p<=120?50:f.p<=200?100:f.p<=280?150:200;
const buyable=f=>['st','rr','ut'].includes(f.t);
const ICON={go:'🏁',jail:'🚔',park:'🅿️',gojail:'👮',rr:'🚂',ch:'❓',cm:'🎁',tax:'💸'};
const TOK=['🚗','🎩','🐶','🚀','⛵','🦖'],PCOL=['#ff4757','#2e86de','#f4c20d','#2ed573','#b15cff','#ff9f1a'];
const CH=[['Rücke vor bis LOS (+200 €)','go'],['Gehe ins Gefängnis!','jail'],['Gehe 3 Felder zurück','b3'],['Rücke vor zum Nordbahnhof','to25'],['Rücke vor zum Königspalast','to39'],['Rücke vor zum Skaterpark','to11'],['Bank zahlt dir Dividende: +50 €',50],['Renovierung: 25 € pro Haus, 100 € pro Hotel','rep'],['Strafzettel: zahle 15 €',-15],['Du gewinnst ein Kreuzworträtsel: +100 €',100],['Du wirst Klassensprecher – zahle jedem 50 €','each'],['Frei aus dem Gefängnis – Karte behalten!','free']];
const CM=[['Du findest 50 € im Sofa',50],['Geburtstag! Alle zahlen dir je 10 €','bd'],['Handy-Reparatur: zahle 100 €',-100],['Schul-Wettbewerb gewonnen: +100 €',100],['Rücke vor bis LOS (+200 €)','go'],['Gehe ins Gefängnis!','jail'],['Zinsen: +20 €',20],['Lotto-Gewinn: +200 €',200],['Kino-Abend: zahle 50 €',-50],['Steuerrückzahlung: +20 €',20],['Straßenfest: 40 € pro Haus, 115 € pro Hotel','rep2'],['Frei aus dem Gefängnis – Karte behalten!','free']];
let nBots=K.store.get('sm_bots',3),rounds=K.store.get('sm_rounds',30),parkPot=K.store.get('sm_park',true),root=null,modal=null,curV=null,curSend=null,lastLog='',lastWin=null,shownPos=[],animT=null,diceAnim=0,lastDice='',tradeDraft=null;
const E=K.TG({game:'mogul',max:6,
 setup(ps,o){return{pl:ps.map((p,i)=>({id:p.id,name:p.name,c:PCOL[i%6],tok:TOK[i%6],pos:0,m:1500,jail:0,out:false,dbl:0,free:0,bot:!!p.bot})),own:{},hs:{},mort:{},turn:0,phase:'roll',dice:[0,0],rolls:0,log:['Willkommen in Stadtmogul! Jeder startet mit 1500 €.'],winner:null,round:1,maxR:o.rounds||30,card:null,pot:0,park:o.park!==false,offer:null}},
 actors:G=>G.winner?[]:G.phase==='trade'?[G.pl[G.offer.to].id]:[G.pl[G.turn].id],over:G=>!!G.winner,
 view(G,pid){const me=G.pl.findIndex(p=>p.id===pid);return{me,pl:G.pl,own:G.own,hs:G.hs,mort:G.mort,turn:G.turn,phase:G.phase,dice:G.dice,rolls:G.rolls,log:G.log,winner:G.winner,round:G.round,maxR:G.maxR,card:G.card,pot:G.pot,park:G.park,offer:G.offer,build:me>=0?buildable(G,me):[]}},
 act(G,pid,a){const i=G.pl.findIndex(p=>p.id===pid);if(G.winner||i<0)return false;const p=G.pl[i];
  if(G.phase==='trade'){if(i!==G.offer.to)return false;if(a.k==='accept'){doTrade(G);log(G,'🤝 '+p.name+' nimmt den Handel an!')}else if(a.k==='decline')log(G,'❌ '+p.name+' lehnt den Handel ab.');else return false;G.phase=G.offer.back;G.offer=null;return true}
  // Verwaltung (nur am Zug, außer beim Kaufen-Dialog)
  if(a.k==='build'||a.k==='sell'||a.k==='mort'||a.k==='unmort'){if(i!==G.turn)return false;return manage(G,i,a)}
  if(i!==G.turn)return false;
  if(a.k==='roll'&&G.phase==='roll'){roll(G,p);return true}
  if(a.k==='buy'&&G.phase==='buy'){const f=F[p.pos];if(p.m<f.p)return false;p.m-=f.p;G.own[p.pos]=i;log(G,p.name+' kauft '+f.n+' für '+f.p+' € 🏠');finishLand(G,p);return true}
  if(a.k==='skip'&&G.phase==='buy'){log(G,p.name+' kauft '+F[p.pos].n+' nicht');finishLand(G,p);return true}
  if(a.k==='bail'&&G.phase==='roll'&&p.jail){if(p.free){p.free--;p.jail=0;log(G,p.name+' nutzt die Frei-Karte 🎫')}else{if(p.m<50)return false;p.m-=50;toPot(G,50);p.jail=0;log(G,p.name+' zahlt 50 € Kaution')}return true}
  if(a.k==='offer'&&(G.phase==='roll'||G.phase==='end')){const o=sanitizeOffer(G,i,a.o);if(!o)return false;G.offer=Object.assign(o,{from:i,back:G.phase});G.phase='trade';log(G,'🤝 '+p.name+' bietet '+G.pl[o.to].name+' einen Handel an');return true}
  if(a.k==='end'&&G.phase==='end'){nextP(G);return true}return false},
 bot(G,pid){const i=G.pl.findIndex(p=>p.id===pid),p=G.pl[i];
  if(G.phase==='trade')return botJudge(G)?{k:'accept'}:{k:'decline'};
  if(G.phase==='roll'){if(p.jail&&(p.free||(p.m>500&&G.round<20)))return{k:'bail'};const um=Object.keys(G.mort).map(Number).filter(k=>G.own[k]===i&&p.m-F[k].p*.55>400);if(um.length)return{k:'unmort',f:um[0]};return{k:'roll'}}
  if(G.phase==='buy'){const f=F[p.pos];const completes=f.g&&F.every((q,k)=>q.g!==f.g||k===p.pos||G.own[k]===i);return p.m-f.p>=(completes?0:G.round>12?60:110)?{k:'buy'}:{k:'skip'}}
  if(G.phase==='end'){const b=buildable(G,i).filter(k=>p.m-hc(F[k])>220);if(b.length){b.sort((x,y)=>(G.hs[x]||0)-(G.hs[y]||0)||F[y].p-F[x].p);return{k:'build',f:b[0]}}
   const um=Object.keys(G.mort).map(Number).filter(k=>G.own[k]===i&&p.m-F[k].p*.55>350);if(um.length)return{k:'unmort',f:um[0]};return{k:'end'}}return null},
 botDelay:G=>G.phase==='roll'?1000:G.phase==='trade'?1400:800,render});
function log(G,t){G.log.push(t);if(G.log.length>7)G.log.shift()}
function toPot(G,n){if(G.park)G.pot+=n}
function group(g){return F.map((q,j)=>[q,j]).filter(([q])=>q.g===g).map(([,j])=>j)}
function buildable(G,i){const p=G.pl[i];const out=[];F.forEach((f,k)=>{if(f.t!=='st'||G.own[k]!==i||(G.hs[k]||0)>=5||p.m<hc(f))return;const grp=group(f.g);if(!grp.every(j=>G.own[j]===i&&!G.mort[j]))return;const mn=Math.min(...grp.map(j=>G.hs[j]||0));if((G.hs[k]||0)>mn)return;out.push(k)});return out}
function manage(G,i,a){const p=G.pl[i],k=a.f|0,f=F[k];if(G.own[k]!==i)return false;
 if(a.k==='build'){if(!buildable(G,i).includes(k))return false;p.m-=hc(f);G.hs[k]=(G.hs[k]||0)+1;log(G,p.name+' baut '+(G.hs[k]===5?'ein Hotel 🏨':'ein Haus 🏠')+' auf '+f.n);return true}
 if(a.k==='sell'){const h=G.hs[k]||0;if(!h)return false;const grp=group(f.g);if(h<Math.max(...grp.map(j=>G.hs[j]||0)))return false;G.hs[k]=h-1;if(!G.hs[k])delete G.hs[k];p.m+=hc(f)/2;log(G,p.name+' verkauft ein Haus auf '+f.n);return true}
 if(a.k==='mort'){if(G.mort[k])return false;if(f.g&&group(f.g).some(j=>G.hs[j]))return false;G.mort[k]=1;p.m+=f.p/2;log(G,p.name+' nimmt eine Hypothek auf '+f.n+' (+'+f.p/2+' €)');return true}
 if(a.k==='unmort'){const c=Math.round(f.p*.55);if(!G.mort[k]||p.m<c)return false;p.m-=c;delete G.mort[k];log(G,p.name+' löst die Hypothek auf '+f.n);return true}return false}
function roll(G,p){const d=[1+Math.floor(Math.random()*6),1+Math.floor(Math.random()*6)];G.dice=d;G.rolls++;const dbl=d[0]===d[1];G.card=null;
 if(p.jail){if(dbl){p.jail=0;log(G,p.name+' würfelt '+d[0]+'+'+d[1]+' – Pasch, frei! 🎉');G.again=false;move(G,p,d[0]+d[1]);return}p.jail++;if(p.jail>3){pay(G,p,50,null);toPot(G,50);p.jail=0;log(G,p.name+' zahlt nach 3 Runden 50 € und kommt frei');G.again=false;move(G,p,d[0]+d[1]);return}log(G,p.name+' würfelt '+d[0]+'+'+d[1]+' und bleibt im Gefängnis ('+(p.jail-1)+'/3)');G.phase='end';G.again=false;return}
 if(dbl){p.dbl++;if(p.dbl>=3){toJail(G,p);log(G,p.name+' würfelt 3× Pasch – ab ins Gefängnis! 🚔');return}}else p.dbl=0;G.again=dbl;log(G,p.name+' würfelt '+d[0]+' + '+d[1]+(dbl?' – Pasch!':''));move(G,p,d[0]+d[1])}
function move(G,p,n){const old=p.pos;p.pos=(p.pos+n+40)%40;if(n>0&&p.pos<old){p.m+=200;log(G,p.name+' kommt über LOS: +200 €')}land(G,p)}
function moveTo(G,p,k){if(k<p.pos){p.m+=200;log(G,p.name+' kommt über LOS: +200 €')}p.pos=k;land(G,p)}
function toJail(G,p){p.pos=10;p.jail=1;p.dbl=0;G.again=false;G.phase='end'}
function rent(G,k){const f=F[k],o=G.own[k];if(G.mort[k])return 0;if(f.t==='st'){const h=G.hs[k]||0;if(h)return f.r*HM[h];return group(f.g).every(j=>G.own[j]===o)?f.r*2:f.r}
 if(f.t==='rr'){const n=[5,15,25,35].filter(j=>G.own[j]===o).length;return 25*Math.pow(2,n-1)}if(f.t==='ut'){const n=[12,28].filter(j=>G.own[j]===o).length;return(G.dice[0]+G.dice[1])*(n===2?10:4)}return 0}
function land(G,p){const k=p.pos,f=F[k],i=G.pl.indexOf(p);G.phase='end';
 if(buyable(f)){const o=G.own[k];if(o==null){G.phase='buy';return}if(o!==i&&!G.pl[o].out){const r=rent(G,k);if(G.mort[k])log(G,f.n+' hat eine Hypothek – keine Miete');else{log(G,p.name+' zahlt '+r+' € Miete an '+G.pl[o].name);pay(G,p,r,G.pl[o])}}}
 else if(f.t==='tax'){log(G,p.name+': '+f.n+' '+f.a+' €');pay(G,p,f.a,null);toPot(G,f.a)}
 else if(f.t==='park'){if(G.park&&G.pot>0){log(G,'🅿️ '+p.name+' kassiert den Topf: +'+G.pot+' €!');p.m+=G.pot;G.pot=0}}
 else if(f.t==='gojail'){toJail(G,p);log(G,p.name+' muss ins Gefängnis! 🚔');return}
 else if(f.t==='ch'||f.t==='cm'){const c=K.pick(f.t==='ch'?CH:CM);G.card={t:f.t,txt:c[0]};log(G,(f.t==='ch'?'❓ ':'🎁 ')+c[0]);const v=c[1];
  if(typeof v==='number'){if(v>0)p.m+=v;else{pay(G,p,-v,null);toPot(G,-v)}}
  else if(v==='bd'){for(const q of G.pl)if(q!==p&&!q.out)pay(G,q,10,p)}
  else if(v==='each'){for(const q of G.pl)if(q!==p&&!q.out)pay(G,p,50,q)}
  else if(v==='go'){p.pos=0;p.m+=200}else if(v==='jail'){toJail(G,p);return}else if(v==='free')p.free++;
  else if(v==='b3'){p.pos=(p.pos+37)%40;land(G,p);return}else if(v.startsWith('to')){moveTo(G,p,+v.slice(2));return}
  else if(v==='rep'||v==='rep2'){let h=0,ho=0;for(const k2 in G.hs)if(G.own[k2]===i){if(G.hs[k2]===5)ho++;else h+=G.hs[k2]}const c=v==='rep'?h*25+ho*100:h*40+ho*115;if(c){pay(G,p,c,null);toPot(G,c)}}}
 finishLand(G,p,true)}
function finishLand(G,p){if(p.out){G.phase='end';checkOver(G);return}G.phase=(G.again&&!p.jail)?'roll':'end';checkOver(G)}
function raise(G,i,amt){// Geld beschaffen: Häuser verkaufen, Hypotheken aufnehmen
 const p=G.pl[i];let guard=0;while(p.m<amt&&guard++<200){const hk=Object.keys(G.hs).map(Number).filter(k=>G.own[k]===i).sort((a,b)=>(G.hs[b]||0)-(G.hs[a]||0))[0];if(hk!=null){G.hs[hk]--;if(!G.hs[hk])delete G.hs[hk];p.m+=hc(F[hk])/2;continue}
  const mk=Object.keys(G.own).map(Number).filter(k=>G.own[k]===i&&!G.mort[k]).sort((a,b)=>F[a].p-F[b].p)[0];if(mk!=null){G.mort[mk]=1;p.m+=F[mk].p/2;continue}break}}
function pay(G,p,amt,to){if(amt<=0)return;const i=G.pl.indexOf(p);if(p.m<amt)raise(G,i,amt);
 if(p.m<amt){const got=Math.max(0,p.m);if(to)to.m+=got;p.m=0;p.out=true;const ti=to?G.pl.indexOf(to):-1;for(const k in G.own)if(G.own[k]===i){delete G.hs[k];if(ti>=0)G.own[k]=ti;else{delete G.own[k];delete G.mort[k]}}if(to&&p.free){to.free+=p.free;p.free=0}log(G,'💸 '+p.name+' ist PLEITE!'+(to?' Alles geht an '+to.name+'.':''));return}
 p.m-=amt;if(to)to.m+=amt}
function worth(G,i){let w=G.pl[i].m;for(const k in G.own)if(G.own[k]===i)w+=(G.mort[k]?F[k].p/2:F[k].p)+(G.hs[k]||0)*hc(F[k]);return w}
function checkOver(G){const al=G.pl.filter(p=>!p.out);if(al.length===1){G.winner=al[0].name;log(G,'🏆 '+G.winner+' ist der Stadtmogul!')}}
function nextP(G){const n=G.pl.length;G.pl[G.turn].dbl=0;let t=G.turn;do{t=(t+1)%n;if(t===0)G.round++}while(G.pl[t].out);G.turn=t;G.phase='roll';G.again=false;G.card=null;
 if(G.round>G.maxR){let b=-1,bi=0;G.pl.forEach((p,i)=>{if(p.out)return;const w=worth(G,i);if(w>b){b=w;bi=i}});G.winner=G.pl[bi].name;log(G,'⏱ Rundenlimit – '+G.winner+' ist am reichsten ('+b+' €)! 🏆')}}
/* ---------- Handel ---------- */
function sanitizeOffer(G,from,o){if(!o)return null;const to=o.to|0;if(to===from||!G.pl[to]||G.pl[to].out)return null;const give=(o.give||[]).map(Number).filter(k=>G.own[k]===from&&!group(F[k].g||'x').some(j=>G.hs[j])),get=(o.get||[]).map(Number).filter(k=>G.own[k]===to&&!group(F[k].g||'x').some(j=>G.hs[j]));
 const gm=Math.max(0,Math.min(G.pl[from].m,o.gm|0)),wm=Math.max(0,Math.min(G.pl[to].m,o.wm|0));if(!give.length&&!get.length&&!gm&&!wm)return null;return{to,give,get,gm,wm}}
function doTrade(G){const o=G.offer,a=G.pl[o.from],b=G.pl[o.to];for(const k of o.give)G.own[k]=o.to;for(const k of o.get)G.own[k]=o.from;a.m+=o.wm-o.gm;b.m+=o.gm-o.wm}
function propVal(G,k,i,own){const f=F[k];let v=f.p*(G.mort[k]?.55:1);if(f.g){const grp=group(f.g),mine=grp.filter(j=>own(j)===i).length;if(mine===grp.length)v*=2.6;else if(mine===grp.length-1)v*=1.5}if(f.t==='rr')v*=1+[5,15,25,35].filter(j=>own(j)===i).length*.2;return v}
function botJudge(G){const o=G.offer,me=o.to,them=o.from;const before=G.own,after=k=>o.give.includes(k)?me:o.get.includes(k)?them:G.own[k];const cur=k=>G.own[k];
 let mine=0,theirs=0;for(const k in G.own){const K2=+k;if(after(K2)===me)mine+=propVal(G,K2,me,after);if(cur(K2)===me)mine-=propVal(G,K2,me,cur);if(after(K2)===them)theirs+=propVal(G,K2,them,after);if(cur(K2)===them)theirs-=propVal(G,K2,them,cur)}
 mine+=o.gm-o.wm;theirs+=o.wm-o.gm;return mine>40&&mine>=theirs*.6}
/* ---------- Darstellung ---------- */
const posOf=k=>{if(k<=10)return[10-k,10];if(k<=20)return[0,20-k];if(k<=30)return[k-20,0];return[10,k-30]};
const ctr=c=>c===0?.75:c===10?11.25:1.5+(c-1)+.5;
const PIPS={1:[4],2:[0,8],3:[0,4,8],4:[0,2,6,8],5:[0,2,4,6,8],6:[0,2,3,5,6,8]};
const die=n=>`<div class="mdie">${[...Array(9)].map((_,i)=>`<i class="${(PIPS[n]||[]).includes(i)?'on':''}"></i>`).join('')}</div>`;
function tileHTML(k){const f=F[k],side=k===0||k===10||k===20||k===30?-1:Math.floor(k/10);const [c,r]=posOf(k);
 let inner;if(side<0)inner=`<div class="mcorner c${k/10}"><span class="mbig">${ICON[f.t]}</span><b>${f.n}</b>${f.t==='park'?'<small id="mPot"></small>':''}</div>`;
 else inner=`<div class="min s${side}">${f.g?`<div class="mbar" style="background:${GC[f.g]}"><span id="mH${k}"></span></div>`:`<div class="mico">${f.t==='ut'?(k===12?'⚡':'💧'):ICON[f.t]}</div>`}<div class="mname">${f.n}</div><div class="mprice">${f.p?f.p+' €':f.a?f.a+' €':''}</div><div class="mown" id="mO${k}"></div></div>`;
 return`<div class="mf" data-k="${k}" style="grid-column:${c+1};grid-row:${r+1}">${inner}</div>`}
function ensureRoot(){if(root)return;root=document.createElement('div');root.className='tg mg';document.body.appendChild(root);
