<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../shared/nozoom.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Würfel-Sprint</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>:root{--a:#ffd23f;--b:#7c3aed}</style>
</head>
<body>
<script src="../shared/peerjs.min.js"></script>
<script src="../shared/net.js"></script>
<script src="../shared/kit.js"></script>
<script>
'use strict';
/* WÜRFEL-SPRINT – Rhythmus-Jump'n'Run. Tippen = springen, halten = weiter springen. */
const BS=40,SPD=390,GR=2900,JV=830,PADV=1160,ORBV=860,CEIL=10,VH=640,GY=470;
const LV=[{n:'Erste Schritte',d:0,len:420,c:['#2563eb','#7c3aed'],bpm:120,key:0},{n:'Neon-Fieber',d:1,len:520,c:['#db2777','#f97316'],bpm:132,key:3},{n:'Albtraum',d:2,len:620,c:['#16a34a','#0f172a'],bpm:144,key:5},{n:'Endlos',d:3,len:1e9,c:['#0891b2','#4c1d95'],bpm:136,key:7}];
let lvI=0,lv=LV[0],obj=[],built=0,rnd=null,P=null,state='menu',att=1,bestP=K.store.get('ws_best',{}),cam={x:0,y:0},parts=[],shake=0,deadT=0,beatT=0,win=false,held=false,tapBuf=0,step16=-1,musicT=0,trail=[],maxX=0;
const C=K.canvas(100,VH,{fill:true}),x=C.x;
/* ---------- Level-Bausteine (in Blöcken) ---------- */
const PAT={
 spike:()=>[[['s',2,0]],7],spike2:()=>[[['s',2,0],['s',3,0]],8],spike3:()=>[[['s',2,0],['s',3,0],['s',4,0]],9],
 block:()=>[[['b',2,0,2,1],['s',4,0]],8],
 stairs:()=>[[['b',2,0,2,1],['s',4,0],['s',5,0],['b',6,0,2,2],['s',8,0],['s',9,0],['b',10,0,3,3],['s',13,0],['s',14,0],['s',15,0]],19],
 float:()=>[[['b',3,1,6,1],['s',3,0],['s',4,0],['s',5,0],['s',6,0],['s',7,0],['s',8,0]],12],
 pad:()=>[[['p',2,0],['s',4,0],['s',5,0],['s',6,0],['s',7,0],['s',8,0]],12],
 orb:()=>[[['s',2,0],['s',3,0],['s',4,0],['s',5,0],['s',6,0],['s',7,0],['s',8,0],['s',9,0],['o',5,2.6]],13],
 tower:()=>[[['b',2,0,3,1],['s',5,0],['s',6,0],['b',7,0,2,2],['s',9,0],['b',10,0,2,1],['s',12,0]],15],
 pillars:()=>[[['b',2,0,2,1],['s',4,0],['s',5,0],['s',6,0],['b',7,0,2,1],['s',9,0],['s',10,0],['s',11,0],['b',12,0,2,1]],16],
 hang:()=>[[['b',2,2,8,1],['s',2,1,'d'],['s',4,1,'d'],['s',6,1,'d'],['s',8,1,'d']],12],
 padorb:()=>[[['p',2,0],['s',3,0],['s',4,0],['s',5,0],['s',6,0],['s',7,0],['s',8,0],['s',9,0],['s',10,0],['s',11,0],['s',12,0],['o',7.5,4]],15]};
const TIERS=[['spike','spike','spike2','block','float','pad','pillars'],['spike2','spike3','block','stairs','float','pad','orb','tower','pillars','hang'],['spike3','stairs','orb','tower','pillars','hang','padorb','pad','spike3'],null];
function ship(at,n,hard){const o=[['portal',at,0,'ship']];let gy=3;for(let k=0;k<n;k++){const cx=at+8+k*(hard?6:8);gy=K.clamp(gy+Math.floor(rnd()*5)-2,1,CEIL-5);const gap=hard?3.2:4;o.push(['b',cx,0,1,gy]);o.push(['b',cx,gy+gap,1,CEIL-gy-gap]);if(hard&&rnd()<.5)o.push(['s',cx-3,0])}const end=at+8+n*(hard?6:8)+4;o.push(['portal',end,0,'cube']);return[o,end-at+6]}
function genTo(limit){while(built<limit&&built<lv.len){const d=lv.d===3?Math.min(2,Math.floor(built/260)):lv.d;
 if(built>60&&rnd()<(d===0?.06:.1)&&built+80<lv.len){const [o,l]=ship(built,d===0?5:d===1?8:10,d>=2);for(const q of o){q[1]=q[1]+(q[0]==='portal'?0:0);obj.push(q)}built+=l;continue}
 const k=pickR(TIERS[d],rnd);const [o,l]=PAT[k]();for(const q of o){const c=q.slice();c[1]+=built;obj.push(c)}built+=l+(['pad','orb','padorb','stairs','tower'].includes(k)?2:0)+(d===0?3+Math.floor(rnd()*4):d===1?3+Math.floor(rnd()*3):2+Math.floor(rnd()*2))}}
const pickR=(a,r)=>a[Math.floor(r()*a.length)];
function load(i){lvI=i;lv=LV[i];rnd=K.rng(1000+i*77);obj=[];built=10;genTo(lv.d===3?200:lv.len);if(lv.d!==3)obj.push(['end',lv.len+8,0])}
function startAttempt(){P={x:0,y:0,vy:0,rot:0,ground:true,mode:'cube',dead:false,dist:0};cam={x:0,y:0};parts=[];trail=[];win=false;state='play';step16=-1;musicT=0;deadT=0;K.hideAll();
 if(lv.d===3){obj=[];built=10;rnd=K.rng(Date.now()%1e6);genTo(200)}}
/* ---------- Eingabe ---------- */
const down=()=>{held=true;tapBuf=.12};const up=()=>{held=false};
addEventListener('pointerdown',e=>{if(state==='play'&&!e.target.closest('button,a,.k-scr'))down()});addEventListener('pointerup',up);addEventListener('pointercancel',up);
addEventListener('keydown',e=>{if(e.key===' '||e.key==='ArrowUp'||e.key==='w'){if(state==='play'){e.preventDefault();if(!e.repeat)down()}}if(e.key==='Escape'&&state==='play')toMenu()});addEventListener('keyup',e=>{if(e.key===' '||e.key==='ArrowUp'||e.key==='w')up()});
/* ---------- Physik ---------- */
function boxes(){const L=P.x/BS-4,R=P.x/BS+4;return obj.filter(o=>o[1]+(o[3]&&o[0]==='b'?o[3]:1)>=L&&o[1]<=R)}
function die(){if(P.dead||win)return;P.dead=true;deadT=.9;shake=.4;K.sfx('boom');const px=P.x+BS/2,py=P.y+BS/2;for(let i=0;i<40;i++)parts.push([px,py,(Math.random()-.5)*700,(Math.random()-.2)*700,.8,K.pick(['#fff',lv.c[0],'#ffd23f'])]);
 const p=Math.min(99,Math.floor(P.x/BS/lv.len*100));if(lv.d===3){if(Math.floor(P.x/BS)>(bestP[lvI]||0))bestP[lvI]=Math.floor(P.x/BS)}else if(p>(bestP[lvI]||0))bestP[lvI]=p;K.store.set('ws_best',bestP)}
function phys(dt){if(P.dead){deadT-=dt;if(deadT<=0){att++;startAttempt()}return}if(win)return;
 tapBuf=Math.max(0,tapBuf-dt);P.x+=SPD*dt;if(lv.d===3)genTo(P.x/BS+60);const S=BS-4,bx=P.x+2;const near=boxes();
 for(const o of near)if(o[0]==='portal'&&P.x/BS>=o[1]&&P.x/BS<o[1]+.5&&P.mode!==o[3]){P.mode=o[3];K.sfx('whoosh');P.vy*=.4;for(let i=0;i<20;i++)parts.push([P.x+20,P.y+20,(Math.random()-.5)*400,(Math.random()-.5)*400,.5,o[3]==='ship'?'#ff7ad9':'#7dff9a'])}
 else if(o[0]==='end'&&P.x/BS>=o[1]){win=true;bestP[lvI]=100;K.store.set('ws_best',bestP);K.sfx('win');for(let i=0;i<80;i++)parts.push([P.x,P.y+20,(Math.random()-.5)*900,Math.random()*900,1.4,K.pick(['#ffd23f','#ff4757','#2ed573','#18dcff','#fff'])]);setTimeout(showWin,1400);return}
 const prevY=P.y;
 if(P.mode==='ship'){P.vy+=(held?2300:-2100)*dt;P.vy=K.clamp(P.vy,-560,560);P.y+=P.vy*dt;if(P.y<0){P.y=0;P.vy=0}if(P.y>CEIL*BS-S){P.y=CEIL*BS-S;P.vy=0}P.rot=K.lerp(P.rot,-P.vy/900,.2)}
 else{if(P.ground&&held){P.vy=JV;P.ground=false;K.sfx('jump')}P.vy-=GR*dt;P.y+=P.vy*dt;P.ground=false;if(P.y<=0){P.y=0;P.vy=0;P.ground=true}}
 for(const o of near){const ox=o[1]*BS,oy=o[2]*BS;
  if(o[0]==='b'){const w=o[3]*BS,h=o[4]*BS;if(bx+S>ox&&bx<ox+w&&P.y+S>oy&&P.y<oy+h){if(P.mode==='cube'&&P.vy<=0&&prevY>=oy+h-12){P.y=oy+h;P.vy=0;P.ground=true}else return die()}}
  else if(o[0]==='s'){const inv=o[3]==='d';const hx=ox+BS*.32,hw=BS*.36,hy=inv?oy+BS*.25:oy,hh=BS*.6;if(bx+S>hx&&bx<hx+hw&&P.y+S>hy&&P.y<hy+hh)return die()}
  else if(o[0]==='p'){if(bx+S>ox+4&&bx<ox+BS-4&&P.y<oy+12&&P.mode==='cube'){P.vy=PADV;P.ground=false;o.hit=.3;K.sfx('level')}}
  else if(o[0]==='o'){const cx=ox+BS/2,cy=oy+BS/2;if(Math.hypot(bx+S/2-cx,P.y+S/2-cy)<BS*.9&&tapBuf>0&&!o.used){P.vy=ORBV;tapBuf=0;o.used=1;o.hit=.3;K.sfx('coin');setTimeout(()=>o.used=0,400)}}}
 if(P.mode==='cube'){if(P.ground)P.rot=Math.round(P.rot/(Math.PI/2))*(Math.PI/2);else P.rot+=dt*Math.PI*1.75}
 trail.push([P.x+BS/2,P.y+BS/2,.35]);}
/* ---------- Musik ---------- */
const NOTES=[0,3,5,7,10,12,15,17];const f=n=>110*Math.pow(2,n/12);
function music(dt){if(state!=='play'||P.dead||win)return;musicT+=dt;const st=Math.floor(musicT*lv.bpm/60*4);if(st===step16)return;step16=st;const s=st%16,bar=Math.floor(st/16)%4,root=lv.key+[0,-4,-2,-7][bar];
 if(s%4===0){K.tone(150,.18,.35,'sine',0,40);beatT=1}if(s%4===2)K.noise(.04,.08,8000);if(s===4||s===12)K.noise(.12,.18,1800);
 if(s%2===0)K.tone(f(root-12),.14,.07,'sawtooth');const r=K.rng(st*31+lvI)();if(s%2===0&&r<.7)K.tone(f(root+12+NOTES[Math.floor(r*8)]),.12,.035,'square')}
/* ---------- Zeichnen ---------- */
function mix(a,b,k){const p=s=>[1,3,5].map(i=>parseInt(s.slice(i,i+2),16));const A=p(a),B=p(b);return`rgb(${A.map((v,i)=>Math.round(v+(B[i]-v)*k)).join(',')})`}
function draw(dt,T){C.begin('#000');const s=innerHeight/VH,W=innerWidth/s;x.save();x.scale(s,s);beatT=Math.max(0,beatT-dt*4);
 const prog=P?P.x/BS/Math.min(lv.len,1e4):0,hue=(T*8)%360;const g=x.createLinearGradient(0,0,0,VH);g.addColorStop(0,mix(lv.c[0],'#000000',.35-beatT*.15));g.addColorStop(1,mix(lv.c[1],'#000000',.5));x.fillStyle=g;x.fillRect(0,0,W,VH);
 const cx=P?P.x:T*SPD;if(P){const ty=Math.max(0,P.y-GY*.55);cam.y=K.lerp(cam.y,P.mode==='ship'?Math.max(0,CEIL*BS-GY+40):ty,.08);cam.x=P.x-W*.3}else cam={x:cx-W*.3,y:0};
 shake=Math.max(0,shake-dt);if(shake)x.translate((Math.random()-.5)*shake*30,(Math.random()-.5)*shake*30);
 x.globalAlpha=.12;x.fillStyle='#fff';for(let i=0;i<14;i++){const sz=60+(i%4)*40,px=((i*263-cam.x*.2)%(W+200)+W+200)%(W+200)-100,py=60+(i*97)%300;x.save();x.translate(px,py);x.rotate(T*.2+i);x.fillRect(-sz/2,-sz/2,sz,sz);x.restore()}x.globalAlpha=1;
 const sy=v=>GY+cam.y-v,SX=v=>v-cam.x;
 x.fillStyle=mix(lv.c[1],'#000000',.6);x.fillRect(0,sy(0),W,VH);x.strokeStyle=`rgba(255,255,255,${.6+beatT*.4})`;x.lineWidth=3;x.beginPath();x.moveTo(0,sy(0));x.lineTo(W,sy(0));x.stroke();
 x.strokeStyle='rgba(255,255,255,.06)';x.lineWidth=2;for(let i=-1;i<W/BS+2;i++){const gx=i*BS*2-(cam.x%(BS*2));x.strokeRect(gx,sy(0),BS*2,BS*2)}
 if(P&&P.mode==='ship'){x.fillStyle=mix(lv.c[1],'#000000',.6);x.fillRect(0,0,W,sy(CEIL*BS));x.beginPath();x.moveTo(0,sy(CEIL*BS));x.lineTo(W,sy(CEIL*BS));x.strokeStyle='#fff';x.stroke()}
 const L=cam.x/BS-2,R=(cam.x+W)/BS+2;for(const o of obj){const ow=o[0]==='b'?o[3]:1;if(o[1]+ow<L||o[1]>R)continue;const X=SX(o[1]*BS),Y=sy(o[2]*BS);
  if(o[0]==='b'){const w=o[3]*BS,h=o[4]*BS;x.fillStyle='rgba(0,0,0,.55)';x.fillRect(X,Y-h,w,h);x.strokeStyle='#fff';x.lineWidth=2.5;x.strokeRect(X+1,Y-h+1,w-2,h-2);x.strokeStyle='rgba(255,255,255,.18)';for(let i=0;i<o[3];i++)for(let j=0;j<o[4];j++)x.strokeRect(X+i*BS+6,Y-h+j*BS+6,BS-12,BS-12)}
  else if(o[0]==='s'){const inv=o[3]==='d';x.fillStyle='#0b0b12';x.strokeStyle='#fff';x.lineWidth=2.5;x.beginPath();if(inv){x.moveTo(X+2,Y-BS);x.lineTo(X+BS/2,Y-4);x.lineTo(X+BS-2,Y-BS)}else{x.moveTo(X+2,Y);x.lineTo(X+BS/2,Y-BS+4);x.lineTo(X+BS-2,Y)}x.closePath();x.fill();x.stroke()}
  else if(o[0]==='p'){o.hit=Math.max(0,(o.hit||0)-dt);x.fillStyle='#ffd23f';x.beginPath();x.ellipse(X+BS/2,Y-4,BS*.42,6+o.hit*20,0,Math.PI,0);x.fill();x.fillStyle='rgba(255,210,63,.25)';x.beginPath();x.ellipse(X+BS/2,Y-6,BS*.5,14+Math.sin(T*8)*4,0,Math.PI,0);x.fill()}
  else if(o[0]==='o'){o.hit=Math.max(0,(o.hit||0)-dt);const r=13+Math.sin(T*7)*2+o.hit*20;x.strokeStyle='#ffd23f';x.lineWidth=4;x.beginPath();x.arc(X+BS/2,Y-BS/2,r,0,Math.PI*2);x.stroke();x.fillStyle='rgba(255,210,63,.5)';x.beginPath();x.arc(X+BS/2,Y-BS/2,8,0,Math.PI*2);x.fill()}
  else if(o[0]==='portal'){const c=o[3]==='ship'?'#ff7ad9':'#7dff9a';x.strokeStyle=c;x.lineWidth=6;x.beginPath();x.ellipse(X+BS/2,sy(CEIL*BS/2),16,CEIL*BS/2-20,0,0,Math.PI*2);x.stroke();x.globalAlpha=.25;x.fillStyle=c;x.fill();x.globalAlpha=1}
  else if(o[0]==='end'){x.fillStyle='rgba(255,255,255,.15)';x.fillRect(X,0,W,VH);x.fillStyle='#fff';x.font='900 40px system-ui';x.fillText('🏁',X+10,sy(120))}}
 if(P){if(P.x<BS*12){x.font='900 52px system-ui';x.fillStyle='rgba(255,255,255,.85)';x.textAlign='left';x.fillText('Versuch '+att,SX(BS*3),sy(BS*5.5))}
  trail=trail.filter(t=>(t[2]-=dt)>0);for(const t of trail){x.globalAlpha=t[2]*1.5;x.fillStyle=P.mode==='ship'?'#ff7ad9':lv.c[0];x.fillRect(SX(t[0])-5,sy(t[1])-5,10,10)}x.globalAlpha=1;
  if(!P.dead){x.save();x.translate(SX(P.x+BS/2),sy(P.y+BS/2));x.rotate(-P.rot);const S=BS-4;
   if(P.mode==='ship'){x.fillStyle='#ff7ad9';x.strokeStyle='#fff';x.lineWidth=3;x.beginPath();x.moveTo(-24,8);x.lineTo(24,4);x.lineTo(10,-6);x.lineTo(-20,-6);x.closePath();x.fill();x.stroke();x.scale(.55,.55);x.translate(-4,-26)}
   x.fillStyle='#ffd23f';x.fillRect(-S/2,-S/2,S,S);x.strokeStyle='#111';x.lineWidth=3;x.strokeRect(-S/2,-S/2,S,S);x.fillStyle='#22d3ee';x.fillRect(-S/2+6,-S/2+6,S-12,S-12);x.fillStyle='#111';x.fillRect(-8,-6,5,7);x.fillRect(4,-6,5,7);x.fillRect(-8,5,17,4);x.restore()}}
 for(const p of parts){p[0]+=p[2]*dt;p[1]+=p[3]*dt;p[3]-=900*dt;p[4]-=dt;x.globalAlpha=Math.max(0,Math.min(1,p[4]*2));x.fillStyle=p[5];x.fillRect(SX(p[0]),sy(p[1]),7,7)}parts=parts.filter(p=>p[4]>0);x.globalAlpha=1;
 if(P){if(lv.d!==3){const bw=Math.min(420,W*.5);x.fillStyle='rgba(0,0,0,.4)';K.rr(x,W/2-bw/2,14,bw,16,8);x.fill();x.fillStyle='#7dff9a';K.rr(x,W/2-bw/2,14,bw*Math.min(1,prog),16,8);x.fill();x.font='800 15px system-ui';x.textAlign='center';x.fillStyle='#fff';x.fillText(Math.min(100,Math.floor(prog*100))+'%',W/2,52)}
  else{x.font='900 28px system-ui';x.textAlign='center';x.fillStyle='#fff';x.fillText(Math.floor(P.x/BS)+' m',W/2,40)}
  x.textAlign='left';x.font='700 14px system-ui';x.fillStyle='rgba(255,255,255,.7)';x.fillText(lv.n+' · Versuch '+att,12,22)}
 x.restore()}
K.loop((dt,T)=>{if(state==='play'){phys(dt);music(dt)}draw(dt,T)});
function showWin(){state='end';K.result('🏆 LEVEL GESCHAFFT!',`<p style="font-size:22px"><b>${lv.n}</b> nach ${att} ${att===1?'Versuch':'Versuchen'}!</p>${att===1?'<p>🤯 Beim ersten Versuch! Wahnsinn!</p>':''}`,[...(lvI<2?[{t:'▶ Nächstes Level',f:()=>{load(lvI+1);att=1;startAttempt()}}]:[]),{t:'🔁 Nochmal',f:()=>{att=1;startAttempt()}},{t:'Menü',f:toMenu}])}
function toMenu(){state='menu';P=null;menu()}
const back=document.createElement('button');back.className='k-btn-float';back.style.cssText='left:10px;bottom:max(10px,env(safe-area-inset-bottom));display:none';back.textContent='← Menü';back.onclick=toMenu;document.body.appendChild(back);setInterval(()=>back.style.display=state==='play'?'':'none',300);
function menu(){K.menu({title:'WÜRFEL-SPRINT',emoji:'🟨',sub:'Tippen zum Springen, gedrückt halten für Dauersprünge. Gelbe Pads schleudern dich hoch, gelbe Ringe: in der Luft tippen! Im Raumschiff: halten = steigen.',
 body:`<div class="k-box">${LV.map((l,i)=>`<button class="${i?'':'pri'} k-big" id="wsL${i}" style="margin:6px 0;width:100%;background:linear-gradient(90deg,${l.c[0]},${l.c[1]})">${['⭐','⭐⭐','⭐⭐⭐','♾️'][i]} ${l.n} <small style="opacity:.85">${i<3?(bestP[i]?' · Bestwert '+bestP[i]+'%':''):(bestP[i]?' · Rekord '+bestP[i]+' m':'')}${bestP[i]===100?' ✅':''}</small></button>`).join('')}</div>`,noName:true,help:'Tastatur: Leertaste oder ↑. Esc = Menü. Jedes Level ist immer gleich gebaut – übe, bis du es schaffst!'});
 LV.forEach((l,i)=>K.$('wsL'+i).onclick=()=>{K.ac();K.sfx('click');load(i);att=1;startAttempt()})}
menu();window.WS={get P(){return P},load,startAttempt};

</script>
</body>
