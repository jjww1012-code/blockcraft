<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Spiele">
<title>Spielehalle</title>
<style>
:root{--bg:#10141f;--card:#1a2133;--line:#2a3550;--txt:#f1f4ff;--mut:#98a3bf}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--txt);font-family:-apple-system,"Segoe UI",Roboto,sans-serif}
body{min-height:100vh;padding:max(20px,env(safe-area-inset-top)) 16px 40px;
 background:radial-gradient(1200px 500px at 50% -200px,#2a3a6a 0,transparent 70%),var(--bg)}
header{max-width:1000px;margin:10px auto 26px;text-align:center}
header h1{font-size:clamp(34px,6vw,54px);margin:0;letter-spacing:-1px}
header h1 span{display:inline-block;animation:bob 2.4s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-6px) rotate(-6deg)}}
header p{color:var(--mut);margin:8px 0 0;font-size:17px}
#grid{max-width:1000px;margin:0 auto;display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px}
.g{background:var(--card);border-radius:22px;overflow:hidden;text-decoration:none;color:inherit;display:flex;flex-direction:column;border:2px solid var(--line);transition:transform .15s,border-color .15s}
.g:hover{transform:translateY(-3px);border-color:#4a5b85}.g:active{transform:scale(.98)}
.ban{height:130px;display:flex;align-items:center;justify-content:center;font-size:72px;position:relative}
.ban .b{position:absolute;top:12px;right:12px;font-size:13px;font-weight:700;background:rgba(0,0,0,.35);padding:5px 10px;border-radius:99px}
.ban em{filter:drop-shadow(0 6px 0 rgba(0,0,0,.2));font-style:normal}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:10px;flex:1}
.body h2{margin:0;font-size:22px}
.body p{margin:0;color:var(--mut);line-height:1.45;font-size:15px;flex:1}
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tags span{font-size:12px;font-weight:600;background:var(--line);padding:4px 9px;border-radius:99px;color:#c9d3ef}
.play{display:flex;align-items:center;justify-content:space-between;margin-top:4px}
.play small{color:var(--mut)}
.play b{background:#5ad1a0;color:#0b2a1e;padding:10px 18px;border-radius:12px;font-size:16px}
footer{max-width:1000px;margin:30px auto 0;text-align:center;color:var(--mut);font-size:14px;line-height:1.5}
</style>
</head>
<body>
<header><h1><span>🎮</span> Spielehalle</h1><p>Spiel zusammen mit deinen Freunden – direkt im Browser, auch auf dem iPad.</p></header>
<main id="grid"></main>
<footer>Tipp: In Safari „Teilen → Zum Home-Bildschirm“ – dann startet die Spielehalle wie eine App und deine Spielstände bleiben sicher gespeichert.</footer>
<script>
const FALLBACK = [{ id: 'blockcraft', title: 'BlockCraft', emoji: '⛏️', path: 'blockcraft/', desc: 'Die große Blockwelt zum Bauen und Überleben.', players: '1–20 Spieler', tags: ['Online'], colors: ['#3aa655', '#1f6f8b'] }];
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
function render(list) {
  document.getElementById('grid').innerHTML = list.map(g => `
  <a class="g" href="${esc(g.path)}">
    <div class="ban" style="background:linear-gradient(135deg,${esc(g.colors[0])},${esc(g.colors[1])})"><em>${esc(g.emoji)}</em>${g.badge ? `<span class="b">${esc(g.badge)}</span>` : ''}</div>
    <div class="body"><h2>${esc(g.title)}</h2><p>${esc(g.desc)}</p>
      <div class="tags">${(g.tags || []).map(t => `<span>${esc(t)}</span>`).join('')}</div>
      <div class="play"><small>👥 ${esc(g.players)}</small><b>Spielen ▶</b></div></div>
  </a>`).join('');
}
fetch('games.json', { cache: 'no-store' }).then(r => r.json()).then(render).catch(() => render(FALLBACK));
</script>
</body>
</html>
