<style>
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:100%;height:100%;overflow:hidden;background:#000;touch-action:none;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;-webkit-tap-highlight-color:transparent;font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif;color:#fff}
#c{position:fixed;inset:0;width:100%;height:100%;display:block}
.hidden{display:none!important}

#flash{position:absolute;inset:0;background:radial-gradient(transparent 40%,rgba(255,0,0,.55));opacity:0;transition:opacity .25s}
#sleepov{position:absolute;inset:0;background:#000;opacity:0;transition:opacity 1.2s}
#cross{position:absolute;left:50%;top:50%;width:22px;height:22px;margin:-11px 0 0 -11px}
#cross:before,#cross:after{content:'';position:absolute;background:rgba(255,255,255,.9);box-shadow:0 0 2px #000}
#cross:before{left:10px;top:0;width:2px;height:22px}#cross:after{top:10px;left:0;height:2px;width:22px}
#minebar{position:absolute;left:50%;top:50%;margin:22px 0 0 -30px;width:60px;height:6px;background:rgba(0,0,0,.5);border-radius:3px;display:none}
#minebar i{display:block;height:100%;width:0;background:#fff;border-radius:3px}
#info{position:absolute;top:calc(8px + env(safe-area-inset-top));left:12px;font-size:13px;text-shadow:1px 1px 0 #000;line-height:1.45;max-width:48%;font-weight:600}
#toasts{position:absolute;top:calc(74px + env(safe-area-inset-top));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:5px;align-items:center;width:min(560px,90vw)}
.toast{background:rgba(20,22,30,.78);padding:7px 14px;border-radius:10px;font-size:15px;animation:fade 4.5s forwards;text-align:center;pointer-events:auto}
.toast button{margin-left:8px;font-size:14px;padding:5px 10px}
@keyframes fade{0%{opacity:0;transform:translateY(-6px)}6%{opacity:1;transform:none}85%{opacity:1}100%{opacity:0}}
#chatlog{position:absolute;left:12px;bottom:calc(178px + env(safe-area-inset-bottom));width:min(420px,44vw);display:flex;flex-direction:column;gap:3px;font-size:14px}
.cl{background:rgba(0,0,0,.45);padding:4px 9px;border-radius:7px;text-shadow:1px 1px 0 #000;animation:fade 12s forwards;word-wrap:break-word}
.cl b{color:#ffe070}.cl.sys{color:#9fe0ff}.cl.pm{color:#ffb0f0}
#bars{position:absolute;bottom:calc(98px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:18px;font-size:17px;text-shadow:1px 1px 0 #000;letter-spacing:-1px;white-space:nowrap}
.hf{color:#ff2a40}.hh{color:#ff9aa8}.he{color:rgba(60,60,60,.8)}.ff{filter:none}.fe{filter:grayscale(1) brightness(.4)}
#itemname{position:absolute;bottom:calc(122px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);font-size:15px;font-weight:600;text-shadow:1px 1px 0 #000;opacity:0;transition:opacity .4s;white-space:nowrap}
#hotbar{position:absolute;bottom:calc(46px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);display:flex;gap:3px;background:rgba(0,0,0,.45);padding:4px;border-radius:9px;pointer-events:auto}
.slot,.cell{width:48px;height:48px;border:2px solid rgba(255,255,255,.22);border-radius:6px;position:relative;background:rgba(0,0,0,.3);display:flex;align-items:center;justify-content:center}
.slot.sel{border-color:#fff;box-shadow:0 0 0 2px #fff}
.ic{image-rendering:pixelated;image-rendering:crisp-edges;background-repeat:no-repeat;flex:none;pointer-events:none}
.cnt{position:absolute;right:3px;bottom:0;font-size:13px;font-weight:800;text-shadow:1px 1px 0 #000,-1px -1px 0 #000;pointer-events:none}
.dur{position:absolute;left:4px;right:4px;bottom:3px;height:3px;background:#222;border-radius:2px;pointer-events:none}.dur i{display:block;height:100%;border-radius:2px}
#pbar{position:absolute;left:0;right:0;bottom:0;height:calc(40px + env(safe-area-inset-bottom));padding:4px 10px env(safe-area-inset-bottom);display:flex;gap:6px;align-items:center;overflow-x:auto;background:linear-gradient(transparent,rgba(0,0,0,.55));pointer-events:auto;touch-action:pan-x}
.pchip{display:flex;align-items:center;gap:6px;background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);border-radius:16px;padding:3px 10px 3px 4px;font-size:13px;font-weight:600;white-space:nowrap;flex:none}
.pchip .av{width:22px;height:22px;border-radius:50%;border:2px solid #fff}
.pchip.me{background:rgba(80,160,255,.35)}.pchip small{opacity:.75;font-weight:500}
#topbtns{position:absolute;top:calc(8px + env(safe-area-inset-top));right:12px;display:flex;gap:7px;pointer-events:auto}
.tbtn{width:50px;height:50px;border-radius:12px;background:rgba(0,0,0,.45);border:2px solid rgba(255,255,255,.3);display:flex;align-items:center;justify-content:center;font-size:24px;cursor:pointer;position:relative}
.tbtn.on{background:rgba(80,160,255,.6)}
.badge{position:absolute;top:-5px;right:-5px;background:#ff3050;border-radius:10px;font-size:11px;padding:1px 6px;font-weight:800}
#mm{position:absolute;top:calc(66px + env(safe-area-inset-top));right:12px;width:150px;height:150px;border-radius:12px;border:2px solid rgba(255,255,255,.4);background:#000;pointer-events:auto;image-rendering:pixelated}
#joy{position:absolute;width:140px;height:140px;margin:-70px 0 0 -70px;border-radius:50%;background:rgba(255,255,255,.12);border:2px solid rgba(255,255,255,.35);display:none}
#knob{position:absolute;left:42px;top:42px;width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.45)}
.btn{position:absolute;width:64px;height:64px;border-radius:50%;background:rgba(255,255,255,.16);border:2px solid rgba(255,255,255,.4);display:flex;align-items:center;justify-content:center;font-size:27px;pointer-events:auto}
.btn.big{width:80px;height:80px;font-size:32px}.btn.on{background:rgba(255,255,255,.45)}.btn.sm{width:50px;height:50px;font-size:22px}
#bAtk{right:116px;bottom:calc(214px + env(safe-area-inset-bottom))}
#bUse{right:20px;bottom:calc(226px + env(safe-area-inset-bottom))}
#bJump{right:20px;bottom:calc(122px + env(safe-area-inset-bottom))}
#bDown{right:118px;bottom:calc(126px + env(safe-area-inset-bottom))}
#bCtx{right:206px;bottom:calc(170px + env(safe-area-inset-bottom));background:rgba(255,200,60,.45)}
#bEmote{right:30px;bottom:calc(310px + env(safe-area-inset-bottom))}
#bCam{right:92px;bottom:calc(296px + env(safe-area-inset-bottom))}
.panel{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top));transform:translateX(-50%);width:min(760px,95vw);max-height:calc(100% - 140px);overflow-y:auto;-webkit-overflow-scrolling:touch;touch-action:pan-y;background:rgba(22,24,32,.96);border:2px solid rgba(255,255,255,.15);border-radius:16px;padding:16px;z-index:10}
.panel.center{top:50%;transform:translate(-50%,-50%);max-height:94%}
.panel.full{max-height:calc(100% - 24px)}
h1{font-size:42px;letter-spacing:2px;text-align:center;margin-bottom:2px;text-shadow:3px 3px 0 #2a6a20;color:#9be36a}
h2{font-size:20px;margin-bottom:10px}h3{font-size:16px;margin:12px 0 6px;opacity:.9}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin:8px 0}
label{font-size:14px;opacity:.85}
input[type=text],input[type=password]{font-size:18px;padding:10px 12px;border-radius:9px;border:2px solid #444;background:#2a2d38;color:#fff;width:210px;-webkit-user-select:text;user-select:text}
input[type=range]{width:180px}
button{font-size:16px;padding:10px 16px;border-radius:10px;border:2px solid rgba(255,255,255,.22);background:#3a3f4b;color:#fff;cursor:pointer;font-weight:600}
button.pri{background:#3e9a2e;border-color:#6fd25a}button.big{font-size:20px;padding:14px 22px}button.on{background:#2f6fd0;border-color:#7fb0ff}
button.red{background:#a03040;border-color:#e06070}button.sm{font-size:14px;padding:6px 10px}
.status{font-size:14px;opacity:.9;text-align:center;margin:6px 0;min-height:20px}
.err{color:#ff8a8a}
.help{font-size:13px;line-height:1.55;opacity:.78;margin-top:10px}
.tabs{display:flex;gap:6px;margin-bottom:10px;align-items:center;flex-wrap:wrap}
.tab{padding:7px 12px;border-radius:9px;background:#3a3f4b;cursor:pointer;font-weight:600;font-size:14px}.tab.on{background:#2f6fd0}
.close{margin-left:auto}
.grid{display:flex;flex-wrap:wrap;gap:5px}
.cell{width:52px;height:52px;cursor:pointer}.cell.pick{border-color:#ffd23a;box-shadow:0 0 0 2px #ffd23a}.cell.arm{border-style:dashed}
.recs{display:flex;flex-direction:column;gap:5px}
.rec{display:flex;align-items:center;gap:10px;padding:6px 10px;background:#2c3039;border-radius:9px;cursor:pointer}
.rec.no{opacity:.38}.rec b{min-width:170px;font-size:14px}.ing{font-size:13px;opacity:.95;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ing span{display:inline-flex;align-items:center;gap:2px}
.worlds{display:flex;flex-direction:column;gap:8px;margin-top:6px}
.wbtn{display:flex;align-items:center;gap:14px;text-align:left;padding:14px 16px;font-size:18px;border-radius:12px}
.wbtn small{display:block;font-size:13px;opacity:.75;font-weight:500}
.wbtn .e{font-size:30px}
.sw{display:inline-block;width:32px;height:32px;border-radius:50%;border:3px solid transparent;cursor:pointer;vertical-align:middle}.sw.on{border-color:#fff}
.plist{display:flex;flex-direction:column;gap:6px}.pl{display:flex;align-items:center;gap:8px;background:#2c3039;border-radius:10px;padding:8px 10px;flex-wrap:wrap}
.pl .nm{font-weight:700;min-width:120px}
#chatin{width:min(520px,70vw)}
.emo{font-size:30px;padding:12px 16px}
#loading{position:fixed;inset:0;display:flex;flex-direction:column;gap:14px;align-items:center;justify-content:center;font-size:24px;background:rgba(10,14,24,.85);z-index:20;text-align:center;padding:20px}
#loading small{font-size:15px;opacity:.8}
.spin{width:42px;height:42px;border:5px solid rgba(255,255,255,.25);border-top-color:#9be36a;border-radius:50%;animation:sp 1s linear infinite}@keyframes sp{to{transform:rotate(360deg)}}
.news li{margin:4px 0 4px 18px;font-size:14px}
#skincv{background:linear-gradient(#8ac4ff,#cfe8ff);border-radius:12px}
</style>

<body>

</div>

<div id="start" class="panel center full">
  <h1>BlockCraft 2</h1>
  <div class="status" id="sStatus">Lade …</div>
  <div class="tabs" style="justify-content:center"><div class="tab on" id="tLogin">🔑 Einloggen</div><div class="tab" id="tCreate">✨ Konto erstellen</div></div>
  <div class="row" style="justify-content:center"><label>Name</label><input type="text" id="sName" maxlength="16" autocomplete="off" autocapitalize="off" spellcheck="false"><label>Passwort</label><input type="password" id="sPw" maxlength="20" placeholder="z.B. 1234" autocomplete="off"></div>
  <div class="help" style="text-align:center;margin-top:0">Ganz einfach: denk dir einen Namen und ein kleines Passwort aus (kein echtes Passwort benutzen!).</div>

   <label style="margin-left:10px">Modus für neue Spieler</label><button id="sC" class="on">🧱 Kreativ</button><button id="sS">⚔️ Survival</button></div>

<div id="skinp" class="panel center hidden">

  <div class="row" style="align-items:flex-start;gap:16px"><canvas id="skincv" width="150" height="230"></canvas><div id="skinopts" style="flex:1;min-width:280px"></div></div>
  <div class="row"><button class="pri big" id="skinOk">Fertig</button></div>

<div id="invp" class="panel hidden"><div class="tabs" id="invTabs"></div><div id="invBody"></div></div>
<div id="menu" class="panel center hidden"></div>
<div id="playersp" class="panel hidden"></div>
<div id="chatp" class="panel hidden"><div class="tabs"><b>💬 Chat</b><button class="close sm" id="chatClose">✕</button></div><div id="chathist" style="max-height:38vh;overflow-y:auto;font-size:15px;line-height:1.5;margin-bottom:8px"></div>

</div>
<div id="loading" class="hidden"><div class="spin"></div><div id="ldT">Lade …</div><small id="ldS"></small></div>
<script>
function loadThree(cb){if(window.THREE)return cb();const s=document.createElement('script');s.src='three.min.js';s.onload=cb;s.onerror=()=>{const l=document.createElement('script');l.src='https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js';l.onload=cb;l.onerror=()=>alert('three.js konnte nicht geladen werden. Lege three.min.js neben index.html.');document.head.appendChild(l)};document.head.appendChild(s)}
function showErr(e){const L=e&&e.line,C=e&&e.column;const out=()=>{let d=document.getElementById('errbox');if(!d){d=document.createElement('div');d.id='errbox';d.style.cssText='position:fixed;inset:0;background:#300;color:#fff;padding:20px;font:15px monospace;z-index:99;white-space:pre-wrap;overflow:auto;user-select:text;-webkit-user-select:text';document.body.appendChild(d)}d.textContent=window.__errs};window.__errs=(window.__errs||'')+'Fehler beim Start:\n'+(e&&e.name)+': '+(e&&e.message)+'\nZeile '+L+', Spalte '+C+'\n'+(e&&e.stack||'')+'\n\n';out();if(L)fetch(location.href,{cache:'no-store'}).then(r=>r.text()).then(t=>{const ln=t.split('\n')[L-1]||'';window.__errs+='Code Zeile '+L+': '+ln.slice(Math.max(0,C-80),C+80)+'\n\n';out()}).catch(()=>{})}
window.addEventListener('error',ev=>{if(!window.__bcStarted)showErr(ev.error||{name:'Error',message:ev.message,line:ev.lineno,column:ev.colno})});
loadThree(function(){try{main();window.__bcStarted=1}catch(e){showErr(e)}});

</script>
<script>
// ============================================================
// BlockCraft HostCore – der "Gastgeber-Kern".
// Läuft im Browser (Gastgeber-iPad / Solo) UND in server.js (PC).
// Hält die Welt-Daten als Schlüssel/Wert-Speicher: k -> {v, ts}
// ============================================================
(function (root) {
'use strict';
const PROTO = 2;
const DAY = 1200000;
function HostCore(o) {
  const H = {
    kv: o.kv, clients: new Map(), next: 1, simId: 0, prefer: null,
    onPut: o.onPut || function () {}, now: o.now || Date.now, sleeping: new Set(), autoCreate: !!o.autoCreate,
    log: o.log || function () {}, lastTimeSave: 0, lastTimeSend: 0
  };
  const now = () => H.now();
  const get = k => { const e = H.kv.get(k); return e ? e.v : undefined; };
  function put(k, v, ts, broadcast, except) {
    ts = ts || now();
    if (v === null || v === undefined) { H.kv.delete(k); H.onPut(k, null); }
    else { H.kv.set(k, { v, ts }); H.onPut(k, { v, ts }); }
    if (broadcast !== false) all({ t: 'kv', k, v: v === undefined ? null : v, ts }, except);
  }
  function send(c, m) { try { c.send(m); } catch (e) {} }
  function all(m, except) { for (const c of H.clients.values()) if (c.joined && c !== except) send(c, m); }
  const users = () => [...H.clients.values()].filter(c => c.name);
  const byName = n => { n = String(n || '').toLowerCase(); for (const c of H.clients.values()) if (c.lk === n) return c; };
  const byId = id => H.clients.get(id);

  // ---------- Weltzeit ----------
  H.timeBase = o.time || (get('time') | 0) || 6 * DAY / 24 + 30000;
  H.timeStart = now();
  H.worldTime = () => H.timeBase + now() - H.timeStart;
  function setTime(t) { H.timeBase = t; H.timeStart = now(); put('time', t); all({ t: 'time', time: t }); }

  // ---------- Welt-Metadaten ----------
  if (!get('meta')) put('meta', Object.assign({ seed: (Math.random() * 2147483647) | 0, gen: 2, created: now(), spawn: null }, o.meta || {}), 0, false);

  function pickSim() {
    let s = 0;
    if (H.prefer && H.prefer.name && H.clients.has(H.prefer.id)) s = H.prefer.id;
    else { const ids = users().map(c => c.id); s = ids.length ? Math.min(...ids) : 0; }
    if (s !== H.simId) { H.simId = s; all({ t: 'sim', id: s }); }
  }
  function mergeChunk(k, e) {
    const cur = H.kv.get(k);
    if (!cur) { H.kv.set(k, { v: Object.assign({}, e.v), ts: e.ts }); H.onPut(k, H.kv.get(k)); all({ t: 'kv', k, v: e.v, ts: e.ts }); return; }
    let ch = false;
    for (const li in e.v) { const a = e.v[li], b = cur.v[li]; if (!b || a[2] > b[2]) { cur.v[li] = a; ch = true; } }
    if (ch) { cur.ts = Math.max(cur.ts, e.ts); H.onPut(k, cur); all({ t: 'kv', k, v: cur.v, ts: cur.ts }); }
  }
  function merge(m) {
    if (!m) return;
    for (const k in m) {
      const e = m[k]; if (!e || typeof e.ts !== 'number') continue;
      if (k === 'meta' || k === 'time') continue;              // Seed & Zeit bleiben beim Gastgeber
      if (k.startsWith('c/')) { mergeChunk(k, e); continue; }
      const cur = H.kv.get(k);
      if (k === 'chat') { const l = (cur ? cur.v : []).concat(e.v || []); const seen = new Set(); const out = []; l.sort((a, b) => a.ts - b.ts).forEach(x => { const id = x.n + x.ts; if (!seen.has(id)) { seen.add(id); out.push(x); } }); put('chat', out.slice(-80), Math.max(cur ? cur.ts : 0, e.ts)); continue; }
      if (!cur || e.ts > cur.ts) put(k, e.v, e.ts);
    }
  }
  function editKey(x, z) { return 'c/' + (x >> 4) + ',' + (z >> 4); }
  function applyEdit(x, y, z, b, m, ts) {
    const k = editKey(x, z), li = ((y * 16) + (z & 15)) * 16 + (x & 15);
    let e = H.kv.get(k); if (!e) { e = { v: {}, ts }; H.kv.set(k, e); }
    e.v[li] = [b, m | 0, ts]; e.ts = ts; H.onPut(k, e);
  }
  const cleanName = s => String(s || '').replace(/[^A-Za-z0-9ÄÖÜäöüß _\-]/g, '').trim().slice(0, 16);

  H.connect = function (sendFn, isSelf) {
    const c = { id: H.next++, send: sendFn, joined: false, name: null, lk: null, state: null, self: !!isSelf };
    H.clients.set(c.id, c); if (isSelf) H.prefer = c;
    return c;
  };
  H.disconnect = function (c) {
    if (!H.clients.has(c.id)) return;
    H.clients.delete(c.id); H.sleeping.delete(c.id);
    if (c.name) {
      all({ t: 'pleave', id: c.id, name: c.name });
      for (const [k, e] of H.kv) if (k.startsWith('veh/') && e.v && (e.v.driver === c.id || e.v.pass === c.id)) {
        const v = Object.assign({}, e.v); if (v.driver === c.id) v.driver = 0; if (v.pass === c.id) v.pass = 0; put(k, v);
      }
    }
    pickSim();

const WOODS = { oak: [[104, 82, 50], [170, 135, 85], [164, 132, 80], [200, 200, 200]], birch: [[216, 214, 206], [200, 180, 130], [196, 179, 123], [200, 200, 200]], spruce: [[60, 42, 26], [115, 85, 50], [110, 80, 48], [200, 200, 200]], acacia: [[100, 95, 88], [175, 95, 50], [170, 92, 50], [200, 200, 200]], jungle: [[85, 68, 25], [165, 120, 80], [160, 115, 80], [200, 200, 200]], cherry: [[55, 30, 40], [230, 175, 170], [225, 175, 170], [250, 180, 210]], darkoak: [[60, 46, 26], [90, 65, 35], [70, 48, 26], [200, 200, 200]], willow: [[90, 80, 60], [150, 140, 100], [140, 130, 95], [200, 200, 200]], palm: [[150, 120, 80], [200, 170, 120], [205, 175, 120], [200, 200, 200]] };
for (const w in WOODS) {
  const [b, r, p, l] = WOODS[w];
  tex(w + '_log', () => { if (w === 'birch') { fill(b, .06); for (let i = 0; i < 9; i++) rect(R() * 14 | 0, R() * 16 | 0, 2 + (R() * 3 | 0), 1, [50, 50, 45]); } else if (w === 'palm') { each((x, y) => px(x, y, sh(b, (y % 4 === 0 ? .75 : 1) * (1 + (R() - .5) * .15)))); } else bark(b); });
  tex(w + '_log_top', () => rings(r, b));
  tex(w + '_planks', () => planks(p));
  tex(w + '_leaves', () => { if (w === 'cherry') { clear(); each((x, y) => { if (R() < .2) return; px(x, y, sh(l, .82 + R() * .3)); }); for (let i = 0; i < 8; i++) px(R() * 16, R() * 16, [255, 230, 240]); } else if (w === 'palm') { clear(); for (let y = 0; y < 16; y++) for (let x = 0; x < 16; x++) if ((x + y) % 3 !== 0 && R() > .15) px(x, y, sh(l, .7 + R() * .45)); } else leaves(l, w === 'spruce' ? .12 : .22); });
  tex(w + '_sapling', () => { clear(); line(8, 15, 8, 9, sh(b, 1)); const lc = w === 'cherry' ? l : [70, 140, 50]; for (let i = 0; i < 26; i++) { const a = R() * 6.28, r = R() * 4; px(8 + Math.cos(a) * r, 7 + Math.sin(a) * r * .8, sh(lc, .8 + R() * .4)); } });
}

  for (let r = 0; r < 600; r += 3) for (let a = 0; a < 36; a++) { const x = Math.floor(WS / 2 + Math.cos(a / 36 * 6.283) * r), z = Math.floor(WS / 2 + Math.sin(a / 36 * 6.283) * r); const c = colInfo(x, z); if (c.h < SEA + 2 || c.h > SEA + 22) continue; const b = BIOMES[c.bio].key; if (r < 450 ? !['plains', 'meadow', 'forest', 'birch', 'cherry'].includes(b) : ['ocean', 'river', 'beach', 'swamp'].includes(b)) continue; genChunk(x >> 4, z >> 4); const y = surfaceY(x, z); const id = gb(x, y, z); if (!B[id].solid || B[id].fluid || isLeaves(id) || gb(x, y + 1, z) && B[gb(x, y + 1, z)].solid) continue; return { x: x + .5, y: y + 1, z: z + .5 }; }
  return { x: WS / 2 + .5, y: H - 10, z: WS / 2 + .5 };
}
function showLoading(t, s) { $('loading').classList.remove('hidden'); $('ldT').textContent = t; $('ldS').textContent = s || ''; }
async function joinWorld(spec) {

  if (name.length < 2) { $('sStatus').innerHTML = '<span class="err">Bitte gib einen Namen ein (mindestens 2 Zeichen).</span>'; $('sName').focus(); return; }

  try {
    const r = await netJoin(spec, { name, pw: pwHash(name, pw), create: loginTab === 'create', skin: mySkin });
    showLoading('Welt wird erstellt …'); await sleep(30);
    await initGame(r);
  } catch (e) {
    $('loading').classList.add('hidden'); $('start').classList.remove('hidden');
    try { if (NET.peer) NET.peer.destroy(); } catch (er) {} stopLocalHost(); NET.peer = null; NET.conn = null; NET.role = 'none';

async function initGame(r) {

function setLoginTab(t) { loginTab = t; $('tLogin').classList.toggle('on', t === 'login'); $('tCreate').classList.toggle('on', t === 'create'); }

});
