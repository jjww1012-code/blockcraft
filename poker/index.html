<script src="../shared/peerjs.min.js"></script>

<script>
'use strict';
/* POKER 2.0 – Texas Hold'em mit Spielgeld. Saubere Setzrunden, Nebentöpfe, Bots mit Gewinnchancen-Rechnung. */
const SU=['♠','♥','♦','♣'],RK=['2','3','4','5','6','7','8','9','10','B','D','K','A'];
const HN=['Höchste Karte','Paar','Zwei Paare','Drilling','Straße','Flush','Full House','Vierling','Straight Flush'];
let nBots=K.store.get('pk_bots',4),startChips=K.store.get('pk_chips',1000),root=null,raiseTo=0,lastLog='',lastBoard=0,lastHand=-1,lastWinner=null;
/* ---------- Bewertung (5–7 Karten) ---------- */
function strHigh(mask){if((mask&0x100F)===0x100F)var wheel=3;for(let h=12;h>=4;h--){if(((mask>>(h-4))&31)===31)return h}return wheel??-1}
function evalN(cs){const cnt=new Array(13).fill(0),sc=[0,0,0,0],bySuit=[[],[],[],[]];let mask=0;for(const c of cs){cnt[c.v]++;mask|=1<<c.v;const si=SU.indexOf(c.s);sc[si]++;bySuit[si].push(c.v)}
 const fs=sc.findIndex(n=>n>=5);if(fs>=0){let fm=0;for(const v of bySuit[fs])fm|=1<<v;const sf=strHigh(fm);if(sf>=0)return[8,sf]}
 const g=[];for(let v=12;v>=0;v--)if(cnt[v])g.push([cnt[v],v]);g.sort((a,b)=>b[0]-a[0]||b[1]-a[1]);
 const kick=(ex,n)=>{const o=[];for(let v=12;v>=0&&o.length<n;v--)if(cnt[v]&&!ex.includes(v))o.push(v);return o};
 if(g[0][0]===4)return[7,g[0][1],...kick([g[0][1]],1)];
 if(g[0][0]===3&&g[1]&&g[1][0]>=2)return[6,g[0][1],g[1][1]];
 if(fs>=0)return[5,...bySuit[fs].sort((a,b)=>b-a).slice(0,5)];
 const st=strHigh(mask);if(st>=0)return[4,st];
 if(g[0][0]===3)return[3,g[0][1],...kick([g[0][1]],2)];
 if(g[0][0]===2&&g[1]&&g[1][0]===2)return[2,g[0][1],g[1][1],...kick([g[0][1],g[1][1]],1)];
 if(g[0][0]===2)return[1,g[0][1],...kick([g[0][1]],3)];return[0,...kick([],5)]}
const cmp=(a,b)=>{for(let i=0;i<Math.max(a.length,b.length);i++){const d=(a[i]||0)-(b[i]||0);if(d)return d}return 0};
function best5(cs){// Indizes der besten 5 Karten (für die Hervorhebung)
 let b=null,bi=null;const n=cs.length;for(let a=0;a<n;a++)for(let c=a+1;c<n;c++)for(let d=c+1;d<n;d++)for(let e=d+1;e<n;e++)for(let f=e+1;f<n;f++){const ix=[a,c,d,e,f];const v=evalN(ix.map(i=>cs[i]));if(!b||cmp(v,b)>0){b=v;bi=ix}}return bi||[]}
/* ---------- Gewinnchance (Monte-Carlo) ---------- */
function equity(hole,board,nOpp,N=220){if(nOpp<1)return 1;const used=new Set([...hole,...board].map(c=>c.s+c.r));const deck=[];for(const s of SU)RK.forEach((r,v)=>{if(!used.has(s+r))deck.push({s,r,v})});let win=0;
 for(let t=0;t<N;t++){for(let i=deck.length-1;i>deck.length-1-(nOpp*2+5-board.length)&&i>0;i--){const j=Math.floor(Math.random()*(i+1));[deck[i],deck[j]]=[deck[j],deck[i]]}let k=deck.length-1;const bd=board.slice();while(bd.length<5)bd.push(deck[k--]);const me=evalN([...hole,...bd]);let best=1,ties=1;
  for(let o=0;o<nOpp;o++){const e=evalN([deck[k--],deck[k--],...bd]);const c=cmp(e,me);if(c>0){best=0;break}if(c===0)ties++}if(best)win+=1/ties}return win/N}
/* ---------- Spielmotor ---------- */
const PERS=[{n:'vorsichtig',loose:-.06,agg:.6,bluff:.03},{n:'normal',loose:0,agg:1,bluff:.06},{n:'wild',loose:.08,agg:1.5,bluff:.14},{n:'clever',loose:-.02,agg:1.2,bluff:.09}];
const E=K.TG({game:'poker',max:8,
 setup(ps,o){const G={pl:ps.map((p,i)=>({id:p.id,name:p.name,chips:o.chips||1000,cards:[],bet:0,tot:0,fold:false,allin:false,acted:false,out:false,last:'',bot:!!p.bot,pers:i%PERS.length})),dealer:-1,sb:Math.max(5,Math.round((o.chips||1000)/100)),hand:0,log:'Willkommen am Tisch!',winner:null,show:false,board:[],phase:'bet',start:o.chips||1000};newHand(G);return G},
 actors:G=>G.winner||G.phase!=='bet'?[]:[G.pl[G.turn].id],over:G=>!!G.winner,
 view(G,pid){const me=G.pl.findIndex(p=>p.id===pid);const P=G.pl[me];let mine='';if(P&&P.cards.length===2&&!P.fold)mine=HN[evalN([...P.cards,...G.board])[0]];
  return{me,hand:G.hand,pl:G.pl.map((p,i)=>({name:p.name,chips:p.chips,bet:p.bet,fold:p.fold,allin:p.allin,out:p.out,last:p.last,cards:i===me||(G.show&&!p.fold&&!p.out)?p.cards:p.cards.length&&!p.fold?[null,null]:[],win:p.win||0,hn:p.hn||'',hl:G.show?p.hl||[]:[]})),board:G.board,bhl:G.bhl||[],pot:G.pl.reduce((s,p)=>s+p.tot,0),turn:G.turn,dealer:G.dealer,phase:G.phase,log:G.log,toCall:P?Math.max(0,G.bet-P.bet):0,minRaise:G.bet+G.minR,bet:G.bet,winner:G.winner,sb:G.sb,mine,street:G.street}},
 act(G,pid,a){if(G.phase!=='bet')return false;const i=G.pl.findIndex(p=>p.id===pid);if(i!==G.turn)return false;const p=G.pl[i],toCall=G.bet-p.bet;
  if(a.k==='fold'){if(toCall<=0){a={k:'call'}}else{p.fold=true;p.last='Passt';G.log=p.name+' passt'}}
  if(a.k==='call'){const amt=Math.min(toCall,p.chips);put(p,amt);p.last=toCall?(p.allin?'ALL-IN':'Geht mit'):'Checkt';G.log=p.name+(toCall?(p.allin?' geht ALL-IN ('+amt+')':' geht mit ('+amt+')'):' checkt')}
  else if(a.k==='raise'){let to=Math.round(+a.to||0);const max=p.bet+p.chips;if(to>=max)to=max;else if(to<G.bet+G.minR)to=Math.min(max,G.bet+G.minR);if(to<=G.bet){return E.def.act(G,pid,{k:'call'})}
   const amt=to-p.bet,inc=to-G.bet;put(p,amt);if(inc>=G.minR)G.minR=inc;G.bet=to;G.pl.forEach(q=>{if(q!==p)q.acted=false});p.last=p.allin?'ALL-IN':(G.street===0&&G.bet===to&&inc===to?'Setzt':'Erhöht')+' '+to;G.log=p.name+(p.allin?' geht ALL-IN! ('+to+')':' erhöht auf '+to)}
  else if(a.k!=='fold')return false;p.acted=true;advance(G);return true},
 bot(G,pid){return botAct(G,G.pl.find(q=>q.id===pid))},
 botDelay:G=>700+Math.random()*900,render});
function put(p,amt){amt=Math.max(0,Math.min(amt,p.chips));p.chips-=amt;p.bet+=amt;p.tot+=amt;if(p.chips===0)p.allin=true}
const live=G=>G.pl.filter(p=>!p.fold&&!p.out);
function nextFrom(G,i,ok){const n=G.pl.length;for(let k=1;k<=n;k++){const j=(i+k)%n;if(ok(G.pl[j]))return j}return -1}
function newHand(G){const alive=G.pl.filter(p=>p.chips>0);if(alive.length<=1){G.winner=alive[0]?alive[0].name:'?';G.phase='end';G.log='🏆 '+G.winner+' hat alle Chips gewonnen!';return}
 G.hand++;if(G.hand>1&&(G.hand-1)%8===0){G.sb*=2;G.blindUp=true}else G.blindUp=false;
 const deck=[];for(const s of SU)RK.forEach((r,v)=>deck.push({s,r,v}));K.shuffle(deck);G.deck=deck;G.board=[];G.bhl=[];G.show=false;G.phase='bet';
 for(const p of G.pl){p.cards=[];p.bet=0;p.tot=0;p.out=p.chips<=0;p.fold=p.out;p.allin=false;p.acted=false;p.last='';p.win=0;p.hn='';p.hl=[]}
 G.dealer=nextFrom(G,G.dealer,p=>!p.out);for(let r=0;r<2;r++)for(let k=1;k<=G.pl.length;k++){const p=G.pl[(G.dealer+k)%G.pl.length];if(!p.out)p.cards.push(deck.pop())}
 const sbI=alive.length===2?G.dealer:nextFrom(G,G.dealer,p=>!p.out),bbI=nextFrom(G,sbI,p=>!p.out);put(G.pl[sbI],G.sb);put(G.pl[bbI],G.sb*2);G.pl[sbI].last='Small Blind';G.pl[bbI].last='Big Blind';
 G.bet=G.sb*2;G.minR=G.sb*2;G.street=0;G.turn=nextFrom(G,bbI,p=>!p.out&&!p.fold&&!p.allin);G.log='Hand #'+G.hand+(G.blindUp?' – Blinds steigen auf ':' – Blinds ')+G.sb+'/'+G.sb*2;
 if(G.turn<0||roundDone(G))advance(G,true)}
function roundDone(G){const act=live(G),can=act.filter(p=>!p.allin);if(act.length<=1)return true;if(can.length===0)return true;if(can.length===1&&can[0].bet>=G.bet)return true;return can.every(p=>p.acted&&p.bet===G.bet)}
function advance(G,force){const act=live(G);if(act.length===1){award(G,[act[0]]);return}
 if(!force&&!roundDone(G)){G.turn=nextFrom(G,G.turn,p=>!p.fold&&!p.out&&!p.allin);return}
 // nächste Straße
 for(const p of G.pl){p.bet=0;p.acted=false;if(p.last&&!p.fold&&!p.allin)p.last=''}G.bet=0;G.minR=G.sb*2;G.street++;
 if(G.street===1)G.board.push(G.deck.pop(),G.deck.pop(),G.deck.pop());else if(G.street<=3)G.board.push(G.deck.pop());
 if(G.street>3){showdown(G);return}
 G.log=['','🃏 Flop','🃏 Turn','🃏 River'][G.street];
 if(act.filter(p=>!p.allin).length<=1){G.phase='run';G.show=true;E.later(1300,()=>{G.phase='bet';advance(G,true)});return}
 G.turn=nextFrom(G,G.dealer,p=>!p.fold&&!p.out&&!p.allin)}
function showdown(G){G.show=true;const act=live(G);for(const p of act){const all=[...p.cards,...G.board];p.ev=evalN(all);p.hn=HN[p.ev[0]];p.hl5=best5(all)}award(G,act)}
function award(G,cands){const levels=[...new Set(G.pl.map(p=>p.tot).filter(t=>t>0))].sort((a,b)=>a-b);let prev=0;
 for(const L of levels){let pot=0;for(const p of G.pl)pot+=Math.max(0,Math.min(p.tot,L)-prev);const el=cands.filter(p=>p.tot>=L);
  if(pot>0&&el.length){let w=[el[0]];if(el.length>1&&el[0].ev){w=[];let b=null;for(const p of el){const c=b?cmp(p.ev,b):1;if(c>0){b=p.ev;w=[p]}else if(c===0)w.push(p)}}
   const share=Math.floor(pot/w.length);w.forEach((p,k)=>{const s=share+(k===0?pot-share*w.length:0);p.chips+=s;p.win+=s})}prev=L}
 const ws=G.pl.filter(p=>p.win>0);
 if(G.show){for(const p of ws){if(!p.hl5)continue;p.hl=p.hl5.filter(i=>i<2);G.bhl=[...new Set([...(G.bhl||[]),...p.hl5.filter(i=>i>=2).map(i=>i-2)])]}}
 G.log=ws.map(p=>'🏆 '+p.name+' gewinnt '+p.win+(p.hn&&G.show?' mit '+p.hn:'')).join(' · ');G.phase='end';
 for(const p of G.pl)p.last=p.win?'':p.last;
 E.later(G.show?5200:2400,()=>{for(const p of G.pl)if(p.chips<=0&&!p.out){p.out=true}newHand(G)})}
/* ---------- Bots ---------- */
function botAct(G,p){const toCall=Math.max(0,G.bet-p.bet),pot=G.pl.reduce((t,q)=>t+q.tot,0),opp=live(G).length-1,P=PERS[p.pers],r=Math.random();
 let eq=equity(p.cards,G.board,Math.min(opp,5),G.board.length?220:160);eq+=P.loose;
 const fair=1/(opp+1),odds=toCall/(pot+toCall||1),stack=p.chips+p.bet;
 const strong=eq>fair*1.9||eq>.72,good=eq>fair*1.35||eq>.55;
 const raiseAmt=f=>{let to=G.bet+Math.max(G.minR,Math.round((pot+toCall)*f));return Math.min(stack,to)};
 if(strong&&r<.75*P.agg)return{k:'raise',to:raiseAmt(.55+Math.random()*.6)};
 if(good&&toCall===0&&r<.45*P.agg)return{k:'raise',to:raiseAmt(.4+Math.random()*.3)};
 if(toCall===0){if(r<P.bluff&&G.street>0)return{k:'raise',to:raiseAmt(.5)};return{k:'call'}}
 if(eq>odds+.06||(toCall<=G.sb*2&&eq>fair*.7))return{k:'call'};
 if(r<P.bluff*.5&&toCall<stack*.15)return{k:'raise',to:raiseAmt(.7)};return{k:'fold'}}
/* ---------- Darstellung ---------- */
function card(c,cls='',hl=false){if(!c)return`<div class="pc back ${cls}"></div>`;const red=c.s==='♥'||c.s==='♦';return`<div class="pc ${red?'red':''} ${cls} ${hl?'hl':''}"><b>${c.r}</b><i>${c.s}</i><em>${c.s}</em></div>`}
function chips(n){const cols=['#e74c3c','#2e86de','#2ecc71','#111','#9b59b6','#f39c12'];let h='',k=Math.min(6,Math.max(1,Math.ceil(Math.log10(n+1)*1.6)));for(let i=0;i<k;i++)h+=`<span style="background:${cols[(n+i)%cols.length]};bottom:${i*3}px"></span>`;return`<span class="chs">${h}</span>`}
function render(v,send){if(!root){root=document.createElement('div');root.className='tg pk';document.body.appendChild(root)}root.style.display='flex';
 if(v.log!==lastLog){lastLog=v.log;K.sfx(/gewinnt/.test(v.log)?'coin':/ALL-IN|erhöht/.test(v.log)?'pop':'card')}
 const newHand=v.hand!==lastHand;if(newHand){lastHand=v.hand;lastBoard=0}const dealt=v.board.length;const newCards=dealt>lastBoard?lastBoard:dealt;lastBoard=dealt;
 const me=v.pl[v.me],myTurn=v.turn===v.me&&v.phase==='bet'&&!me.fold&&!me.allin&&!me.out;const maxTo=me.bet+me.chips;const minTo=Math.min(v.minRaise,maxTo);if(raiseTo<minTo||raiseTo>maxTo)raiseTo=minTo;
 const n=v.pl.length,seat=i=>{const k=(i-v.me+n)%n,a=Math.PI/2+k/n*Math.PI*2;return{l:50+Math.cos(a)*45,t:50+Math.sin(a)*43,bl:50+Math.cos(a)*27,bt:50+Math.sin(a)*24}};
 const seats=v.pl.map((p,i)=>{if(i===v.me)return'';const s=seat(i);return`<div class="pseat ${v.turn===i&&v.phase==='bet'?'turn':''} ${p.fold?'fold':''} ${p.out?'out':''} ${p.win?'won':''}" style="left:${s.l}%;top:${s.t}%">
  <div class="pcs">${p.cards.map((c,k)=>card(c,'sm'+(newHand?' deal':''),p.hl.includes(k))).join('')}</div>
  <div class="pava">${K.esc(p.name[0]||'?')}</div><div class="pinfo"><div class="pname">${i===v.dealer?'<span class="dbtn">D</span>':''}${K.esc(p.name)}</div><div class="pchips">${p.out?'raus':'🪙 '+p.chips}</div></div>
  <div class="plast">${p.win?'🏆 +'+p.win:K.esc(p.hn||p.last)}</div></div>${p.bet?`<div class="pbet" style="left:${s.bl}%;top:${s.bt}%">${chips(p.bet)}${p.bet}</div>`:''}`}).join('');
 const ms=seat(v.me);
 let acts='';
 if(v.winner)acts=`<div class="msg" style="color:#ffd23f">🏆 ${K.esc(v.winner)} gewinnt das Turnier!</div>${E.host?'<div class="bar"><button class="pri k-big" id="pAgain">🔁 Neues Turnier</button></div>':''}`;
 else if(myTurn){acts=`<div class="bar"><button id="pF" class="pfold">${v.toCall?'Passen':'Passen'}</button><button id="pC" class="pcall">${v.toCall?(v.toCall>=me.chips?'ALL-IN '+me.chips:'Mitgehen '+v.toCall):'Checken'}</button>${maxTo>v.bet?`<button id="pRB" class="praise">${raiseTo>=maxTo?'ALL-IN '+maxTo:(v.bet?'Erhöhen auf ':'Setzen ')+raiseTo}</button>`:''}</div>
  ${maxTo>v.bet&&maxTo>minTo?`<div class="bar prow"><input type="range" id="pR" min="${minTo}" max="${maxTo}" step="${v.sb}" value="${raiseTo}"><button data-q="m">Min</button><button data-q="h">½ Pot</button><button data-q="P">Pot</button><button data-q="a">All-in</button></div>`:''}`}
 else if(me.out)acts=`<div class="msg">Du bist raus – die anderen spielen weiter.</div>${E.host&&!E.room?'<div class="bar"><button class="pri" id="pAgain">🔁 Neues Turnier</button></div>':''}`;
 else acts=`<div class="msg pwait">${v.phase==='bet'?'⏳ '+K.esc(v.pl[v.turn].name)+' ist dran …':''}</div>`;
 root.innerHTML=`<div class="top"><a href="#" id="pB">← Menü</a><b>♠ POKER</b><span>Blinds ${v.sb}/${v.sb*2}${E.room?' · '+E.room.code:''}</span></div>
 <div class="ptable"><div class="prail"><div class="pfelt"><div class="plogo">♠ ♥ HOLD'EM ♦ ♣</div></div></div>
  <div class="pcenter"><div class="ppot">${v.pot?chips(v.pot)+' Pot: '+v.pot:''}</div><div class="pboard">${[0,1,2,3,4].map(i=>v.board[i]?card(v.board[i],i>=newCards?'deal d'+(i-newCards):'',v.bhl.includes(i)):'<div class="pc ghost"></div>').join('')}</div><div class="plog">${K.esc(v.log)}</div></div>
  ${seats}${me.bet?`<div class="pbet" style="left:${ms.bl}%;top:${ms.bt}%">${chips(me.bet)}${me.bet}</div>`:''}</div>
 <div class="phero ${myTurn?'turn':''} ${me.win?'won':''}"><div class="pcs big">${me.cards.map((c,k)=>card(c,newHand?'deal d'+k:'',me.hl.includes(k))).join('')}</div>
  <div><div class="pname">${v.me===v.dealer?'<span class="dbtn">D</span>':''}${K.esc(me.name)} <small>(du)</small></div><div class="pchips">🪙 ${me.chips}</div><div class="plast">${me.win?'🏆 +'+me.win:me.fold?'Gepasst':v.mine?'Du hast: <b>'+v.mine+'</b>':''}</div></div></div>
 ${acts}`;
 K.$('pB').onclick=e=>{e.preventDefault();if(!v.winner&&!me.out&&!confirm('Tisch verlassen?'))return;E.stop();root.style.display='none';menu()};
 if(K.$('pAgain'))K.$('pAgain').onclick=()=>{lastHand=-1;E.room?E.start(E.players,{chips:startChips}):E.solo(nBots,{chips:startChips})};
 if(v.winner&&v.winner!==lastWinner){lastWinner=v.winner;K.sfx(v.winner===me.name?'win':'lose')}if(!v.winner)lastWinner=null;
 if(!myTurn)return;K.sfx('blip');K.$('pF').onclick=()=>send({k:'fold'});K.$('pC').onclick=()=>send({k:'call'});
 if(K.$('pRB'))K.$('pRB').onclick=()=>send({k:'raise',to:raiseTo});
 if(K.$('pR')){K.$('pR').oninput=e=>{raiseTo=+e.target.value;K.$('pRB').textContent=raiseTo>=maxTo?'ALL-IN '+maxTo:(v.bet?'Erhöhen auf ':'Setzen ')+raiseTo};
  root.querySelectorAll('[data-q]').forEach(b=>b.onclick=()=>{const q=b.dataset.q;let to=q==='m'?minTo:q==='h'?v.bet+Math.round((v.pot+v.toCall)/2):q==='P'?v.bet+v.pot+v.toCall:maxTo;raiseTo=Math.max(minTo,Math.min(maxTo,to));K.$('pR').value=raiseTo;K.$('pRB').textContent=raiseTo>=maxTo?'ALL-IN '+maxTo:(v.bet?'Erhöhen auf ':'Setzen ')+raiseTo;K.sfx('click')})}}
const st=document.createElement('style');st.textContent=`.tg.pk{background:radial-gradient(1100px 700px at 50% 35%,#24324f,#0b1020 75%);gap:6px}
.ptable{position:relative;width:min(900px,96vw);height:min(470px,52vh,62vw);margin:8px 0 0;flex:0 0 auto}
.prail{position:absolute;inset:6% 4%;border-radius:999px;background:linear-gradient(180deg,#5a341a,#2e1a0b);box-shadow:0 18px 40px rgba(0,0,0,.6),inset 0 3px 0 rgba(255,255,255,.18);padding:16px}
.pfelt{width:100%;height:100%;border-radius:999px;background:radial-gradient(ellipse at 50% 40%,#2fa36a,#18774a 55%,#0e5234);box-shadow:inset 0 0 50px rgba(0,0,0,.55);display:grid;place-items:center;border:3px solid #c9a24a}
.plogo{position:absolute;bottom:22%;font-weight:900;letter-spacing:.3em;color:rgba(255,255,255,.12);font-size:clamp(10px,2vw,18px)}
.pcenter{position:absolute;left:50%;top:47%;transform:translate(-50%,-50%);text-align:center;display:flex;flex-direction:column;align-items:center;gap:6px;width:70%}

.pc.sm{width:clamp(26px,4.4vw,40px)}.pc.sm em{font-size:clamp(12px,2.2vw,20px)}.pc.sm i{display:none}.pc.sm b{font-size:clamp(9px,1.5vw,13px)}

.pinfo{background:rgba(8,12,24,.9);border-radius:10px;padding:8px 10px 4px;text-align:center;border:2px solid #2a3354;min-width:92px}
.pseat.turn .pinfo,.phero.turn{border-color:#ffd23f;box-shadow:0 0 18px rgba(255,210,63,.55)}.pseat.turn .pava{border-color:#ffd23f}
.pseat.fold{opacity:.45}.pseat.out{opacity:.25}.pseat.won .pinfo,.phero.won{border-color:#2ed573;box-shadow:0 0 22px rgba(46,213,115,.7)}
.pname{font-weight:800;font-size:13px;white-space:nowrap}.pname small{color:#ffd23f}.pchips{color:#ffd23f;font-weight:800;font-size:13px}.plast{font-size:11px;color:#cfe;min-height:14px;font-weight:700;text-shadow:0 1px 2px #000}
.pbet{position:absolute;transform:translate(-50%,-50%);background:rgba(0,0,0,.55);border-radius:99px;padding:2px 9px 2px 4px;font-weight:900;font-size:13px;display:flex;align-items:center;gap:5px;color:#ffe680}
.chs{position:relative;display:inline-block;width:16px;height:22px}.chs span{position:absolute;left:0;width:16px;height:6px;border-radius:50%;border:1.5px dashed rgba(255,255,255,.85);box-sizing:border-box}
.dbtn{background:#fff;color:#111;border-radius:50%;display:inline-grid;place-items:center;width:16px;height:16px;margin-right:4px;font-size:10px;font-weight:900}
.phero{display:flex;gap:14px;align-items:center;background:rgba(8,12,24,.85);border:2px solid #2a3354;border-radius:16px;padding:8px 16px;transition:.2s}
