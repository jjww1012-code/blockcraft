<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<script src="../shared/nozoom.js"></script>
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Verlies der Helden</title>
<link rel="stylesheet" href="../shared/kit.css">
<style>:root{--a:#f59e0b;--b:#a855f7}
.vb{position:fixed;z-index:6;display:none;border-radius:50%;background:rgba(20,16,30,.6);border:2px solid rgba(255,255,255,.35);color:#fff;font-size:28px;align-items:center;justify-content:center;flex-direction:column;touch-action:none;user-select:none}
.vb small{font-size:10px;font-weight:800}.vb.on{background:rgba(255,255,255,.3)}.vb.cd{opacity:.4}
#vAtk{right:max(22px,env(safe-area-inset-right));bottom:calc(max(22px,env(safe-area-inset-bottom)) + 10px);width:96px;height:96px;border-color:#f59e0b}
#vFire{right:max(130px,env(safe-area-inset-right));bottom:calc(max(22px,env(safe-area-inset-bottom)) + 4px);width:68px;height:68px}
#vDash{right:max(40px,env(safe-area-inset-right));bottom:calc(max(22px,env(safe-area-inset-bottom)) + 120px);width:64px;height:64px}
</style>
</head>
<body>
<div class="vb" id="vAtk">⚔️<small>HIEB</small></div><div class="vb" id="vFire">🔥<small>FEUER</small></div><div class="vb" id="vDash">💨<small>SPRINT</small></div>
<script src="../shared/kit.js"></script>
<script>
'use strict';
/* VERLIES DER HELDEN – Dungeon-Abenteuer: zufällige Etagen, Monster, Bosse, Relikte, Shop. */
const T=48,RW=15,RH=11,TAU=Math.PI*2,PI=Math.PI;
const C=K.canvas(1,1,{fill:true}),x=C.x;const stick=K.stick({left:true});
const META=Object.assign({gems:0,best:0,hp:0,dmg:0,gold:0,runs:0},K.store.get('vd_meta',{}));const saveM=()=>K.store.set('vd_meta',META);
const RELICS=[{k:'ruby',e:'💍',n:'Rubinring',d:'+1 Schaden',f:p=>p.dmg+=1},{k:'boots',e:'🥾',n:'Federstiefel',d:'+15 % Tempo',f:p=>p.spd*=1.15},{k:'amulet',e:'❤️',n:'Herzamulett',d:'+2 max. Leben',f:p=>{p.max+=2;p.hp+=2}},
 {k:'twin',e:'🗡️',n:'Zwillingsklinge',d:'Schneller zuschlagen',f:p=>p.rate*=.75},{k:'staff',e:'🪄',n:'Feuerstab',d:'Größere, stärkere Feuerbälle',f:p=>p.fire+=1},{k:'fang',e:'🦷',n:'Vampirzahn',d:'Jeder 12. Treffer heilt',f:p=>p.vamp+=1},
 {k:'thorn',e:'🌵',n:'Dornenpanzer',d:'Angreifer nehmen Schaden',f:p=>p.thorn+=1},{k:'coin',e:'🪙',n:'Glücksmünze',d:'+50 % Gold',f:p=>p.luck+=.5},{k:'bolt',e:'⚡',n:'Blitzring',d:'Treffer springen über',f:p=>p.chain+=1},
 {k:'ice',e:'❄️',n:'Frostamulett',d:'Treffer verlangsamen',f:p=>p.slow+=1},{k:'range',e:'🔱',n:'Lange Klinge',d:'+30 % Reichweite',f:p=>p.reach*=1.3},{k:'crit',e:'🎯',n:'Adlerauge',d:'+15 % kritische Treffer',f:p=>p.crit+=.15},
 {k:'shield',e:'🛡️',n:'Runenschild',d:'Blockt alle 8 s einen Treffer',f:p=>p.block+=1},{k:'dash',e:'🌪️',n:'Wirbelmantel',d:'Sprint verursacht Schaden',f:p=>p.dashDmg+=1}];
let G=null,state='menu',shake=0,parts=[],nums=[];
/* ---------- Etagen-Generator ---------- */
function genFloor(n){const rooms=new Map(),key=(a,b)=>a+','+b;let cx=0,cy=0;rooms.set(key(0,0),{gx:0,gy:0,type:'start'});const want=7+Math.min(7,n*1.5|0);
 while(rooms.size<want){const d=K.pick([[1,0],[-1,0],[0,1],[0,-1]]);cx=K.clamp(cx+d[0],-4,4);cy=K.clamp(cy+d[1],-4,4);if(!rooms.has(key(cx,cy)))rooms.set(key(cx,cy),{gx:cx,gy:cy,type:'fight'});if(Math.random()<.25){const a=K.pick([...rooms.values()]);cx=a.gx;cy=a.gy}}
 const L=[...rooms.values()];const dist=r=>Math.abs(r.gx)+Math.abs(r.gy);L.sort((a,b)=>dist(b)-dist(a));L[0].type='boss';const rest=L.filter(r=>r.type==='fight');if(rest.length>2){rest[rest.length-1].type='treasure';rest[rest.length-2].type='shop'}if(rest.length>5&&Math.random()<.6)rest[2].type='treasure';
 for(const r of L){r.doors={};for(const [d,dx,dy] of[['n',0,-1],['s',0,1],['w',-1,0],['e',1,0]])if(rooms.has(key(r.gx+dx,r.gy+dy)))r.doors[d]=1;r.seen=r.type==='start';r.clear=r.type!=='fight'&&r.type!=='boss';r.tiles=mkTiles(r)}return{rooms,key,cur:rooms.get(key(0,0))}}
function mkTiles(r){const t=[];for(let y=0;y<RH;y++){t[y]=[];for(let x0=0;x0<RW;x0++){let v=x0===0||y===0||x0===RW-1||y===RH-1?1:0;t[y][x0]=v}}
 const D={n:[7,0],s:[7,RH-1],w:[0,5],e:[RW-1,5]};for(const d in r.doors){const [a,b]=D[d];t[b][a]=2}
 if(r.type==='fight'){const pat=K.ri(0,3);if(pat===1)for(const [a,b] of[[4,3],[10,3],[4,7],[10,7]])t[b][a]=1;if(pat===2)for(let i=5;i<=9;i++)t[5][i]=i===7?0:1;if(pat===3){for(const [a,b] of[[3,2],[11,2],[3,8],[11,8]])t[b][a]=3}}
 return t}
/* ---------- Spieler ---------- */
function newRun(){const p={x:7.5*T,y:5.5*T,r:15,hp:6+META.hp*2,max:6+META.hp*2,dmg:2+META.dmg,spd:220,rate:.42,reach:62,fire:1,vamp:0,thorn:0,luck:META.gold*.2,chain:0,slow:0,crit:.05,block:0,dashDmg:0,
  atkT:0,fireT:0,dashT:0,dashing:0,inv:0,face:0,swing:0,gold:0,hits:0,blockT:0,relics:[],kills:0};
 G={floor:1,p,F:null,en:[],shots:[],loot:[],swipe:null,msg:'',msgT:0,t:0};newFloor()}
function newFloor(){G.F=genFloor(G.floor);enterRoom(G.F.cur,null);showMsg('Etage '+G.floor+(G.floor%3===0?' – Ein mächtiger Boss wartet!':''))}
function showMsg(t){G.msg=t;G.msgT=2.6}
function enterRoom(r,from){G.F.cur=r;r.seen=true;G.en=[];G.shots=[];G.loot=G.loot.filter(l=>l.room===r);const p=G.p;
 if(from==='n'){p.x=7.5*T;p.y=(RH-2)*T+T/2}else if(from==='s'){p.x=7.5*T;p.y=1.5*T}else if(from==='w'){p.x=(RW-2)*T+T/2;p.y=5.5*T}else if(from==='e'){p.x=1.5*T;p.y=5.5*T}
 if(!r.clear){if(r.type==='boss')spawnBoss();else{const n=3+Math.min(8,G.floor+K.ri(0,3));for(let i=0;i<n;i++){let ex,ey;for(let k=0;k<40;k++){ex=K.ri(2,RW-3);ey=K.ri(2,RH-3);if(r.tiles[ey][ex]===0&&Math.hypot(ex*T-p.x,ey*T-p.y)>200)break}spawn(K.pick(pool()),(ex+.5)*T,(ey+.5)*T)}}K.sfx('bad');}
 if(r.type==='treasure'&&!r.opened)G.loot.push({room:r,k:'chest',x:7.5*T,y:5.5*T});
 if(r.type==='shop'&&!r.stock){r.stock=[{k:'heart',cost:15},{k:'relic',rel:K.pick(RELICS),cost:45+G.floor*5},{k:'maxhp',cost:35}];r.stock.forEach((s,i)=>G.loot.push({room:r,k:'shop',i,x:(4.5+i*3)*T,y:5*T,s}))}
 if(r.type==='boss'&&r.clear&&!r.stairs){r.stairs=1}}
function pool(){const f=G.floor;const P=['slime','bat'];if(f>=2)P.push('skel');if(f>=2)P.push('slime');if(f>=3)P.push('knight');if(f>=4)P.push('ghost');if(f>=5)P.push('mage');return P}
const EN={slime:{hp:5,spd:60,r:16,col:'#4ade80',dmg:1,gold:2},bat:{hp:3,spd:150,r:12,col:'#a78bfa',dmg:1,gold:2},skel:{hp:6,spd:70,r:15,col:'#e5e7eb',dmg:1,gold:3,shoot:1.8},knight:{hp:12,spd:80,r:18,col:'#94a3b8',dmg:2,gold:5,charge:1},ghost:{hp:7,spd:95,r:15,col:'#bae6fd',dmg:1,gold:4,phase:1},mage:{hp:8,spd:55,r:15,col:'#f472b6',dmg:1,gold:5,shoot:1.3,ring:1}};
function spawn(k,ex,ey,o){const d=EN[k],sc=1+(G.floor-1)*.22;G.en.push(Object.assign({k,x:ex,y:ey,hp:Math.ceil(d.hp*sc),max:Math.ceil(d.hp*sc),vx:0,vy:0,t:Math.random()*2,hit:0,slowT:0,d,stun:0},o||{}))}
function spawnBoss(){const b=['slimeK','boneL','dragon'][Math.floor((G.floor-1)/3)%3];const hp=60+G.floor*25;G.en.push({k:b,boss:1,x:7.5*T,y:3.5*T,hp,max:hp,vx:0,vy:0,t:0,hit:0,slowT:0,stun:0,d:{r:34,spd:70,dmg:2,gold:40,col:b==='slimeK'?'#22c55e':b==='boneL'?'#f5f5f4':'#ef4444'},ph:0});showMsg(['👑 Der Schleimkönig','💀 Der Knochenlord','🐉 Der Feuerdrache'][['slimeK','boneL','dragon'].indexOf(b)])}
/* ---------- Kampf ---------- */
const solid=(px,py,ghost)=>{const r=G.F.cur;const tx=Math.floor(px/T),ty=Math.floor(py/T);if(tx<0||ty<0||tx>=RW||ty>=RH)return true;const v=r.tiles[ty][tx];if(v===2)return !r.clear;if(v===3)return false;return v===1&&!(ghost&&tx>0&&ty>0&&tx<RW-1&&ty<RH-1)};
function moveE(e,dx,dy,r,ghost){const nx=e.x+dx,ny=e.y+dy;if(!solid(nx+Math.sign(dx)*r,e.y,ghost)&&!solid(nx+Math.sign(dx)*r,e.y+r*.7,ghost)&&!solid(nx+Math.sign(dx)*r,e.y-r*.7,ghost))e.x=nx;if(!solid(e.x,ny+Math.sign(dy)*r,ghost)&&!solid(e.x+r*.7,ny+Math.sign(dy)*r,ghost)&&!solid(e.x-r*.7,ny+Math.sign(dy)*r,ghost))e.y=ny}
function nearestEn(R){let b=null,bd=R;for(const e of G.en){const d=Math.hypot(e.x-G.p.x,e.y-G.p.y);if(d<bd){bd=d;b=e}}return b}
function attack(){const p=G.p;if(p.atkT>0||state!=='play')return;p.atkT=p.rate;const tg=nearestEn(p.reach+90);if(tg)p.face=Math.atan2(tg.y-p.y,tg.x-p.x);p.swing=.2;K.sfx('whoosh',.5);
 for(const e of [...G.en]){const d=Math.hypot(e.x-p.x,e.y-p.y),a=Math.atan2(e.y-p.y,e.x-p.x);let da=Math.abs(Math.atan2(Math.sin(a-p.face),Math.cos(a-p.face)));if(d<p.reach+(e.d.r||16)&&da<1.25)hurt(e,p.dmg,a)}
 // Fässer zerschlagen
 const r=G.F.cur;for(let y=0;y<RH;y++)for(let x0=0;x0<RW;x0++)if(r.tiles[y][x0]===3){const cx=(x0+.5)*T,cy=(y+.5)*T;if(Math.hypot(cx-p.x,cy-p.y)<p.reach+20){r.tiles[y][x0]=0;burst(cx,cy,'#a16207',14);K.sfx('hit',.6);if(Math.random()<.5)G.loot.push({room:r,k:Math.random()<.3?'heart':'gold',x:cx,y:cy,v:1+G.floor})}}}
function fire(){const p=G.p;if(p.fireT>0||state!=='play')return;p.fireT=1.6;const tg=nearestEn(500);const a=tg?Math.atan2(tg.y-p.y,tg.x-p.x):p.face;G.shots.push({x:p.x,y:p.y,vx:Math.cos(a)*420,vy:Math.sin(a)*420,r:8+p.fire*3,mine:1,dmg:p.dmg+p.fire,t:1.6});K.sfx('shoot',.6)}
function dash(){const p=G.p;if(p.dashT>0||state!=='play')return;p.dashT=1.1;p.dashing=.18;p.inv=Math.max(p.inv,.3);let dx=stick.x+K.dirKeys().x,dy=stick.y+K.dirKeys().y;if(!dx&&!dy){dx=Math.cos(p.face);dy=Math.sin(p.face)}const l=Math.hypot(dx,dy);p.dvx=dx/l*900;p.dvy=dy/l*900;K.sfx('whoosh')}
function hurt(e,dmg,a,noChain){const p=G.p;let crit=Math.random()<p.crit;const d=dmg*(crit?2:1);e.hp-=d;e.hit=.12;if(!e.boss){e.vx+=Math.cos(a)*260;e.vy+=Math.sin(a)*260}if(p.slow)e.slowT=1.5*p.slow;
 nums.push({x:e.x,y:e.y-20,t:crit?'💥'+d:''+d,l:.8,c:crit?'#fbbf24':'#fff'});burst(e.x,e.y,e.d.col,6);K.sfx('hit',.5);shake=Math.max(shake,e.boss?.15:.06);
 p.hits++;if(p.vamp&&p.hits%Math.max(4,12-p.vamp*3)===0&&p.hp<p.max){p.hp++;nums.push({x:p.x,y:p.y-30,t:'+❤',l:.9,c:'#f87171'})}
 if(p.chain&&!noChain){let n=p.chain;for(const o of G.en){if(o===e||n<=0)continue;if(Math.hypot(o.x-e.x,o.y-e.y)<140){n--;G.zaps=(G.zaps||[]).concat([{a:[e.x,e.y],b:[o.x,o.y],t:.15}]);hurt(o,Math.ceil(dmg/2),a,true)}}}
 if(e.hp<=0)kill(e)}
function kill(e){const i=G.en.indexOf(e);if(i<0)return;G.en.splice(i,1);G.p.kills++;burst(e.x,e.y,e.d.col,e.boss?60:18);K.sfx(e.boss?'boom':'pop');
 const g=Math.ceil(e.d.gold*(1+G.p.luck)*(1+G.floor*.1));for(let k=0;k<Math.min(8,Math.ceil(g/2));k++)G.loot.push({room:G.F.cur,k:'gold',x:e.x+K.rnd(-20,20),y:e.y+K.rnd(-20,20),v:Math.ceil(g/Math.min(8,Math.ceil(g/2)))});
 if(Math.random()<.08)G.loot.push({room:G.F.cur,k:'heart',x:e.x,y:e.y});
 if(e.k==='slime'&&!e.small){for(let k=0;k<2;k++)spawn('slime',e.x+K.rnd(-15,15),e.y+K.rnd(-15,15),{small:1,hp:2,max:2,d:Object.assign({},EN.slime,{r:10,gold:1})})}
 if(e.boss){G.loot.push({room:G.F.cur,k:'relic',rel:K.pick(RELICS.filter(r=>!G.p.relics.includes(r.k))||RELICS),x:e.x,y:e.y});G.F.cur.stairs=1;META.gems+=2+Math.floor(G.floor/3);saveM();showMsg('🏆 Boss besiegt! +💎 Steig die Treppe hinab')}
 if(!G.en.length&&!G.F.cur.clear){G.F.cur.clear=true;K.sfx('level');if(Math.random()<.35&&G.F.cur.type==='fight')G.loot.push({room:G.F.cur,k:'chest',x:7.5*T,y:5.5*T})}}
function hurtP(n,src){const p=G.p;if(p.inv>0||state!=='play')return;if(p.block&&p.blockT<=0){p.blockT=8/p.block;p.inv=.5;nums.push({x:p.x,y:p.y-30,t:'🛡️',l:.8,c:'#93c5fd'});return}
 p.hp-=n;p.inv=1;shake=.3;K.sfx('hurt');burst(p.x,p.y,'#ef4444',12);if(p.thorn&&src&&src.hp){src.hp-=p.thorn*2;if(src.hp<=0)kill(src)}if(p.hp<=0)gameOver()}
function gameOver(){state='dead';const g=G.floor*2+Math.floor(G.p.kills/10);META.gems+=g;META.runs++;if(G.floor>META.best)META.best=G.floor;saveM();K.sfx('lose');
 setTimeout(()=>K.result('☠️ GEFALLEN',`<table class="k-table"><tr><td>Erreichte Etage</td><td><b>${G.floor}</b></td></tr><tr><td>Monster besiegt</td><td>${G.p.kills}</td></tr><tr><td>Relikte</td><td>${G.p.relics.map(k=>RELICS.find(r=>r.k===k).e).join(' ')||'–'}</td></tr><tr><td>Belohnung</td><td>💎 ${g}</td></tr><tr><td>Rekord</td><td>Etage ${META.best}</td></tr></table>`,[{t:'⚔️ Neuer Versuch',f:start},{t:'💎 Verbesserungen',f:upg},{t:'Menü',f:menu}]),900)}
/* ---------- Update ---------- */
function update(dt){const p=G.p,r=G.F.cur;G.t+=dt;p.atkT-=dt;p.fireT-=dt;p.dashT-=dt;p.inv-=dt;p.swing-=dt;p.blockT-=dt;G.msgT-=dt;
 let mx=stick.x+K.dirKeys().x,my=stick.y+K.dirKeys().y;const l=Math.hypot(mx,my);if(l>1){mx/=l;my/=l}
 if(p.dashing>0){p.dashing-=dt;moveE(p,p.dvx*dt,p.dvy*dt,p.r);if(p.dashDmg)for(const e of [...G.en])if(Math.hypot(e.x-p.x,e.y-p.y)<40&&!e.dashed){e.dashed=.3;hurt(e,p.dashDmg*2,Math.atan2(e.y-p.y,e.x-p.x))}}
 else if(l>.05){moveE(p,mx*p.spd*dt,my*p.spd*dt,p.r);if(!G.en.length||p.atkT<0)p.face=Math.atan2(my,mx)}
 if(K.keys[' ']||K.keys.j)attack();if(K.keys.k||K.keys.e)fire();if(K.keys.shift||K.keys.l)dash();
 // Türen
 if(r.clear){const tx=Math.floor(p.x/T),ty=Math.floor(p.y/T);const go=(d,dx,dy)=>{const nr=G.F.rooms.get(G.F.key(r.gx+dx,r.gy+dy));if(nr){enterRoom(nr,d);K.sfx('click')}};if(ty<=0&&r.doors.n)go('n',0,-1);else if(ty>=RH-1&&r.doors.s)go('s',0,1);else if(tx<=0&&r.doors.w)go('w',-1,0);else if(tx>=RW-1&&r.doors.e)go('e',1,0)}
 // Gegner
 for(const e of [...G.en]){e.t+=dt;e.hit-=dt;e.slowT-=dt;if(e.dashed)e.dashed-=dt;const sl=e.slowT>0?.5:1;const dx=p.x-e.x,dy=p.y-e.y,d=Math.hypot(dx,dy)||1;e.vx*=Math.pow(.01,dt);e.vy*=Math.pow(.01,dt);let ax=0,ay=0;const D=e.d;
  if(e.boss)bossAI(e,dt,dx,dy,d);
  else if(e.k==='bat'){ax=dx/d+Math.sin(e.t*5)*.8;ay=dy/d+Math.cos(e.t*4)*.8}
  else if(D.shoot){if(d<150){ax=-dx/d;ay=-dy/d}else if(d>300){ax=dx/d;ay=dy/d}else{ax=-dy/d*.6;ay=dx/d*.6}if(e.t>D.shoot){e.t=0;const a=Math.atan2(dy,dx);if(D.ring){for(let k=0;k<8;k++){const b=a+k/8*TAU;G.shots.push({x:e.x,y:e.y,vx:Math.cos(b)*160,vy:Math.sin(b)*160,r:7,t:3,col:'#f472b6'})}}else G.shots.push({x:e.x,y:e.y,vx:Math.cos(a)*260,vy:Math.sin(a)*260,r:5,t:3,col:'#e5e7eb'});K.sfx('shoot',.3)}}
  else if(D.charge){if(!e.ch&&e.t>2.2&&d<320){e.ch=.6;e.cdx=dx/d;e.cdy=dy/d;e.t=0}if(e.ch>0){e.ch-=dt;if(e.ch<.35){ax=e.cdx*4;ay=e.cdy*4}}else{ax=dx/d;ay=dy/d}if(e.ch<=0)e.ch=0}
  else{ax=dx/d;ay=dy/d;if(e.k==='slime'){const hop=Math.sin(e.t*4)>0?1:.2;ax*=hop;ay*=hop}}
  if(!e.boss)moveE(e,(ax*D.spd*sl+e.vx)*dt,(ay*D.spd*sl+e.vy)*dt,D.r*.8,D.phase);
  if(d<D.r+p.r)hurtP(D.dmg,e)}
 for(let i=0;i<G.en.length;i++)for(let j=i+1;j<G.en.length;j++){const a=G.en[i],b=G.en[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.hypot(dx,dy),R=(a.d.r+b.d.r)*.9;if(d<R&&d>0&&!a.boss&&!b.boss){const o=(R-d)/2;a.x-=dx/d*o;a.y-=dy/d*o;b.x+=dx/d*o;b.y+=dy/d*o}}
 // Geschosse
 for(let i=G.shots.length-1;i>=0;i--){const s=G.shots[i];s.x+=s.vx*dt;s.y+=s.vy*dt;s.t-=dt;let dead=s.t<=0||solid(s.x,s.y);
  if(s.mine){for(const e of [...G.en])if(Math.hypot(e.x-s.x,e.y-s.y)<e.d.r+s.r){hurt(e,s.dmg,Math.atan2(s.vy,s.vx));dead=true;burst(s.x,s.y,'#f97316',10);break}}
  else if(Math.hypot(p.x-s.x,p.y-s.y)<p.r+s.r){hurtP(1);dead=true}
  if(dead){if(s.mine)burst(s.x,s.y,'#fb923c',8);G.shots.splice(i,1)}}
 // Beute
 for(let i=G.loot.length-1;i>=0;i--){const L=G.loot[i];if(L.room!==r)continue;const d=Math.hypot(L.x-p.x,L.y-p.y);
