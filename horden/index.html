<script>
'use strict';
/* HORDEN-ÜBERLEBEN – 10 Minuten gegen endlose Monster. Waffen feuern automatisch. */
const TAU=Math.PI*2,WIN_T=600;
const HEROES=[{n:'Magierin',e:'🧙‍♀️',w:'wand',hp:90,sp:150,d:'Startet mit Zauberstab'},{n:'Ritter',e:'🤺',w:'whip',hp:130,sp:140,d:'Startet mit Peitsche, mehr Leben'},{n:'Waldläufer',e:'🏹',w:'axe',hp:100,sp:165,d:'Startet mit Axt, schneller'}];
const WP={wand:{n:'Zauberstab',e:'🪄',d:'Schießt auf den nächsten Gegner'},whip:{n:'Peitsche',e:'〰️',d:'Hieb nach links und rechts'},axe:{n:'Axt',e:'🪓',d:'Fliegt im Bogen nach oben'},garlic:{n:'Knoblauch',e:'🧄',d:'Schadensaura um dich herum'},books:{n:'Zauberbücher',e:'📖',d:'Kreisen um dich herum'},bolt:{n:'Blitzschlag',e:'⚡',d:'Trifft zufällige Gegner'},fire:{n:'Feuerball',e:'🔥',d:'Durchbohrt mehrere Gegner'},boom:{n:'Bumerang',e:'🪃',d:'Fliegt hin und zurück'}};
const PS={hp:{n:'Herz',e:'❤️',d:'+20 max. Leben'},spd:{n:'Stiefel',e:'👟',d:'+10% Tempo'},mag:{n:'Magnet',e:'🧲',d:'+40% Sammelradius'},cd:{n:'Sanduhr',e:'⏳',d:'-8% Abklingzeit'},dmg:{n:'Kraft',e:'💪',d:'+12% Schaden'},reg:{n:'Pflaster',e:'🩹',d:'+0,4 Leben/s'},amt:{n:'Doppler',e:'✨',d:'+1 Geschoss'}};
const EN={bat:['🦇',8,95,5,1,12],zom:['🧟',16,55,8,2,16],skel:['💀',30,70,9,2,16],ghost:['👻',18,120,7,2,14],wolf:['🐺',40,110,10,3,18],spider:['🕷️',26,90,8,2,15],ogre:['👹',140,50,16,8,26],golem:['🗿',300,40,20,15,30],dragon:['🐉',2200,60,28,80,46]};
let state='menu',hero=0,P=null,ens=[],gems=[],bul=[],fx=[],items=[],t=0,kills=0,spawnT=0,lvlQ=0,paused=false,cam={x:0,y:0},grid=new Map(),bossDone={};
const C=K.canvas(100,100,{fill:true}),x=C.x,stick=K.stick({left:false});
/* Emoji-Sprites vorbereiten */
const SPR={};function spr(e,s){const k=e+s;if(SPR[k])return SPR[k];const c=document.createElement('canvas');c.width=c.height=s*2;const g=c.getContext('2d');g.font=`${s*1.6}px system-ui`;g.textAlign='center';g.textBaseline='middle';g.fillText(e,s,s*1.08);SPR[k]=c;return c}
function start(){const h=HEROES[hero];P={x:0,y:0,hp:h.hp,max:h.hp,sp:h.sp,lvl:1,xp:0,need:4,w:{[h.w]:1},p:{},face:1,inv:0,mag:100,regT:0,e:h.e,cd:{}};ens=[];gems=[];bul=[];fx=[];items=[];t=0;kills=0;spawnT=0;lvlQ=0;paused=false;bossDone={};state='play';K.hideAll();hud.style.display='block';K.sfx('level')}
const pv=k=>P.p[k]||0,dmgM=()=>1+.12*pv('dmg'),cdM=()=>Math.pow(.92,pv('cd')),amt=()=>pv('amt');
function nearest(n=1,maxD=600){return ens.filter(e=>!e.dead).map(e=>[e,Math.hypot(e.x-P.x,e.y-P.y)]).filter(a=>a[1]<maxD).sort((a,b)=>a[1]-b[1]).slice(0,n).map(a=>a[0])}
function fire(dt){for(const k in P.w){const L=P.w[k];P.cd[k]=(P.cd[k]||0)-dt;if(k==='garlic'){P.cd[k]<=0&&(P.cd[k]=.35,aura(L));continue}if(k==='books'){books(L,dt);continue}if(P.cd[k]>0)continue;
 if(k==='wand'){P.cd[k]=(.8-L*.07)*cdM();const ts=nearest(1+Math.floor((L+1)/3)+amt());ts.forEach((e,i)=>{const a=Math.atan2(e.y-P.y,e.x-P.x);bul.push({k,x:P.x,y:P.y,vx:Math.cos(a)*480,vy:Math.sin(a)*480,dmg:(13+L*5)*dmgM(),pierce:1+Math.floor(L/4),life:1.4,r:7})});if(ts.length)K.sfx('blip')}
 else if(k==='whip'){P.cd[k]=(1.3-L*.08)*cdM();for(let s=0;s<(L>=3?2:1)+amt()&&s<3;s++){const dir=s%2?-P.face:P.face;fx.push({k:'whip',x:P.x,y:P.y-8-s*16,dir,l:.22,w:110+L*16});for(const e of ens){const dx=(e.x-P.x)*dir;if(dx>-10&&dx<120+L*16&&Math.abs(e.y-(P.y-8-s*16))<40)hit(e,(14+L*6)*dmgM(),dir*220,0)}}K.sfx('whoosh')}
 else if(k==='axe'){P.cd[k]=(1.5-L*.1)*cdM();for(let i=0;i<1+Math.floor(L/2)+amt();i++)bul.push({k,x:P.x,y:P.y,vx:(Math.random()-.5)*300+P.face*60,vy:-560-Math.random()*120,g:900,dmg:(22+L*8)*dmgM(),pierce:99,life:2.2,r:16,rot:0});K.sfx('whoosh')}
 else if(k==='bolt'){P.cd[k]=(1.8-L*.15)*cdM();const al=ens.filter(e=>!e.dead&&Math.abs(e.x-P.x)<innerWidth/2&&Math.abs(e.y-P.y)<innerHeight/2);for(let i=0;i<1+L+amt()&&al.length;i++){const e=K.pick(al);fx.push({k:'bolt',x:e.x,y:e.y,l:.25});for(const o of ens)if(Math.hypot(o.x-e.x,o.y-e.y)<40+L*6)hit(o,(24+L*9)*dmgM(),0,0)}K.sfx('hit')}
 else if(k==='fire'){P.cd[k]=(2-L*.15)*cdM();const e=nearest(1)[0];const a=e?Math.atan2(e.y-P.y,e.x-P.x):(P.face>0?0:Math.PI);for(let i=0;i<1+amt()+(L>=4?1:0);i++){const aa=a+(i-(amt()+(L>=4?1:0))/2)*.25;bul.push({k,x:P.x,y:P.y,vx:Math.cos(aa)*330,vy:Math.sin(aa)*330,dmg:(30+L*12)*dmgM(),pierce:3+L,life:2,r:14+L*2})}K.sfx('shoot')}
 else if(k==='boom'){P.cd[k]=(1.6-L*.1)*cdM();const ts=nearest(1+amt()+(L>=3?1:0));(ts.length?ts:[{x:P.x+P.face*100,y:P.y}]).forEach(e=>{const a=Math.atan2(e.y-P.y,e.x-P.x);bul.push({k,x:P.x,y:P.y,vx:Math.cos(a)*520,vy:Math.sin(a)*520,back:1,dmg:(16+L*7)*dmgM(),pierce:99,life:2.4,r:13,rot:0,hitT:new Map()})});K.sfx('whoosh')}}}
function aura(L){const R=60+L*14+pv('amt')*6;for(const e of ens)if(Math.hypot(e.x-P.x,e.y-P.y)<R+e.r)hit(e,(3+L*2.2)*dmgM(),(e.x-P.x)*.6,(e.y-P.y)*.6,true)}
function books(L,dt){P.ba=(P.ba||0)+dt*(2.6+L*.25);const n=1+L+amt(),R=80+L*8;for(let i=0;i<n;i++){const a=P.ba+i*TAU/n,bx=P.x+Math.cos(a)*R,by=P.y+Math.sin(a)*R;for(const e of ens){if(Math.hypot(e.x-bx,e.y-by)<e.r+16&&(!e.bt||t-e.bt>.4)){e.bt=t;hit(e,(12+L*5)*dmgM(),Math.cos(a)*200,Math.sin(a)*200)}}}}
function hit(e,d,kx,ky,quiet){if(e.dead)return;e.hp-=d;e.fl=.1;e.kx+=kx*(e.big?.2:1);e.ky+=ky*(e.big?.2:1);if(!quiet||Math.random()<.2)fx.push({k:'num',x:e.x+(Math.random()-.5)*14,y:e.y-e.r,s:Math.round(d),l:.6});
 if(e.hp<=0){e.dead=true;kills++;const v=EN[e.t][4];gems.push({x:e.x,y:e.y,v});if(e.t==='ogre'||e.t==='golem')items.push({k:'chest',x:e.x,y:e.y});if(e.t==='dragon'){items.push({k:'chest',x:e.x,y:e.y});K.sfx('win')}if(Math.random()<.012)items.push({k:Math.random()<.6?'food':'magnet',x:e.x,y:e.y});
  K.burst(e.x,e.y,6,e.t==='bat'?'#7c3aed':'#a3a3a3',90,.35,4)}}
function spawn(dt){const m=t/60,rate=1.7+m*1.6+m*m*.2;spawnT+=dt*rate;let guard=0;while(spawnT>=1&&guard++<20){spawnT--;if(ens.length>420)break;
 const pool=m<1?['bat','zom']:m<2.5?['bat','zom','skel','spider']:m<4?['skel','ghost','spider','wolf','zom']:m<6?['ghost','wolf','skel','spider','ogre']:['wolf','ghost','ogre','skel','golem','spider'];const k=Math.random()<.03+m*.006&&m>2?(m>6?'golem':'ogre'):K.pick(pool);addEn(k)}
 for(const bt of [180,360,540])if(t>=bt&&!bossDone[bt]){bossDone[bt]=1;addEn('dragon',1+bt/300);fx.push({k:'banner',s:'🐉 Ein Drache erscheint!',l:2.5});K.sfx('boom')}
 if(Math.random()<dt*.05&&m>1){const a=Math.random()*TAU;for(let i=0;i<18+m*4;i++)addEn(m<4?'bat':'ghost',1,a)}}
function addEn(k,mul=1,ang){const E=EN[k],a=ang??Math.random()*TAU,R=Math.hypot(innerWidth,innerHeight)/2+60+Math.random()*80,hpM=1+t/150;ens.push({t:k,x:P.x+Math.cos(a+(ang!=null?(Math.random()-.5)*.5:0))*R,y:P.y+Math.sin(a+(ang!=null?(Math.random()-.5)*.5:0))*R,hp:E[1]*hpM*mul,max:E[1]*hpM*mul,sp:E[2]*(.9+Math.random()*.2),dmg:E[3]*(.6+t/250),r:E[5],kx:0,ky:0,fl:0,big:E[1]>=140,wob:Math.random()*6})}
function choices(){const opts=[];for(const k in P.w)if(P.w[k]<6)opts.push(['w',k]);if(Object.keys(P.w).length<6)for(const k in WP)if(!P.w[k])opts.push(['w',k]);for(const k in PS)if(pv(k)<5&&(Object.keys(P.p).length<6||P.p[k]))opts.push(['p',k]);return K.shuffle(opts).slice(0,3)}
function levelUp(){paused=true;K.sfx('level');const ch=choices();if(!ch.length){paused=false;return}
 lvl.innerHTML=`<div class="hlv"><h2>⬆ LEVEL ${P.lvl}!</h2><p>Wähle eine Verbesserung</p>${ch.map(([t,k],i)=>{const D=t==='w'?WP[k]:PS[k],cur=t==='w'?P.w[k]||0:pv(k);return`<button data-i="${i}"><span>${D.e}</span><div><b>${D.n} ${cur?'→ Stufe '+(cur+1):'<em>NEU!</em>'}</b><small>${D.d}</small></div></button>`}).join('')}</div>`;lvl.style.display='flex';
 lvl.querySelectorAll('button').forEach(b=>b.onclick=()=>{const [ty,k]=ch[+b.dataset.i];if(ty==='w')P.w[k]=(P.w[k]||0)+1;else{P.p[k]=pv(k)+1;if(k==='hp'){P.max+=20;P.hp+=20}if(k==='spd')P.sp*=1.1;if(k==='mag')P.mag*=1.4}K.sfx('coin');lvl.style.display='none';lvl.innerHTML='';lvlQ--;if(lvlQ>0){P.lvl++;levelUp()}else paused=false})}
function chest(){paused=true;const ch=choices().slice(0,1);if(!ch.length){paused=false;return}const [ty,k]=ch[0];const D=ty==='w'?WP[k]:PS[k];if(ty==='w')P.w[k]=(P.w[k]||0)+1;else{P.p[k]=pv(k)+1;if(k==='hp'){P.max+=20;P.hp+=20}if(k==='spd')P.sp*=1.1;if(k==='mag')P.mag*=1.4}
 lvl.innerHTML=`<div class="hlv"><h2>🎁 SCHATZTRUHE!</h2><div style="font-size:70px">${D.e}</div><p><b>${D.n}</b> – ${D.d}</p><button class="pri">Weiter</button></div>`;lvl.style.display='flex';K.sfx('win');lvl.querySelector('button').onclick=()=>{lvl.style.display='none';lvl.innerHTML='';paused=false}}
function sim(dt){if(state!=='play'||paused)return;t+=dt;const k=K.dirKeys();let mx=stick.on?stick.x:k.x,my=stick.on?stick.y:k.y;const d=Math.hypot(mx,my);if(d>1){mx/=d;my/=d}P.x+=mx*P.sp*dt;P.y+=my*P.sp*dt;if(Math.abs(mx)>.1)P.face=mx>0?1:-1;P.moving=d>.1;
 P.inv=Math.max(0,P.inv-dt);P.regT+=dt;if(P.regT>1){P.regT=0;P.hp=Math.min(P.max,P.hp+pv('reg')*.4)}
 spawn(dt);fire(dt);
 grid.clear();for(const e of ens){const key=(Math.floor(e.x/48))+','+(Math.floor(e.y/48));let c=grid.get(key);if(!c)grid.set(key,c=[]);c.push(e)}
 for(const e of ens){if(e.dead)continue;const dx=P.x-e.x,dy=P.y-e.y,dd=Math.hypot(dx,dy)||1;let vx=dx/dd*e.sp,vy=dy/dd*e.sp;
  const gx=Math.floor(e.x/48),gy=Math.floor(e.y/48);for(let i=-1;i<=1;i++)for(let j=-1;j<=1;j++){const c=grid.get((gx+i)+','+(gy+j));if(!c)continue;for(const o of c){if(o===e)continue;const ox=e.x-o.x,oy=e.y-o.y,od=ox*ox+oy*oy,rr=(e.r+o.r)*.8;if(od<rr*rr&&od>0){const q=Math.sqrt(od);vx+=ox/q*60;vy+=oy/q*60}}}
  e.x+=(vx+e.kx)*dt;e.y+=(vy+e.ky)*dt;e.kx*=.86;e.ky*=.86;e.fl=Math.max(0,e.fl-dt);
  if(dd<e.r+14&&P.inv<=0){P.hp-=e.dmg;P.inv=.45;K.sfx('hit');fx.push({k:'hurt',l:.25});if(P.hp<=0){P.hp=0;return over(false)}}
  if(dd>Math.hypot(innerWidth,innerHeight)*.9&&!e.big){const a=Math.random()*TAU,R=Math.hypot(innerWidth,innerHeight)/2+50;e.x=P.x+Math.cos(a)*R;e.y=P.y+Math.sin(a)*R}}
 ens=ens.filter(e=>!e.dead);
 for(const b of bul){b.life-=dt;if(b.g)b.vy+=b.g*dt;if(b.back){const age=2.4-b.life;if(age>.45){const a=Math.atan2(P.y-b.y,P.x-b.x);b.vx=K.lerp(b.vx,Math.cos(a)*560,.08);b.vy=K.lerp(b.vy,Math.sin(a)*560,.08);if(Math.hypot(P.x-b.x,P.y-b.y)<20)b.life=0}}
  b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.rot!=null)b.rot+=dt*14;
  for(const e of ens){if(e.dead||b.life<=0)continue;if(Math.hypot(e.x-b.x,e.y-b.y)<e.r+b.r){if(b.hitT){if(t-(b.hitT.get(e)||-9)<.35)continue;b.hitT.set(e,t)}else if(b.hitSet&&b.hitSet.has(e))continue;(b.hitSet||(b.hitSet=new Set())).add(e);hit(e,b.dmg,b.vx*.25,b.vy*.25);if(--b.pierce<=0)b.life=0}}}
 bul=bul.filter(b=>b.life>0);
 for(const g of gems){const d=Math.hypot(P.x-g.x,P.y-g.y);if(d<P.mag||g.pull){g.pull=1;g.x+=(P.x-g.x)/d*520*dt;g.y+=(P.y-g.y)/d*520*dt}if(d<18){g.got=1;P.xp+=g.v;K.tone(900+Math.random()*300,.05,.03,'sine')}}gems=gems.filter(g=>!g.got);if(gems.length>500)gems.splice(0,gems.length-500);
 while(P.xp>=P.need){P.xp-=P.need;P.need=Math.floor(3+P.lvl*2.5+Math.pow(P.lvl,1.45));lvlQ++;if(lvlQ===1){P.lvl++;levelUp()}else P.lvl++}
 for(const it of items){if(Math.hypot(P.x-it.x,P.y-it.y)<28){it.got=1;if(it.k==='food'){P.hp=Math.min(P.max,P.hp+30);K.sfx('good')}else if(it.k==='magnet'){gems.forEach(g=>g.pull=1);K.sfx('whoosh')}else chest()}}items=items.filter(i=>!i.got);
 if(t>=WIN_T)over(true)}
function over(won){state='end';hud.style.display='none';lvl.style.display='none';K.sfx(won?'win':'lose');const mm=Math.floor(t/60),ss=String(Math.floor(t%60)).padStart(2,'0');const best=K.store.get('ho_best',0);if(t>best)K.store.set('ho_best',Math.floor(t));
 K.result(won?'🏆 ÜBERLEBT!':'💀 ÜBERRANNT',`<p style="font-size:22px">Zeit: <b>${mm}:${ss}</b> · Level ${P.lvl} · ${kills} Monster besiegt</p><p>${Object.entries(P.w).map(([k,l])=>WP[k].e+' '+l).join(' &nbsp; ')}</p><p class="k-mut">Bestzeit: ${Math.floor(Math.max(best,t)/60)}:${String(Math.floor(Math.max(best,t)%60)).padStart(2,'0')}</p>`,[{t:'🔁 Nochmal',f:start},{t:'Menü',f:menu}])}
/* ---------- Zeichnen ---------- */
const FLOW=[...Array(60)].map(()=>[Math.random()*800,Math.random()*800,K.pick(['#fde047','#f472b6','#fff','#a78bfa']),Math.random()]);
function draw(dt,T){C.begin('#2f5d2a');const W=innerWidth,H=innerHeight;if(state!=='play'&&state!=='end'||!P)return;cam.x=K.lerp(cam.x,P.x,.15);cam.y=K.lerp(cam.y,P.y,.15);const ox=W/2-cam.x,oy=H/2-cam.y;
 x.fillStyle='#3d7a34';const ts=80;for(let i=Math.floor(-ox/ts)-1;i<(W-ox)/ts+1;i++)for(let j=Math.floor(-oy/ts)-1;j<(H-oy)/ts+1;j++)if((i+j)&1)x.fillRect(i*ts+ox,j*ts+oy,ts,ts);
 for(const f of FLOW){const fx_=((f[0]-cam.x)%800+800)%800,fy_=((f[1]-cam.y)%800+800)%800;for(let a=0;a<W;a+=800)for(let b=0;b<H;b+=800){x.fillStyle=f[2];x.beginPath();x.arc(fx_+a,fy_+b,3,0,TAU);x.fill()}}
 x.save();x.translate(ox,oy);
 for(const g of gems){x.fillStyle=g.v>=8?'#f43f5e':g.v>=3?'#22d3ee':'#4ade80';x.beginPath();x.moveTo(g.x,g.y-7);x.lineTo(g.x+5,g.y);x.lineTo(g.x,g.y+7);x.lineTo(g.x-5,g.y);x.fill()}
 for(const it of items){const s=it.k==='chest'?'🎁':it.k==='food'?'🍗':'🧲';x.drawImage(spr(s,16),it.x-16,it.y-16-Math.abs(Math.sin(T*4))*5)}
 if(P.w.garlic){const R=60+P.w.garlic*14+pv('amt')*6;x.fillStyle=`rgba(255,255,220,${.12+.04*Math.sin(T*6)})`;x.beginPath();x.arc(P.x,P.y,R,0,TAU);x.fill();x.strokeStyle='rgba(255,255,220,.35)';x.lineWidth=2;x.stroke()}
 for(const e of ens){const R=Math.round(e.r*1.35),s=spr(EN[e.t][0],R),b=Math.sin(T*8+e.wob)*2;x.fillStyle='rgba(0,0,0,.22)';x.beginPath();x.ellipse(e.x,e.y+e.r*.8,e.r*.7,e.r*.25,0,0,TAU);x.fill();x.save();if(e.x>P.x){x.translate(e.x,0);x.scale(-1,1);x.translate(-e.x,0)}if(e.fl>0)x.filter='brightness(3)';x.drawImage(s,e.x-R,e.y-R+b,R*2,R*2);x.restore();
  if(e.big){x.fillStyle='rgba(0,0,0,.5)';x.fillRect(e.x-e.r,e.y-e.r-10,e.r*2,5);x.fillStyle='#ef4444';x.fillRect(e.x-e.r,e.y-e.r-10,e.r*2*e.hp/e.max,5)}}
 if(P.w.books){const L=P.w.books,n=1+L+amt(),R=80+L*8;for(let i=0;i<n;i++){const a=P.ba+i*TAU/n;x.drawImage(spr('📖',14),P.x+Math.cos(a)*R-14,P.y+Math.sin(a)*R-14)}}
 for(const b of bul){if(b.k==='wand'){x.fillStyle='#a5f3fc';x.shadowColor='#22d3ee';x.shadowBlur=12;x.beginPath();x.arc(b.x,b.y,6,0,TAU);x.fill();x.shadowBlur=0}else if(b.k==='fire'){x.fillStyle='#fb923c';x.shadowColor='#f97316';x.shadowBlur=18;x.beginPath();x.arc(b.x,b.y,b.r*.8,0,TAU);x.fill();x.fillStyle='#fde047';x.beginPath();x.arc(b.x,b.y,b.r*.4,0,TAU);x.fill();x.shadowBlur=0}
  else{x.save();x.translate(b.x,b.y);x.rotate(b.rot||0);x.drawImage(spr(b.k==='axe'?'🪓':'🪃',16),-16,-16);x.restore()}}
